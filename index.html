                : ((i===0 && mv.filter!=='ociosos') ? '<span class="tag solid">'+(mv.metric==='km'?'Mais rodado':'Mais horas')+'</span>' : '');
        return '<div class="rrow" tabindex="0" role="button" data-placa="'+esc(v.placa)+'" aria-label="Ver ficha de '+esc(v.placa)+'">'+
                 '<span class="plate">'+esc(v.placa)+'</span>'+
                 '<div class="who"><div class="model"><span class="mname">'+esc(v.modelo)+'</span>'+etq+'</div>'+
                   '<div class="bar"><i style="--w:'+w+'%"></i></div></div>'+
                 '<span class="kv">'+nfDash(val,' '+unit)+'<small>'+altVal+'</small></span>'+
               '</div>';
      }).join('');
      if(!reduce && !instant){ requestAnimationFrame(function(){ Array.prototype.forEach.call(rank.querySelectorAll('.bar>i'),function(i){ i.style.width=i.style.getPropertyValue('--w'); }); }); }
      else { Array.prototype.forEach.call(rank.querySelectorAll('.bar>i'),function(i){ i.style.width=i.style.getPropertyValue('--w'); }); }
      var mw=el('mvMoreWrap');
      if(!showAll && arr.length>5){
        mw.innerHTML='<button class="more" id="mvMore">Ver todos os '+arr.length+' veículos, expandir</button>';
        el('mvMore').addEventListener('click',function(){ mv.expanded=true; renderRank(); });
      } else if(mv.filter!=='ociosos' && mv.expanded && arr.length>5){
        mw.innerHTML='<button class="more" id="mvLess">Mostrar só o topo</button>';
        el('mvLess').addEventListener('click',function(){ mv.expanded=false; renderRank(); });
      } else { mw.innerHTML=''; }
    }
    renderRank();

    // ---------- Utilização · colapsa em 5 (menos rodados primeiro), expande no padrão do ranking ----------
    var uU=D.utilizacao, uLista=null, uNd=0;
    function renderUtil(){
      if(!uU||!el('utilRows')) return;
      var showAll=util.expanded, shown=showAll?uLista:uLista.slice(0,5);
      el('utilRows').innerHTML=shown.map(function(pv){ return utilRowHtml(uU,pv,uNd); }).join('');

        mw.innerHTML='<button class="more" id="utilMore">Ver todos os '+uLista.length+' veículos</button>';

    // ---------- Km por dia · tooltip por barra (hover no desktop + toque no mobile, sem sequestrar a rolagem) ----------
    (function(){
      var chart=sec.querySelector('.kmchart'); if(!chart) return;
      var svg=chart.querySelector('svg'), tip=el('kmTip'), arr=(D.km_diario||[]), n=arr.length;
      if(!svg||!tip||!n) return;
      /* SELETOR BARRAS / VELAS. O estado mora numa classe no `.kmwrap`, nao numa
         variavel: assim o CSS troca o desenho, a legenda e o rotulo do pico de
         uma vez, e a dica so precisa perguntar em que modo esta. */
      var wrap=chart.closest('.kmwrap'), modo=el('kmModo');
      if(modo){
        modo.addEventListener('click',function(ev){
          var b=ev.target.closest('button[data-modo]'); if(!b) return;
          var vela=b.getAttribute('data-modo')==='velas';
          wrap.classList.toggle('velas',vela);
          chart.classList.toggle('velas',vela);
          Array.prototype.forEach.call(modo.querySelectorAll('button'),function(x){
            x.setAttribute('aria-pressed', String(x===b)); });
          hide();
        });
      }
      var kmMax=arr.reduce(function(m,x){ return Math.max(m,x.km||0); },0)||1;
      function fmtD(d){ var pp=(d||'').split('-'); return (pp[2]||'')+'/'+(pp[1]||''); }
      function show(clientX){
        var r=svg.getBoundingClientRect(); if(!r.width) return;
        var idx=Math.floor(((clientX-r.left)/r.width)*n);
        if(idx<0) idx=0; if(idx>=n) idx=n-1;
        var x=arr[idx]; if(!x) return;
        var H=44, base=H-1, topPad=3, yTop, esq;
        if(chart.classList.contains('velas')){
          /* na leitura semanal a dica fala da SEMANA que contem o dia apontado,
             e mostra os quatro numeros que a vela desenha */
          var v=null, cands=svg.querySelectorAll('.kmvela');
          for(var q=0;q<cands.length;q++){
            if(idx>=+cands[q].getAttribute('data-i0') && idx<=+cands[q].getAttribute('data-i1')){ v=cands[q]; break; }
          }
          if(!v) return;
          var ab=+v.getAttribute('data-ab'), fe=+v.getAttribute('data-fe'),
              hi=+v.getAttribute('data-hi'), lo=+v.getAttribute('data-lo'),
              i0=+v.getAttribute('data-i0'), i1=+v.getAttribute('data-i1');
          tip.innerHTML='<b>'+v.getAttribute('data-de')+' a '+v.getAttribute('data-ate')+'</b>'
            + '<i>abriu '+nf(ab)+', fechou '+nf(fe)+' km'
            + '<br>melhor dia '+nf(hi)+', pior '+nf(lo)+'</i>';
          esq=(((i0+i1+1)/2)/n)*100;
          yTop=base-(Math.max(ab,fe)/kmMax)*(base-topPad);
          marcarVela(v);
        } else {
          var bar=svg.querySelector('.kmbar[data-i="'+idx+'"]');
          var at=bar?bar.getAttribute('data-at'):null;
          var pa=bar?bar.getAttribute('data-pa'):null;
          tip.innerHTML='<b>'+fmtD(x.d)+'</b>, '+nf(x.km||0)+' km'
            + (at!=null ? '<i>'+at+(at==='1'?' veículo':' veículos')
                         + (pa? ', '+nf(pa)+' km cada':'') +'</i>' : '');
          esq=((idx+0.5)/n)*100;
          yTop=base-((x.km||0)/kmMax)*(base-topPad);
        }
        tip.style.left=esq.toFixed(2)+'%';
        tip.style.top=((yTop/H)*100).toFixed(2)+'%';
        tip.classList.add('on');
        marcar(idx); iAtual=idx;
      }
      function hide(){ tip.classList.remove('on'); marcar(-1); marcarVela(null); }
      function marcarVela(v){
        var vs=svg.querySelectorAll('.kmvela');
        for(var q=0;q<vs.length;q++) vs[q].classList.toggle('hov', vs[q]===v);
      }
      /* MARCAR A BARRA, nao so mostrar o numero: o tooltip dizia "14/07" e o
         leitor tinha que achar sozinho de qual barra falava. */
      var barras=svg.querySelectorAll('.kmbar');
      function marcar(i){
        for(var k=0;k<barras.length;k++) barras[k].classList.toggle('hov', k===i);
      }
      /* TECLADO. O grafico so respondia a mouse e dedo; com 31 barras finas,
         quem navega por teclado nao alcancava nenhuma. Setas andam dia a dia,
         Home e End vao as pontas. */
      var iAtual=-1;
      svg.setAttribute('tabindex','0');
      svg.setAttribute('aria-label', svg.getAttribute('aria-label')+'. Use as setas para percorrer os dias.');
      function irPara(i){
        if(i<0) i=0; if(i>=n) i=n-1;
        iAtual=i;
        var r=svg.getBoundingClientRect();
        show(r.left + ((i+0.5)/n)*r.width);
      }
      svg.addEventListener('keydown',function(e){
        var k=e.key;
        if(k==='ArrowRight'||k==='ArrowUp'){ e.preventDefault(); irPara(iAtual+1); }
        else if(k==='ArrowLeft'||k==='ArrowDown'){ e.preventDefault(); irPara(iAtual<0?n-1:iAtual-1); }
        else if(k==='Home'){ e.preventDefault(); irPara(0); }
        else if(k==='End'){ e.preventDefault(); irPara(n-1); }
        else if(k==='Escape'){ hide(); iAtual=-1; svg.blur(); }
      });
      svg.addEventListener('blur',hide);
      svg.addEventListener('pointermove',function(e){ show(e.clientX); });
      svg.addEventListener('pointerover',function(e){ show(e.clientX); }); // entrar parado (ex.: rolagem de trackpad) também mostra
      svg.addEventListener('pointerleave',hide);
      svg.addEventListener('pointerdown',function(e){ show(e.clientX); }); // toque: não damos preventDefault, então a rolagem segue livre
      document.addEventListener('pointerdown',function(e){ if(!chart.contains(e.target)) hide(); });
    })();

    el('mvMetric').addEventListener('click',function(e){ var btn=e.target.closest('button'); if(!btn) return;
      mv.metric=btn.getAttribute('data-m');
      Array.prototype.forEach.call(this.children,function(c){ c.setAttribute('aria-pressed', c===btn?'true':'false'); }); renderRank(); });
    el('mvFilter').addEventListener('click',function(e){ var btn=e.target.closest('button'); if(!btn) return;
      mv.filter=btn.getAttribute('data-f'); mv.expanded=false;
      Array.prototype.forEach.call(this.children,function(c){ c.setAttribute('aria-pressed', c===btn?'true':'false'); }); renderRank(); });
    if(el('mvTipo')) el('mvTipo').addEventListener('click',function(e){ var btn=e.target.closest('button'); if(!btn) return;
      mv.tipo=btn.getAttribute('data-t'); mv.expanded=false;
      /* maquina se le por horimetro: escolher Maquinas muda a metrica pra horas sozinho */
      if(mv.tipo==='maquinas' && mv.metric==='km'){ mv.metric='horas'; }
      Array.prototype.forEach.call(this.children,function(c){ c.setAttribute('aria-pressed', c===btn?'true':'false'); });
      applyMvBtns(); renderRank(); });
    el('mvRank').addEventListener('click',function(e){ var row=e.target.closest('.rrow'); if(row) openDetail(row.getAttribute('data-placa')); });
    el('mvRank').addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ var row=e.target.closest('.rrow'); if(row){ e.preventDefault(); openDetail(row.getAttribute('data-placa')); } } });

    function applyMvBtns(){
      Array.prototype.forEach.call(el('mvMetric').children,function(c){ c.setAttribute('aria-pressed', c.getAttribute('data-m')===mv.metric?'true':'false'); });
      Array.prototype.forEach.call(el('mvFilter').children,function(c){ c.setAttribute('aria-pressed', c.getAttribute('data-f')===mv.filter?'true':'false'); });
      if(el('mvTipo')) Array.prototype.forEach.call(el('mvTipo').children,function(c){ c.setAttribute('aria-pressed', c.getAttribute('data-t')===mv.tipo?'true':'false'); });
    }
    // impressão: mostra os 14 (km, todos) e expande a utilização inteira; restaura o estado web depois
    var mvPrev=null, utilPrev=null;
    window.addEventListener('beforeprint',function(){ mvPrev={m:mv.metric,f:mv.filter,t:mv.tipo,e:mv.expanded}; mv.metric='km'; mv.filter='todos'; mv.tipo='frota'; mv.expanded=true; applyMvBtns(); renderRank();
      utilPrev=util.expanded; util.expanded=true; renderUtil(); });
    window.addEventListener('afterprint',function(){ if(mvPrev){ mv.metric=mvPrev.m; mv.filter=mvPrev.f; mv.tipo=mvPrev.t||'frota'; mv.expanded=mvPrev.e; mvPrev=null; applyMvBtns(); renderRank(); }
      if(utilPrev!=null){ util.expanded=utilPrev; utilPrev=null; renderUtil(); } });

    initMapa();
  })();

  // ---------- Bloco · Máquinas (só quando a frota tem; completo mas resumido) ----------
  // Maquina nao roda km, produz horas: esta secao conta o mes delas inteiro num bloco so —
  // horas totais, quem trabalhou, quem parou, dias de trabalho e marco de horimetro.
  (function(){
    var sec=el('maquinas'); if(!sec || !temMaquinas) return;
    var maqs=veiculos.filter(function(v){ return v.tipo==='maquina'; });
    var totalH=0, emOp=0, paradas=0;
    maqs.forEach(function(v){ if(typeof v.horas==='number') totalH+=v.horas; if(v.ocioso===true) paradas+=1; else if((v.horas||0)>0) emOp+=1; });
    var mediaH=maqs.length?Math.round(totalH/maqs.length):0;
    // dias de trabalho por placa (a grade de utilizacao ja acende o dia pelo horimetro)
    var diasMap={}, nd=0;
    if(D.utilizacao&&D.utilizacao.por_placa){ nd=(D.utilizacao.dias||[]).length;
      D.utilizacao.por_placa.forEach(function(p){ diasMap[p.placa]=(p.dias_rodados!=null)?p.dias_rodados:(p.mapa||[]).reduce(function(s,x){return s+(x?1:0);},0); }); }
    var rankM=maqs.slice().sort(function(a,b){ return (b.horas||0)-(a.horas||0); });
    var maxH=Math.max(1,rankM.length?(rankM[0].horas||0):1);
    var top=rankM.slice(0,5);
    var marcos=(D.manutencao||[]).filter(function(x){ return x.marco_h!=null; });
    var insM = paradas>0
      ? (paradas+' '+(paradas===1?'máquina não trabalhou':'máquinas não trabalharam')+' no período, máquina parada é capital e locação sem retorno, vale conferir a alocação.')
      : 'Todas as máquinas produziram horas no período, o parque está alocado.';
    var h='<div class="block-head reveal"><span class="eyebrow">'+SECNUM['maquinas']+' Máquinas</span>'+
      '<h2>O trabalho medido em horas</h2>'+
      '<p class="sub">Máquina não roda km, produz hora de motor. Este é o mês do seu parque, contado pelo horímetro.</p></div>'+
      '<div class="hero-stat reveal"><span class="big grad" id="mqH">0</span>'+
        '<span class="cap"><span class="u">horas de trabalho no horímetro</span>'+
        '<span class="lbl">'+nf(maqs.length)+' '+(maqs.length===1?'máquina':'máquinas')+' sob monitoramento 24h</span></span></div>'+
      '<div class="substats reveal">'+
        '<div class="s"><div class="n mono" id="mqOp">0</div><div class="l">Em operação</div></div>'+
        '<div class="s"><div class="n mono" id="mqPar">0</div><div class="l">Paradas no período</div></div>'+
        '<div class="s"><div class="n mono" id="mqMed">0</div><div class="l">Média de horas por máquina</div></div>'+
      '</div>'+
      '<div class="rank reveal">'+top.map(function(v,i){
        var w=Math.max(4,Math.round((v.horas||0)/maxH*100));
        var dias=diasMap[v.placa];
        var etq=(v.ocioso===true)?'<span class="tag ghost">Parada</span>':(i===0&&(v.horas||0)>0?'<span class="tag solid">Mais horas</span>':'');
        return '<div class="rrow" tabindex="0" role="button" data-placa="'+esc(v.placa)+'" aria-label="Ver ficha de '+esc(v.placa)+'">'+
          '<span class="plate">'+esc(v.placa)+'</span>'+
          '<div class="who"><div class="model"><span class="mname">'+esc(v.modelo)+'</span>'+etq+'</div>'+
            '<div class="bar"><i style="--w:'+w+'%"></i></div></div>'+
          '<span class="kv">'+nfDash(v.horas,' h')+(dias!=null&&nd?('<small>'+dias+' de '+nd+' dias</small>'):'')+'</span>'+
        '</div>';
      }).join('')+'</div>'+
      (rankM.length>5?'<p class="note reveal">Mostrando as 5 de maior atividade de '+nf(rankM.length)+' máquinas, todas estão no recorte Máquinas da frota em movimento.</p>':'')+
      (marcos.length?('<p class="alerts-cap reveal">Revisão pelo horímetro</p>'+
        '<div class="alerts reveal">'+marcos.map(function(x){
          return '<div class="acard"><div class="aq mono">'+esc(x.placa)+'</div>'+
            '<div class="at">passou das '+nf(x.marco_h)+' h de motor, programe a revisão</div>'+
            '<div class="at mnt-odo">Horímetro: '+nf(x.horimetro)+' h</div></div>';
        }).join('')+'</div>'):'')+
      insightHtml(insM);
    sec.innerHTML=h;
    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });
    watch(sec.querySelector('.hero-stat'),function(){ countUp(el('mqH'), Math.round(totalH)); });
    watch(sec.querySelector('.substats'),function(){ countUp(el('mqOp'), emOp); countUp(el('mqPar'), paradas); countUp(el('mqMed'), mediaH); });
    if(!reduce && !instant){ requestAnimationFrame(function(){ Array.prototype.forEach.call(sec.querySelectorAll('.bar>i'),function(i){ i.style.width=i.style.getPropertyValue('--w'); }); }); }
    else { Array.prototype.forEach.call(sec.querySelectorAll('.bar>i'),function(i){ i.style.width=i.style.getPropertyValue('--w'); }); }
    sec.addEventListener('click',function(e){ var row=e.target.closest('.rrow'); if(row) openDetail(row.getAttribute('data-placa')); });
    sec.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ var row=e.target.closest('.rrow'); if(row){ e.preventDefault(); openDetail(row.getAttribute('data-placa')); } } });
  })();

  // ---------- Bloco · Sua frota vs o mercado (benchmark anônimo por porte) ----------
  (function(){
    var sec=el('benchmark'); if(!sec || !temBench) return;
    var bm=D.benchmark;
    var sub = bm.frotas_no_porte!=null
      ? 'Comparado com '+nf(bm.frotas_no_porte)+' frotas de '+esc(bm.porte||'seu porte')+', dados anônimos da carteira Rastcar.'
      : 'Comparado com frotas do seu porte, dados anônimos da carteira Rastcar.';
    var linhas=bm.metricas.map(function(m){
      var melhor=(m.melhor_e||m['melhor_é']||'maior');
      var voce=Number(m.voce), media=Number(m.media);
      var max=Math.max(voce,media)||1;
      var better = melhor==='menor' ? (voce<=media) : (voce>=media);
      var pct = media ? Math.round((voce/media-1)*100) : 0, absp=Math.abs(pct);
      var seta = voce>media ? '↑' : (voce<media ? '↓' : '=');
      var chip = absp===0
        ? '<span class="tag ghost">Na média do porte</span>'
        : '<span class="tag '+(better?'good':'warn')+'">'+absp+'% '+(voce>media?'acima':'abaixo')+' da média</span>';
      var nomeL=esc(String(m.nome||'').toLowerCase());
      var read = absp===0
        ? 'Sua frota está na média do seu porte em '+nomeL+'.'
        : (better
            /* sem tapinha nas costas depois do ponto: o numero JA e o veredito.
               A ma noticia ganha cauda porque ela pede acao, e a cauda e o link
               pro plano. A boa nao precisa de nada. */
            ? 'Sua frota está '+absp+'% melhor que a média do seu porte em '+nomeL+'.'
            : 'Sua frota está '+absp+'% pior que a média do seu porte em '+nomeL+', <a href="#plano">o plano do próximo mês ataca isso</a>.');
      var wYou=Math.max(4,Math.round(voce/max*100)), wAvg=Math.max(4,Math.round(media/max*100));
      return '<div class="bm">'+
        '<div class="bm-head"><span class="bm-name">'+esc(m.nome)+'</span>'+chip+'</div>'+
        '<div class="bm-row"><span class="bm-l">Você</span><div class="bbar"><i class="you '+(better?'ok':'bad')+'" style="--w:'+wYou+'%"></i></div><span class="bm-v">'+nf(voce)+'</span></div>'+
        '<div class="bm-row"><span class="bm-l">Média do porte</span><div class="bbar"><i class="avg" style="--w:'+wAvg+'%"></i></div><span class="bm-v">'+nf(media)+'</span></div>'+
        '<p class="bm-read">'+read+'</p>'+
      '</div>';
    }).join('');

  // ---------- Bloco 3 · Vigilância ativa ----------
  // mapa de calor de alertas · o robô manda a matriz 7×24 (linha 0 = segunda); o front agrega em 4 períodos
  function heatAlertasHtml(ha){
    var M=ha&&ha.matriz; if(!M||!M.length||!ha.total) return '';
    var dias=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    var diasFull=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
    var periodos=[['Madrugada','0h às 6h',0,6],['Manhã','6h às 12h',6,12],['Tarde','12h às 18h',12,18],['Noite','18h às 24h',18,24]];
    // agrega as 24 horas de cada dia nos 4 períodos
    var grid=M.map(function(lin){ lin=lin||[];
      return periodos.map(function(p){ var s=0; for(var h=p[2];h<p[3];h++){ s+=(lin[h]||0); } return s; });
    });
    var max=0, mi=0, mj=0;
    for(var i=0;i<grid.length;i++){ for(var j=0;j<grid[i].length;j++){ if(grid[i][j]>max){ max=grid[i][j]; mi=i; mj=j; } } }
    if(max<=0) return '';
    /* Semaforo, e por que o divisor NAO e so o pico do mes.
       Escala 100% absoluta (12 alertas = vermelho) quebra nos dois extremos:
       cliente calmo fica todo verde, cliente grande fica todo vermelho, e o
       padrao, que e a unica coisa que esta secao serve pra ler, some.
       Escala 100% relativa quebra no mes calmo: 2 alertas virariam vermelho.
       Divisor = max(pico, 12): abaixo de 12 vale o significado absoluto,
       acima disso a leitura volta a ser relativa e o padrao reaparece. */
    var div=Math.max(max,12);
    /* Rampa verde vivo -> vermelho, em 5 paradas.
       CURVA, e por que ela nao e reta. Numa escala linear de 0 a 24, com 22 das
       28 celulas valendo de 0 a 6, 78% do mapa se espremia no primeiro quarto
       da rampa e saia tudo do mesmo verde: a grade ficava lisa e o padrao,
       que e a unica coisa que esta secao serve pra ler, desaparecia. A gama
       0,62 abre justamente a faixa baixa, que e onde os dados moram. */
    var PARADAS=[[0,18,184,6],[.25,126,211,33],[.5,255,196,0],[.75,249,115,22],[1,234,27,18]];
    function rampa(bruto){
      var f=Math.pow(Math.max(0,Math.min(1,bruto)),0.62);
      var a=PARADAS[0], b=PARADAS[PARADAS.length-1];
      for(var s=0;s<PARADAS.length-1;s++){
        if(f>=PARADAS[s][0]&&f<=PARADAS[s+1][0]){ a=PARADAS[s]; b=PARADAS[s+1]; break; } }
      var g=(b[0]-a[0])?(f-a[0])/(b[0]-a[0]):0;
      var r=Math.round(a[1]+(b[1]-a[1])*g),
          v=Math.round(a[2]+(b[2]-a[2])*g),
          z=Math.round(a[3]+(b[3]-a[3])*g);
      /* Devolve so o MATIZ e a posicao na rampa. Quanto do matiz entra e
         contra que fundo, e conta do CSS, porque a resposta muda com o tema:
         no claro a celula se dilui no branco e no escuro no cinza do painel.
         Fixar a proporcao aqui foi o erro que fez o numero branco reprovar em
         9 das 11 celulas do tema escuro. */
      return ['rgb('+r+','+v+','+z+')', f];
    }
    var head='<div class="hm-corner"></div>'+periodos.map(function(p){
      return '<div class="hm-ph">'+p[0]+'<small>'+p[1]+'</small></div>'; }).join('');
    var corpo='';
    for(var d=0;d<grid.length;d++){
      corpo+='<div class="hm-day">'+(dias[d]||('D'+d))+'</div>';
      for(var k=0;k<4;k++){
        var val=grid[d][k];
        var c=rampa(val/div);
        corpo+='<div class="hm-cell'+(val<=0?' z':'')+(c[1]>=0.94?' quente':'')
             +'" style="--hm:'+c[0]+';--f:'+c[1].toFixed(3)+'" title="'
             +(dias[d]||'')+', '+periodos[k][0]+', '+val+(val===1?' alerta':' alertas')+'">'+val+'</div>';
      }
    }
    var read='Seu risco se concentra na '+periodos[mj][0].toLowerCase()+' de '+diasFull[mi]+', é quando vale reforçar a atenção.';
    return '<p class="alerts-cap reveal">Quando os alertas acontecem, por período do dia</p>'+
      '<div class="hm-wrap reveal"><div class="hmgrid">'+head+corpo+'</div>'+
        '<div class="hm-leg"><span>sem alerta</span><span class="hm-ramp"></span><span>'+div+' ou mais</span></div></div>'+
      insightHtml(read);
  }
  (function(){

      h+='<p class="alerts-cap reveal">O que a central 24h viu e tratou</p>'+

        var pl=(a.placas&&a.placas.length)?'<div class="at" style="margin-top:6px;font-family:var(--title);font-weight:700;letter-spacing:.01em;color:var(--crimson-txt)">'+a.placas.map(esc).join(', ')+'</div>':'';
        return '<div class="acard"><div class="aq mono">'+nf(a.qtd)+'</div><div class="at">'+esc(a.tipo)+'</div>'+pl+'</div>';
      }).join('')+'</div>'+
      insightHtml('A central 24h tratou '+nf(totalAlertas)+' alertas neste mês, cada um é um olho que você não precisou ter.');
    }
    var sd2=v.saude;
    if(sd2){
      var bf=(sd2.bateria_fraca||[]);
      /* a lista de bateria e RESUMO, nunca muro: a IDEAL abriu com 31 placas emendadas
         atravessando a tela. Acima de 6, conta e aponta as piores.
         TRAVA DE MARCA: nada aqui pode ler como falha da Rastcar — o card "sem leitura de
         tensao" foi REMOVIDO da tela (o dado segue no payload pra auditoria) e o card de
         comunicacao virou a afirmacao positiva do monitoramento. */
      var bfShow=bf.slice(0,6).map(function(x){ return esc(x.placa)+', '+String(x.volts).replace('.',',')+' V'; }).join('  ');
      if(bf.length>6) bfShow+='  e mais '+nf(bf.length-6);
      h+='<p class="alerts-cap reveal">Saúde da frota, lida pelo rastreador</p>'+
        '<div class="alerts reveal">'+
          '<div class="acard"><div class="aq mono">'+nf(sd2.comunicando_total)+'</div><div class="at">Veículos sob monitoramento 24h</div></div>'+
          '<div class="acard"><div class="aq mono">'+bf.length+'</div><div class="at">Bateria de veículo fraca</div>'+
            (bf.length?'<div class="at" style="margin-top:6px;font-family:var(--title);font-weight:700;letter-spacing:.01em;color:var(--crimson-txt)">'+bfShow+'</div>':'')+'</div>'+
          '<div class="acard"><div class="aq mono">'+(sd2.violacoes||0)+'</div><div class="at">Violações de equipamento</div></div>'+
        '</div>'+
        '<p class="note reveal" style="margin-top:12px">A tensão é da bateria do próprio veículo, medida pelo rastreador, bateria caindo é aviso antes da pane, não depois.</p>';
    }
    /* O QUE A INTELIGENCIA VIU (toque CIA): briefing de padroes e anomalias do mes, cada
       linha derivada de dado ja presente na pagina — deteccao, nunca invencao. So aparece
       com 2+ sinais (1 sinal solto nao e briefing). */
    (function(){
      var sinais=[];
      var mad=(v.alertas||[]).filter(function(a){ return /madrugada/i.test(a.tipo||''); });
      if(mad.length){ var mq=mad.reduce(function(s,a){ return s+(a.qtd||0); },0);
        var pl=(mad[0].placas||[]);
        if(mq>0) sinais.push('Movimentação entre 22h e 5h: '+nf(mq)+' registros'+(pl.length?(', concentrados em '+joinNat(pl.slice(0,3).map(esc))):'')+'.'); }
      var kd=D.km_diario||[];
      if(kd.length>=7){

        if(ut.length&&fd.length){
          var mu=ut.reduce(function(s,x){return s+(x.km||0);},0)/ut.length, mf=fd.reduce(function(s,x){return s+(x.km||0);},0)/fd.length;
          if(mu>0){ var rr=mf/mu;
            if(rr>=0.7) sinais.push('Fins de semana rodando no ritmo da semana, padrão de operação contínua.');
            else if(rr<0.3) sinais.push('Fins de semana quase parados, padrão de semana cheia com descanso real da frota.'); } } }
      var cid=D.rotas_calor&&D.rotas_calor.cidades;

      h+='<p class="alerts-cap reveal">O que a inteligência viu no mês</p>'+

  // ---------- Bloco · Motoristas (identificação por chave eletrônica; só com D.motoristas) ----------

  (function(){

    var EV_LABEL={velocidade:['evento de velocidade','eventos de velocidade'],freada:['freada brusca','freadas bruscas'],

      fadiga:['alerta de fadiga','alertas de fadiga'],distracao:['alerta de distração','alertas de distração']};
    function evTxt(ev){

      '<div class="substats reveal">'+
        '<div class="s"><div class="n mono" id="mtA">0</div><div class="l">Autenticações no leitor</div></div>'+
        (pctId!=null?('<div class="s"><div class="n mono" id="mtP">0</div><div class="l">Dos km com motorista identificado</div></div>'):'')+
        (semId&&semId.km!=null?('<div class="s"><div class="n mono" id="mtS">0</div><div class="l">Km sem identificação no mês</div></div>'):'')+

  (function(){

  // ---------- Drill-down (ficha do veículo) ----------

  function openDetail(placa){

    if(!v) return;

    var h='<button class="x" id="shX" aria-label="Fechar">&times;</button>'+
      '<span class="sk">Ficha '+(ehMaq?'da máquina':'do veículo')+'</span>'+

      '<div class="sm">'+esc(v.modelo)+'</div>'+

      (ehMaq
        ? (drow('Horas de motor no mês', nfDash(v.horas,' h'), true)+
           (v.km!=null?drow('Km no mês', nf(v.km)+' km'):''))

      (v.km==null && !ehMaq ? drow('Medição', 'pelo horímetro, horas de motor') : '')+
      (v.op ? drow('Perfil', 'trabalha parado com o motor ligado, horas são operação') : '')+
      (vsTxt!=null ? drow('vs média da frota', esc(vsTxt), vsMedia>0) : '')+
      drow('Status', v.ocioso?(ehMaq?'Parada no período':'Subutilizado'):(ehMaq?'Em operação':'Ativo'));
    if(v.zona) h+=drow('Onde ficou mais tempo', esc(v.zona), true);
    if(cmp){ h+=drow('Score de comportamento', String(cmp.score), true)+

    else { h+='<p class="note">Comportamento por veículo, detalhado na próxima leitura mensal.</p>'; }
    h+='<p class="note">Dados de telemetria e rastreamento sob monitoramento 24h.</p>';

  // ---------- Bloco 6 · O plano do próximo mês (100% derivado dos dados já presentes) ----------
  (function(){
    var sec=el('plano'); if(!sec) return;
    var c=D.comportamento||{}; var ec=D.economia||null;
    var itens=[];
    /* PLANO, NAO DESPEJO. Numa frota de 212 veiculos, listar todos os que
       precisam de acao gerava uma frase de 870 caracteres (49 placas) na
       ultima secao do relatorio · o cliente le uma parede e nao age.
       Acima de 3, a acao passa a dizer o TAMANHO do problema e por onde
       comecar; a lista completa ja esta nas secoes acima. */
    /* o identificador fica como o cliente cadastrou · "2188" e o numero de
       frota, e e assim que ele chama o carro. Prefixar com "o veiculo"
       gerava "comece por o veiculo 2187". */
    function plano(arr){
      var a = arr.map(function(x){ return esc(x); });
      if(a.length <= 3) return {txt:joinNat(a), n:a.length};
      return {txt:nf(a.length)+' veículos, comece por '+joinNat(a.slice(0,3)), n:a.length};
    }
    var piores=(c.piores||[]).map(function(x){ return x.placa; });
    var ev=(c.piores||[]).reduce(function(acc,x){ return acc+(x.excessos||0); },0);
    /* sem excesso nenhum a frase virava "concentram 0 eventos de velocidade" */
    if(piores.length && ev>0){ var pl=plano(piores);
      itens.push('Conversar com '+pl.txt+', '+(pl.n===1?'concentra ':'concentram ')+nf(ev)+' eventos de velocidade.'); }
    var sub=(D.veiculos||[]).filter(function(v){ return v.ocioso; }).map(function(v){ return v.placa; });
    if(sub.length) itens.push('Reavaliar a escala de '+plano(sub).txt+', capacidade parada é frota que você já pagou.');
    var bf=(D.vigilancia&&D.vigilancia.saude&&D.vigilancia.saude.bateria_fraca)||[];
    if(bf.length){ var pb=plano(bf.map(function(x){ return x.placa; }));
      itens.push('Trocar a bateria '+(pb.n===1?'do ':'de ')+pb.txt+' antes que vire pane na estrada.'); }
    var mnt=(D.manutencao||[]);
    if(mnt.length) itens.push('Agendar a revisão de '+plano(mnt.map(function(x){ return x.placa; })).txt+', cruzou marco de revisão este mês.');
    if(ec) itens.push('Derrubar o custo do tempo ocioso em um terço, devolve na ordem de R$ '+
      Math.round(ec.horas_ociosas_mes*ec.premissa_litros_hora*ec.premissa_preco_litro/3).toLocaleString('pt-BR')+' por mês.');
    if(!itens.length){ sec.style.display='none'; return; }
    var sf=c.score_frota||0;
    var h='<div class="block-head reveal"><span class="eyebrow">'+SECNUM['plano']+' O plano</span>'+
      '<h2>O que fazer no próximo mês</h2>'+
      '<p class="sub">Cada ação com placa e prazo. O próximo relatório mostra o efeito.</p></div>'+
      '<div class="indics reveal" style="margin-top:6px">'+itens.map(function(t,i){
        return '<div class="indic'+(i===0?' p1':'')+'"><span class="dot"></span><span class="it">'+t+'</span>'+
               (i===0?'<span class="tag solid">Começar por aqui</span>':'')+'</div>'; }).join('')+'</div>'+
      /* frota ja no teto pedia "de 100 para 100" · quem chegou la nao tem
         para onde subir, tem o que sustentar */
      (sf ? '<p class="anchor reveal grad" style="margin-top:24px">' +
            (sf >= 98 ? 'Meta: manter o score da frota em ' + sf + '.'
                      : 'Meta: score da frota de ' + sf + ' para ' + Math.min(100, sf+3) + '.') +
            '</p>' : '');
    sec.innerHTML=h;
    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });
  })();

       gera uma string de dezenas de placas que atravessa a lamina inteira

    /* a frase inteira num SO item de flex: solta, o "<span class=scr>" virava

       TOQUE"). O gap existe pro risco do ::before e nao pode sair. */
    sec.innerHTML='<p class="dgt reveal"><span>O mês inteiro em nove linhas<span class="scr"> · abra qualquer uma</span></span></p>'+
      '<div class="dgrid reveal">'+rows.join('')+'</div>';

    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });

  // ---------- Mapa real de concentração (Leaflet + OpenStreetMap · só renderiza com dado) ----------
  function initMapa(){
    var alvo=el('rzMap'); if(!alvo) return;
    var rc=D.rotas_calor;
    function esconder(){ var w=document.querySelector('.heat-wrap'); if(w) w.style.display='none'; }
    if(!(rc&&rc.pontos&&rc.pontos.length)){ esconder(); return; }
    var css=document.createElement('link'); css.rel='stylesheet';
    css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    function carrega(src,ok,erro){ var sc=document.createElement('script'); sc.src=src; sc.onload=ok; sc.onerror=erro; document.head.appendChild(sc); }
    carrega('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',function(){
        try{
          var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
          var anim=!reduce;
          var m=L.map('rzMap',{scrollWheelZoom:false,zoomControl:true,preferCanvas:true});
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {maxZoom:17,detectRetina:true,attribution:'&copy; OpenStreetMap'}).addTo(m);
          // um ponto por VEICULO na zona dominante · hover = placa · clique = ficha
          // (decisão do dono 21/07: SEM camada de calor · só os veículos)
          var marcadores={};
          var comPos=(D.veiculos||[]).filter(function(v){ return v.pos; });
          comPos.forEach(function(v){
            marcadores[v.placa]=L.circleMarker([v.pos.lat,v.pos.lng],{radius:isTouch?8:6,color:'#EC1222',weight:2,
              fillColor:'#D1B0D7',fillOpacity:.9})
             .addTo(m)
             .bindTooltip('<b>'+esc(v.placa)+'</b>, '+esc(v.modelo)+'<br>'+nf(v.km)+' km, '+nf(v.horas)+' h, '+esc(v.zona||''),
               {direction:'top',offset:[0,-6],opacity:1})
             .on('click',function(){ openDetail(v.placa); });
          });
          var bounds=comPos.length ? comPos.map(function(v){ return [v.pos.lat,v.pos.lng]; })
                                   : rc.pontos.map(function(p){ return [p.lat,p.lng]; });
          m.fitBounds(bounds,{padding:[34,34]});

          // ---- navegação rápida ----
          var setChip=function(){};
          function frotaToda(){ m.flyToBounds(bounds,{padding:[34,34],duration:.7,animate:anim}); setChip(null); }

          // chips de placa: um toque voa até o veículo e abre a etiqueta
          if(comPos.length){
            var chips=document.createElement('div'); chips.className='mchips';
            chips.innerHTML='<button type="button" data-p="__all">Frota toda</button>'+comPos.map(function(v){
              return '<button type="button" data-p="'+esc(v.placa)+'">'+esc(v.placa)+'</button>'; }).join('');
            alvo.parentNode.insertBefore(chips, alvo);
            setChip=function(p){ Array.prototype.forEach.call(chips.children,function(c){ c.classList.toggle('on', c.getAttribute('data-p')===p); }); };
            chips.addEventListener('click',function(e){
              var btn=e.target.closest('button'); if(!btn) return;
              var pl=btn.getAttribute('data-p');
              if(pl==='__all'){ frotaToda(); return; }
              var mk=marcadores[pl]; if(!mk) return;
              setChip(pl);
              m.flyTo(mk.getLatLng(), Math.max(m.getZoom(),13), {duration:.7,animate:anim});
              m.once('moveend',function(){ mk.openTooltip(); });
            });
          }

          // ferramentas sobre o mapa: recentrar a frota + ampliar
          var tools=document.createElement('div'); tools.className='map-tools';
          tools.innerHTML='<button type="button" id="mtFrota" title="Ver a frota inteira">Frota</button>'+
                          '<button type="button" id="mtExp" title="Ampliar o mapa">Ampliar</button>';
          alvo.appendChild(tools);
          L.DomEvent.disableClickPropagation(tools); L.DomEvent.disableScrollPropagation(tools);
          tools.querySelector('#mtFrota').addEventListener('click',frotaToda);
          tools.querySelector('#mtExp').addEventListener('click',function(){
            var on=alvo.classList.toggle('exp'); this.textContent=on?'Reduzir':'Ampliar';
            var self=this;
            setTimeout(function(){ m.invalidateSize(); if(!on) m.fitBounds(bounds,{padding:[34,34]});
              if(on) alvo.scrollIntoView({block:'center'}); self.blur(); },60);
          });

          // chips de cidade viram atalho: voa até o centro dos veículos daquela zona
          var zonas={};
          comPos.forEach(function(v){ if(v.zona) (zonas[v.zona]=zonas[v.zona]||[]).push(v.pos); });
          Array.prototype.forEach.call(document.querySelectorAll('.heat-cities .hc'),function(hc){
            var nome=(hc.querySelector('b')||{}).textContent, ps=zonas[nome];
            if(!ps||!ps.length) return;
            var lat=ps.reduce(function(s,p){return s+p.lat;},0)/ps.length;
            var lng=ps.reduce(function(s,p){return s+p.lng;},0)/ps.length;
            hc.classList.add('link'); hc.setAttribute('role','button'); hc.tabIndex=0; hc.title='Ver '+nome+' no mapa';
            function go(){ setChip(null); m.flyTo([lat,lng],12,{duration:.7,animate:anim}); alvo.scrollIntoView({block:'center'}); }
            hc.addEventListener('click',go);
            hc.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
          });

          // toque: o mapa só captura o dedo depois de um toque (senão sequestra a rolagem da página)
          if(isTouch){
            m.dragging.disable(); m.touchZoom.disable(); m.doubleClickZoom.disable();
            var lock=document.createElement('div'); lock.className='map-lock';
            lock.innerHTML='<span>Clique ou toque para explorar o mapa</span>';
            alvo.appendChild(lock);
            lock.addEventListener('click',function(){
              m.dragging.enable(); m.touchZoom.enable(); m.doubleClickZoom.enable(); lock.remove();
            },{once:true});
          } else {
            // desktop: roda do mouse só depois de clicar no mapa (e solta ao sair)
            alvo.addEventListener('click',function(){ m.scrollWheelZoom.enable(); });
            alvo.addEventListener('mouseleave',function(){ m.scrollWheelZoom.disable(); });
          }
        }catch(e){ esconder(); }
    },esconder);
  }

  // ---------- Fundo vivo · rotas GPS (sutil) ----------
  (function(){
    var cv=el('bgv'); if(!cv) return;
    /* o fundo vivo passou a ser os orbes · sem esta saida o canvas seguiria
       pintando um quadro por vez atras de um `display:none` */
    return;
    var ctx=cv.getContext('2d'), W=0,H=0,DPR=1, raf=null;
    var routes=[
      {y:0.16,amp:0.05,ph:0.4,sp:0.045,off:0.10},
      {y:0.38,amp:0.075,ph:1.7,sp:0.032,off:0.55},
      {y:0.60,amp:0.055,ph:2.6,sp:0.052,off:0.30},
      {y:0.80,amp:0.085,ph:0.9,sp:0.040,off:0.80}
    ];
    routes.forEach(function(r){
      r.pts=[]; for(var i=0;i<=64;i++){ var t=i/64; r.pts.push([t, r.y+Math.sin(t*Math.PI*2*1.35+r.ph)*r.amp+Math.sin(t*7+r.ph)*0.010]); }
    });
    function size(){ DPR=Math.min(1.6, window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight;
      cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
    function comet(r,prog,claro){ var fi=prog*(r.pts.length-1), i0=Math.floor(fi), f=fi-i0;
      var a=r.pts[i0], bpt=r.pts[Math.min(i0+1,r.pts.length-1)];
      var cx=(a[0]+(bpt[0]-a[0])*f)*W, cy=(a[1]+(bpt[1]-a[1])*f)*H;
      var g=ctx.createRadialGradient(cx,cy,0,cx,cy,9);
      g.addColorStop(0, claro?'rgba(220,16,33,0.38)':'rgba(255,90,120,0.55)');
      g.addColorStop(1, claro?'rgba(220,16,33,0)':'rgba(236,18,34,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.fill(); }
    function paint(now){
      ctx.clearRect(0,0,W,H);
      // so os POROS (pontos de brilho animados) · sem linhas de rota, nos 2 temas
      var claro=document.body.classList.contains('light');
      var t=(now||0)/1000;
      routes.forEach(function(r){
        comet(r, ((t*r.sp)+r.off)%1, claro);
        comet(r, ((t*r.sp)+r.off+0.5)%1, claro);
      });
    }
    window.__bgRepaint=function(){ if(reduce) paint(6000); };
    function loop(now){ paint(now); raf=requestAnimationFrame(loop); }
    size();
    if(reduce){ paint(6000); }
    else {
      loop(0);
      document.addEventListener('visibilitychange',function(){ if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf=null; } else if(!raf){ loop(performance.now()); } });
    }
    var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ size(); if(reduce) paint(6000); },160); });
  })();
}

/* Resolução do dado: com ?c=TOKEN busca o dado do cliente no n8n; sem token = amostra (dados-exemplo.js). */
(function(){

  if(!c){ __boot(); return; }
  var API = 'https://rastcar.app.n8n.cloud/webhook/inteligencia-dados?c=' + encodeURIComponent(c);

     no tema certo, senao ela pisca preta antes de clarear */

  document.body.appendChild(ld);

    .then(function(r){ if(!r.ok){ var e = new Error('http ' + r.status); e.status = r.status; throw e; } return r.json(); })
    .then(function(d){

      ld.remove();
      __boot();
      if (d && d.amostra === false) {
        Array.prototype.forEach.call(document.querySelectorAll('*'), function(n){
          if (n.children.length === 0 && n.textContent.trim() === 'AMOSTRA') { n.style.display = 'none'; }
        });
      }
    })
    .catch(function(err){
      var pago = err && err.status === 402;
      var titulo = pago ? 'Relatório indisponível no momento' : 'Não foi possível carregar este relatório';
      var apoio  = pago ? 'Fale com a Rastcar para reativar o acesso, <span style="white-space:nowrap">(12) 3157-9090</span>' : 'Confira se o link está completo e correto.';
      ld.innerHTML = '<div style="max-width:440px"><div class="k">RASTCAR INTELIGÊNCIA</div>' +
                     '<div class="t">' + titulo + '</div><div class="s">' + apoio + '</div></div>';
    });
})();

// ---------- Modo claro / escuro (persistido; CLARO e o padrao) ----------
(function(){
  var btn = document.getElementById('themeBtn'); if(!btn) return;
  function aplicar(claro, grava){
    document.body.classList.toggle('light', claro);
    btn.textContent = claro ? 'Modo escuro' : 'Modo claro';
    if(grava){ try{ localStorage.setItem('rc_int_tema', claro ? 'claro' : 'escuro'); }catch(e){} }
    if(window.__bgRepaint) window.__bgRepaint();
  }
  var salvo = null;
  try{ salvo = localStorage.getItem('rc_int_tema'); }catch(e){}
  aplicar(salvo !== 'escuro', false);   // so a escolha DELE vai pro armazenamento
  btn.addEventListener('click', function(){ aplicar(!document.body.classList.contains('light'), true); });
})();
</script>
<script>
/* =====================================================================
   RELATORIO · CAMADA DE MATERIAL (par do CSS)
   1. MATERIA ATRAS · injeta os orbes; sem eles o vidro claro nao tem o
      que refratar e some
   2. GOTA D'AGUA   · onda de luz onde o dedo toca
   (O tema claro por padrao mora na propria IIFE de tema do relatorio.)
   ===================================================================== */
(function(){
  'use strict';

  if(!document.getElementById('rcOrbes')){
    var orbes = document.createElement('div');
    orbes.id = 'rcOrbes';
    orbes.setAttribute('aria-hidden','true');
    orbes.innerHTML = '<i></i><i></i><i></i>';
    document.body.insertBefore(orbes, document.body.firstChild);
  }

  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var ALVOS = '.dgrid > .dline, .urow, .acard, .rrow, .crow';
  document.addEventListener('pointerdown', function(ev){
    var alvo = ev.target && ev.target.closest ? ev.target.closest(ALVOS) : null;
    if(!alvo) return;

    var r = alvo.getBoundingClientRect();
    var x = ev.clientX - r.left, y = ev.clientY - r.top;
    /* Raio: o canto mais distante, MAS limitado pelo lado curto do elemento.
       Numa fileira de 1370x96 a regra do canto daria r=1000 e a onda viraria
       um lavado sobre a lamina inteira · limitada, ela le como gota mesmo. */
    var canto = Math.max(
      Math.hypot(x, y),            Math.hypot(r.width - x, y),
      Math.hypot(x, r.height - y), Math.hypot(r.width - x, r.height - y)
    );
    var raio = Math.max(88, Math.min(canto, 2.4 * Math.min(r.width, r.height)));

    var g = document.createElement('span');
    g.className = 'rc-gota';
    g.style.width = g.style.height = (raio * 2) + 'px';
    g.style.left = x + 'px';
    g.style.top  = y + 'px';
    alvo.appendChild(g);
    g.addEventListener('animationend', function(){ g.remove(); });
  }, {passive:true});
})();

/* ---------- Os controles saem da frente da leitura ----------
   Nascem escondidos (a capa e a primeira impressao), somem enquanto a
   pessoa desce e voltam quando ela para ou sobe. Ninguem baixa o PDF
   antes de olhar o relatorio, entao esconder no topo nao custa nada. */
(function(){
  var corpo = document.body, ultimo = window.scrollY || 0, parada = 0;
  function esconde(v){ corpo.classList.toggle('fabs-off', v); }
  esconde(true);
  window.addEventListener('scroll', function(){
    var y = window.scrollY;
    if(y < 40)               esconde(true);   /* de volta a capa */
    else if(y > ultimo + 4)  esconde(true);   /* descendo: sai da frente */
    else if(y < ultimo - 4)  esconde(false);  /* subindo: volta */
    ultimo = y;
    clearTimeout(parada);
    parada = setTimeout(function(){ if(window.scrollY >= 40) esconde(false); }, 420);
  }, {passive:true});
})();
</script>
