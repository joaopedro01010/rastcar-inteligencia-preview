<style>
:root{
  --bg:#080608;
  --bg2:#0d0509;
  --panel:rgba(255,255,255,.028);
  --panel-b:rgba(255,255,255,.09);
  --bordo:#4A0010;
  --crimson:#FF2D4B;
  --crimson-2:#E01E37;
  --magenta:#FF4FA0;
  --ice:#5FE0FF;
  --offwhite:#F8F4EE;
  --ink:#F3ECE6;
  --muted:#9b9096;
  --muted-2:#8D848B;   /* medido: o tom antigo dava 3,5:1 · minimo legivel e 4,5:1 */
  --hair:rgba(255,255,255,.08);
  --glow:none;
  --head:'Archivo',system-ui,sans-serif;
  --title:'D-DIN','D-DIN Exp',system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --maxw:1080px;
  --pad:clamp(18px,4vw,44px);
  --nav-h:56px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--head);
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* fundo vivo (rotas GPS) + vinheta */
#bgv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,45,75,.06), transparent 55%),
    radial-gradient(100% 60% at 50% 120%, rgba(74,0,16,.35), transparent 60%),
    linear-gradient(180deg, rgba(8,6,8,.30), rgba(8,6,8,.62));
}
.stage{position:relative;z-index:2}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--crimson);font-weight:500;
  display:inline-flex;align-items:center;gap:11px;
}
/* risco antes do eyebrow · mesma assinatura estrutural do site */
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6;flex:0 0 auto}
.seal .eyebrow::before{display:none}
.grad{
  background:linear-gradient(96deg,#FF5A72 0%,var(--crimson) 42%,var(--magenta) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ---------- Etiquetas · veredito curto, sempre ancorado num dado real ---------- */
.tag{
  display:inline-block;font-family:var(--head);font-weight:700;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;line-height:1;
  padding:5px 9px 4px;border-radius:3px;border:1px solid transparent;
  transform:skewX(-4deg);white-space:nowrap;vertical-align:middle;
}
.tag.solid{background:linear-gradient(96deg,var(--crimson-2),var(--crimson));color:#fff}
.tag.good{color:#37D18A;background:rgba(55,209,138,.12);border-color:rgba(55,209,138,.40)}
.tag.warn{color:#FF9E7A;background:rgba(255,122,77,.13);border-color:rgba(255,122,77,.40)}
.tag.ghost{color:var(--muted);background:rgba(255,255,255,.04);border-color:var(--hair)}
.tag + .tag{margin-left:6px}
.tag[hidden]{display:none}

/* ---------- Header (co-marca provedor + cliente) ---------- */
header.top{padding:34px 0 26px}
header.top .wrap{display:flex;flex-direction:column;gap:14px}
.seal{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.seal img.wm{width:clamp(158px,30vw,184px);height:auto;display:block}
.seal img.wm-print{display:none}
.seal .eyebrow{font-size:11px}

/* ---------- Selo DADOS · a etiqueta da família, em metal (estático, sem ornamento) ---------- */
.seal-dados{
  position:relative;display:inline-flex;align-items:center;vertical-align:middle;line-height:1;
  padding:5px 10px 4px;border-radius:3px;border:1px solid transparent;
  transform:skewX(-4deg);
  background-image:
    linear-gradient(178deg,#33343a 0%,#17181c 44%,#0c0c0f 100%),
    linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.10) 38%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.30) 100%);
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
}
/* um único reflexo · é o que sobra do metal quando se tira o resto */
.seal-dados::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(104deg,transparent 34%,rgba(255,255,255,.13) 47%,transparent 58%);
}
.seal-dados>span{
  position:relative;
  font-family:var(--title);font-weight:700;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;line-height:1;display:block;
  background:linear-gradient(180deg,#ffffff 0%,#d3d7de 48%,#9ca1aa 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.client{
  font-family:var(--title);font-weight:700;text-transform:uppercase;letter-spacing:-.012em;
  font-size:clamp(30px,7.4vw,72px);line-height:.99;margin:12px 0 6px;
  color:var(--offwhite);text-wrap:balance;
}
.hook{
  font-family:var(--head);font-weight:600;letter-spacing:-.01em;
  font-size:clamp(15px,2.4vw,20px);color:var(--ink);margin:0 0 8px;
}
.h-meta{
  font-family:var(--head);font-size:12.5px;color:var(--muted-2);
  display:flex;flex-wrap:wrap;gap:5px 14px;letter-spacing:.02em;
}
.h-meta b{color:var(--ink);font-weight:500}

/* ---------- Nav de segmentos (controle) ---------- */
nav.seg{
  background:rgba(8,6,8,.72);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
nav.seg .wrap{display:flex;gap:6px;height:var(--nav-h);align-items:center;overflow-x:auto;scrollbar-width:none}
nav.seg .wrap::-webkit-scrollbar{display:none}
/* A fileira de 9 secoes mede ~1190px e so cabe inteira acima de 1400px de
   janela: em notebook de 1280 o indice saia CORTADO no meio da palavra.
   No desktop ninguem rola barra de indice de lado, entao ela QUEBRA em duas
   linhas quando nao couber. O rolo horizontal continua no celular, onde o
   gesto e natural. Estrutural: vale pra qualquer largura e qualquer
   quantidade de secoes, nao so pras 9 de hoje. */
@media (min-width:820px){
  nav.seg .wrap{flex-wrap:wrap;height:auto;overflow:visible;row-gap:4px;padding-top:13px;padding-bottom:13px}
}
nav.seg a{
  flex:0 0 auto;font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s,background .2s;
}
nav.seg a:hover{color:var(--ink)}
nav.seg a.active{color:#fff;border-color:rgba(255,45,75,.55);background:rgba(255,45,75,.10)}
nav.seg a .n{font-family:var(--mono);font-weight:500;letter-spacing:.06em;color:var(--crimson);margin-right:7px}

/* ---------- Seções ---------- */
main{padding:8px 0 60px}
section.block{padding:56px 0 8px;scroll-margin-top:12px}
main section.block:empty{display:none}
main section.block + section.block{border-top:1px solid var(--hair)}
.block-head{margin-bottom:26px;max-width:64ch}
.block-head h2{
  font-family:var(--title);font-weight:700;text-transform:uppercase;
  font-size:clamp(25px,4.4vw,46px);letter-spacing:-.008em;
  margin:.28em 0 0;line-height:.99;text-wrap:balance;
}
.block-head .sub{color:var(--muted);font-size:15px;margin-top:8px}

/* dominante: número/insight-herói */
.hero-stat{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:6px 0 4px}
.hero-stat .big{
  font-family:var(--title);font-variant-numeric:tabular-nums;
  font-size:clamp(52px,13.6vw,116px);font-weight:700;line-height:.88;letter-spacing:-.022em;
}
.hero-stat .cap{padding-bottom:10px}
.hero-stat .cap .u{font-family:var(--head);font-weight:500;font-size:16px;color:var(--muted);display:block}
.hero-stat .cap .lbl{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);margin-top:4px;
}

/* stats secundários */
.substats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-top:22px}
.substats .s{padding:16px 18px}
.substats .s .n{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:clamp(21px,3.4vw,30px);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.substats .s .l{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2);margin-top:6px}
.narrativa{font-size:clamp(17px,2.5vw,21px);line-height:1.5;color:var(--ink);max-width:60ch;text-wrap:balance;margin:26px 0 0;font-weight:500}
.narrativa b{color:#fff}

/* callout de insight */
.callout{
  margin-top:22px;display:flex;gap:14px;align-items:flex-start;
  background:linear-gradient(100deg, rgba(255,45,75,.10), rgba(255,45,75,.02));
  border:1px solid rgba(255,45,75,.28);border-radius:12px;padding:16px 20px;
}
.callout .bolt{width:8px;align-self:stretch;border-radius:6px;background:linear-gradient(var(--crimson),var(--magenta));box-shadow:var(--glow);flex:0 0 auto}
.callout .ck{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson);display:block;margin-bottom:5px}
.callout .ct{font-size:16px;font-weight:500;line-height:1.4;color:var(--ink)}
/* insight "o que isso diz" · discreto (bg mais suave que o callout base) */
.callout.insight{background:linear-gradient(100deg, rgba(255,45,75,.055), rgba(255,45,75,.012));border-color:rgba(255,45,75,.20);margin-top:24px}
.callout.insight .ct{font-size:15px}
.alerts-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin:0 0 12px}
.rank-hint{font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted-2);align-self:center;margin-left:2px}

/* ---------- Controles (segmented + toggle) ---------- */
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0 20px}
.segset{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:999px;padding:3px}
.segset button{
  font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.18s;
}
.segset button:hover{color:var(--ink)}
.segset button[aria-pressed="true"]{color:#fff;background:linear-gradient(96deg,var(--crimson-2),var(--crimson))}
.ctl-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}

/* ---------- Ranking ---------- */
.rank{display:flex;flex-direction:column}
.rrow{
  display:grid;grid-template-columns:98px 1fr auto;align-items:center;gap:16px;
  padding:13px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer;
  transition:background .2s,border-color .2s,transform .15s;
}
.rrow:hover,.rrow:focus-visible{background:rgba(255,45,75,.06);border-color:rgba(255,45,75,.22);outline:none}
.rrow:hover .bar>i{filter:brightness(1.25)}
.rrow .plate{font-family:var(--title);font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--ink)}
.rrow .who{min-width:0}
.rrow .model{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:6px}
.rrow .mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .model .tag{flex:0 0 auto}
.bar{height:7px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--crimson-2),var(--crimson) 60%,var(--magenta));
  transition:width .9s cubic-bezier(.22,1,.36,1),filter .2s}
.rrow .kv{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;text-align:right;color:var(--ink);white-space:nowrap}
.rrow .kv small{display:block;font-size:10px;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-top:2px}
.more{
  margin-top:14px;font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--crimson);
  background:none;border:1px solid rgba(255,45,75,.3);border-radius:999px;padding:9px 18px;cursor:pointer;transition:.2s;
}
.more:hover{background:rgba(255,45,75,.08);color:#fff}

/* ---------- Heatmap ---------- */
.heat-wrap{margin-top:34px;position:relative}
.heat-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
#rzMap{height:440px;border-radius:14px;border:1px solid var(--hair);background:#0b0509;position:relative;z-index:2;overflow:hidden}
body:not(.light) #rzMap .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.82) saturate(.35)}
body.light #rzMap{background:#ECEBE8}
.heat-cities{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.heat-cities .hc{font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);border:1px solid var(--hair);border-radius:999px;padding:6px 12px}
.heat-cities .hc b{font-family:var(--title);font-weight:700;color:var(--ink)}
@media (max-width:640px){#rzMap{height:320px}}
/* navegação rápida do mapa */
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:0 0 auto;font-family:var(--title);font-weight:700;font-size:12.5px;letter-spacing:.01em;color:var(--muted);
  background:none;border:1px solid var(--hair);border-radius:999px;padding:6px 12px;cursor:pointer;
  transition:color .18s,border-color .18s,background .18s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.mchips button:hover{color:var(--ink);border-color:rgba(255,45,75,.4)}
.mchips button.on{color:#fff;border-color:rgba(255,45,75,.55);background:rgba(255,45,75,.12)}
body.light .mchips button.on{color:#C81430;background:rgba(224,30,55,.08);border-color:rgba(200,20,48,.4)}
.map-tools{position:absolute;top:10px;right:10px;z-index:930;display:flex;flex-direction:column;gap:6px}
.map-tools button{font-family:var(--head);font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:#F3ECE6;background:rgba(14,10,14,.82);border:1px solid rgba(255,255,255,.16);border-radius:8px;
  padding:7px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.map-tools button:hover{border-color:rgba(255,45,75,.5)}
body.light .map-tools button{background:rgba(255,255,255,.92);color:#16161A;border-color:rgba(0,0,0,.16)}
#rzMap.exp{height:min(78vh,720px)}
.hc.link{cursor:pointer;transition:border-color .18s,color .18s}
.hc.link:hover{border-color:rgba(255,45,75,.45);color:var(--ink)}
.map-lock{position:absolute;inset:0;z-index:920;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;cursor:pointer}
.map-lock span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:rgba(14,10,14,.85);border:1px solid rgba(255,45,75,.4);border-radius:999px;padding:8px 14px}
body.light .map-lock span{background:rgba(255,255,255,.95);color:#16161A;border-color:rgba(200,20,48,.35)}
.dlt{display:inline-block;font-family:var(--head);font-weight:600;font-size:10.5px;letter-spacing:.02em;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle;border:1px solid;white-space:nowrap}
.dlt.good{color:#37D18A;border-color:rgba(55,209,138,.4)}
.dlt.bad{color:#FF5A78;border-color:rgba(255,45,75,.4)}
.dlt.neu{color:var(--muted);border-color:var(--hair)}
body.light .dlt.good{color:#1C7A45;border-color:rgba(28,122,69,.4)}
body.light .dlt.bad{color:#C81430;border-color:rgba(200,20,48,.35)}
#rzMap .leaflet-tooltip{font-family:var(--head);font-weight:500;font-size:12.5px;line-height:1.5;border-radius:8px;border:1px solid rgba(224,30,55,.45);background:rgba(255,255,255,.96);color:#16161A;box-shadow:0 6px 22px rgba(0,0,0,.25)}
#rzMap .leaflet-tooltip b{color:#C81430}
#rzMap .leaflet-interactive{cursor:pointer}
/* controles do Leaflet vem com fonte propria (Lucida Console / Helvetica) · trazidos pro sistema */
#rzMap .leaflet-control-zoom a{font-family:var(--title);font-weight:700;text-decoration:none}
#rzMap .leaflet-control-attribution,#rzMap .leaflet-control-attribution a,#rzMap .leaflet-popup-content{
  font-family:var(--head);font-weight:500;font-size:10.5px}

/* ---------- Vigilância ---------- */
.vig-top{display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:center;
  border-radius:16px;padding:28px 30px}
.ring{position:relative;width:168px;height:168px;flex:0 0 auto}
.ring svg{width:168px;height:168px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:11}
.ring .arc{fill:none;stroke:url(#gArc);stroke-width:11;stroke-linecap:round}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr .p{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:38px;font-weight:700;letter-spacing:-.015em;line-height:1}
.ring .ctr .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:7px;max-width:100px;line-height:1.3}
.indics{display:flex;flex-direction:column;gap:15px}
.indic{display:flex;align-items:baseline;gap:12px}
.indic.p1{flex-wrap:wrap;row-gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:#37d18a;flex:0 0 auto;position:relative;top:1px}
.indic .it{font-size:14.5px;color:var(--ink)}
.indic .it b{font-family:var(--title);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.08em;color:#fff}
.anchor{margin:26px 0 6px;font-family:var(--title);font-size:clamp(19px,3vw,28px);font-weight:700;letter-spacing:-.005em;line-height:1.12;text-wrap:balance}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.acard{border-radius:12px;padding:18px 20px}
.acard .aq{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;letter-spacing:-.015em;color:#fff;line-height:1}
.acard .at{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.35}

/* ---------- Comportamento ---------- */
.comp-grid{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
.gauge{border-radius:16px;padding:26px 22px;text-align:center}
.gauge .gn{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:clamp(56px,9.4vw,78px);font-weight:700;letter-spacing:-.02em;line-height:1}
.gauge .gl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.gauge .gbar{height:6px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:18px;overflow:hidden}
.gauge .gbar>i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--crimson),var(--magenta));box-shadow:var(--glow);transition:width 1s cubic-bezier(.22,1,.36,1)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.col.attn h3{color:var(--crimson)}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.18s}
.crow:hover{background:rgba(255,45,75,.06);border-color:rgba(255,45,75,.2)}
.crow .cp{font-family:var(--title);font-weight:700;font-size:15px;color:var(--ink)}
.crow .cs{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;padding:2px 10px;border-radius:6px;min-width:44px;text-align:center}
.cs.good{color:#37d18a;background:rgba(55,209,138,.12)}
.cs.mid{color:var(--ink);background:rgba(255,255,255,.07)}
.cs.warn{color:#ff7a4d;background:rgba(255,122,77,.14)}
.crow .cx{font-family:var(--head);font-weight:500;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* ---------- Motoristas · fileiras no material do .crow, sem estado de clique ---------- */
.drvlist{display:flex;flex-direction:column;gap:8px}
.crow.drv{cursor:default}
.crow.drv:hover{background:var(--glass-bg);border-color:var(--glass-b)}
.crow.drv .cx{white-space:normal}
.crow.drv .kv{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;text-align:right;color:var(--ink);white-space:nowrap}
.crow.drv .kv small{display:block;font-size:10px;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-top:2px}
.dcode{font-size:11px;color:var(--muted-2);letter-spacing:.08em;margin-left:6px}

/* ---------- Drill-down (ficha do veículo) ---------- */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(4,3,4,.66);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.ovl.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:61;top:0;right:0;height:100%;width:min(420px,92vw);
  background:linear-gradient(180deg,#120810,#0a060a);border-left:1px solid rgba(255,45,75,.28);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding:28px var(--pad);overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.5);
}
.sheet.open{transform:none}
.sheet .x{position:absolute;top:18px;right:18px;background:none;border:1px solid var(--hair);color:var(--muted);
  width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;transition:.2s}
.sheet .x:hover{color:#fff;border-color:rgba(255,45,75,.5)}
.sheet .sk{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson)}
.sheet .sp{font-family:var(--title);font-size:34px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px;color:#fff}
.sheet .sm{color:var(--muted);font-size:14px;margin-bottom:22px}
.sheet .drow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair)}
.sheet .drow .dl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.sheet .drow .dv{font-family:var(--title);font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--ink);text-align:right}
.sheet .dv.crim{color:var(--crimson)}
.sheet .note{font-family:var(--head);font-weight:500;font-size:12.5px;color:var(--muted-2);margin-top:20px;line-height:1.6}

/* ---------- Footer ---------- */
footer.bot{border-top:1px solid var(--hair);padding:30px 0;margin-top:40px;position:relative}
footer.bot .wrap{display:flex;flex-direction:column;gap:10px}
footer.bot .slogan{font-size:15px;font-weight:600;letter-spacing:-.01em}
footer.bot .f-line{font-family:var(--head);font-weight:500;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
footer.bot b{color:var(--ink);font-weight:500}

/* ---------- Botão PDF ---------- */
.pdfbtn{position:fixed;right:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(96deg,var(--crimson-2),var(--crimson));color:#fff;border:0;border-radius:999px;
  padding:11px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);-webkit-tap-highlight-color:transparent}
.pdfbtn:hover{filter:brightness(1.08)}
.pdfbtn .pi{width:12px;height:13px;border:1.6px solid #fff;border-top:0;border-radius:0 0 2px 2px;position:relative}
.pdfbtn .pi::before{content:"";position:absolute;left:50%;top:-8px;width:1.6px;height:8px;background:#fff;transform:translateX(-50%)}
.pdfbtn .pi::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;border-right:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:translate(-50%,-50%) rotate(45deg)}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- O mês em 30 segundos (porta de entrada) ---------- */
section.dg{padding:34px 0 0;border-top:0 !important}
.dgt{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--crimson);margin:0 0 14px;
  display:flex;align-items:center;gap:11px}
.dgt::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6;flex:0 0 auto}
.dgrid{display:flex;flex-direction:column;border-radius:14px}
.dline{display:flex;align-items:baseline;gap:12px;padding:14px 18px;text-decoration:none}
.dline .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);flex:1 1 auto;min-width:0}
.dline .v{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;color:var(--ink);white-space:nowrap}
.dline .go{font-family:var(--head);color:var(--crimson);font-size:16px;flex:0 0 auto;align-self:center}
.dline.act{flex-wrap:wrap}
.dline.act .k{flex-basis:100%}
.dline.act .v{white-space:normal;font-family:var(--head);font-size:14.5px;font-weight:500;line-height:1.4;flex:1 1 0;min-width:0}

/* ---------- Gráficos desenhados à mão (km/dia, calendário, benchmark, mapa de calor) ---------- */
.km-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
.kmwrap,.utilwrap,.mnt-wrap{margin-top:34px}
/* km por dia · barras SVG */
.kmchart{position:relative;padding-top:48px} /* o rotulo do pico tem ~42px (valor+data+risco), com 26px ele caia EM CIMA da barra mais alta no celular */
.kmplot{position:relative}
.kmplot svg{display:block;width:100%;height:112px;touch-action:pan-y}
.kmbase{stroke:var(--hair);stroke-width:1}
.kmgrid{stroke:var(--hair);stroke-width:1;opacity:.6}
.kmbar{fill:var(--crimson);opacity:.82}
.kmbar.we{fill:var(--muted-2);opacity:.55}
.kmbar.pk{fill:var(--magenta);opacity:1}
/* rótulos de escala (régua horizontal), no canto esquerdo sobre as linhas */
.km-scale{position:absolute;left:0;transform:translateY(-50%);font-family:var(--title);font-weight:700;font-size:10px;line-height:1;color:var(--muted-2);background:var(--bg);padding:1px 4px 1px 0;pointer-events:none}
/* rótulo do dia de pico, ancorado sobre a barra mais alta */
.km-peak{position:absolute;top:0;transform:translateX(-50%);font-family:var(--head);font-weight:500;font-size:11px;line-height:1.15;color:var(--muted);white-space:nowrap;text-align:center;pointer-events:none;z-index:2}
.km-peak b{display:block;font-family:var(--title);color:var(--magenta);font-weight:700;font-size:14px}
.km-peak::after{content:"";display:block;width:1px;height:8px;background:var(--magenta);margin:3px auto 0;opacity:.7}
/* tooltip por barra · hover no desktop, toque no mobile */
.km-tip{position:absolute;top:-2px;transform:translate(-50%,-100%);font-family:var(--head);font-weight:500;font-size:12px;white-space:nowrap;color:var(--ink);border-radius:8px;padding:5px 9px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3}
.km-tip.on{opacity:1}
.km-tip b{font-family:var(--title);color:var(--magenta);font-weight:700;font-size:1.1em}

/* ---------- Trajetória da frota · a régua do tempo (Resumo) ----------
   Cada relatório vira um ponto e a curva engorda sozinha mês a mês. Linha em SVG
   esticado (preserveAspectRatio none), então os PONTOS são HTML posicionado em %,
   senão o círculo deformaria junto com a escala. */
.traj{border-radius:16px;padding:22px 22px 16px;margin-top:22px}
.traj-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
.traj-now{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.traj-now .tn{font-family:var(--title);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(34px,6vw,46px);line-height:1;letter-spacing:-.02em}
.traj-now .tu{font-family:var(--head);font-weight:500;font-size:12.5px;color:var(--muted)}
.traj-plot{position:relative;margin-top:18px}
.traj-plot svg{display:block;width:100%;height:120px;overflow:visible}
/* revelacao por WIPE de clip-path (varre linha e area juntas, esquerda a direita).
   NAO usar stroke-dash pra desenhar: com non-scaling-stroke em path esticado o
   Chromium mede o dash errado e a linha sai falhada (visto no QA de 06/08). */
.traj-plot svg{clip-path:inset(-14px 101% -14px -8px)}
.traj-plot.in svg{clip-path:inset(-14px -8px -14px -8px);transition:clip-path 1.25s cubic-bezier(.22,1,.36,1) .1s}
.traj-line{fill:none;stroke:url(#tjStroke);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.traj-area{fill:url(#tjFill)}
.tj-dot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:var(--crimson);box-shadow:0 0 0 3px rgba(255,45,75,.15);cursor:pointer;opacity:0;transition:opacity .5s ease .35s;z-index:2}
.tj-dot.last{width:11px;height:11px;background:var(--magenta);box-shadow:0 0 0 4px rgba(255,79,160,.16),0 0 18px rgba(255,79,160,.45)}
.traj-plot.in .tj-dot{opacity:1}
.tj-lab{position:absolute;transform:translate(-50%,-100%);margin-top:-9px;font-family:var(--head);font-weight:500;font-size:11px;line-height:1.15;color:var(--muted);text-align:center;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .5s ease .6s;z-index:2}
.tj-lab b{display:block;font-family:var(--title);color:var(--magenta);font-weight:700;font-size:15px}
.traj-plot.in .tj-lab{opacity:1}
.traj-plot .km-tip{transform:translate(-50%,calc(-100% - 9px))}
.traj-axis{position:relative;height:16px;margin-top:8px}
.traj-axis span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted-2);text-transform:lowercase;white-space:nowrap}
.km-hint{display:block;margin-top:10px;font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted-2)}
/* eixo de dias sob o gráfico */
.km-axis{position:relative;height:14px;margin-top:6px}
.km-axis span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--title);font-weight:700;font-size:11px;color:var(--muted-2)}
.km-leg{margin-top:14px;font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.km-leg b{font-family:var(--title);color:var(--ink);font-weight:700}
.km-leg .lg{display:inline-flex;align-items:center;gap:6px;margin-right:14px}
.km-sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
.km-sw.wk{background:var(--crimson);opacity:.82}
.km-sw.we{background:var(--muted-2);opacity:.55}
.km-sw.pk{background:var(--magenta)}
/* utilização · uma linha por veículo, número grande de dias + barrinha + quadradinhos */
.km-sub{font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);margin:-4px 0 16px}
.urow{padding:16px 0}
.uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.uplate{font-family:var(--title);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.udias{font-family:var(--head);font-weight:500;color:var(--muted);font-size:13px}
.udias b{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;color:var(--ink);margin-right:3px}
.usub{margin-left:auto}
.ubar{height:8px;background:var(--hair);border-radius:5px;overflow:hidden;margin-bottom:11px;max-width:440px}
.ubar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--crimson-2),var(--crimson))}
.ubar>i.low{background:linear-gradient(90deg,#7a2a34,var(--crimson-2))}
.udots{display:flex;flex-wrap:wrap;gap:4px}
.ucell{width:13px;height:13px;border-radius:3px;background:var(--hair);flex:0 0 auto}
.ucell.on{background:var(--crimson);opacity:.9}
.ucell.ulg{margin:0 2px 0 6px;display:inline-block}
/* manutenção preventiva */
.mnt-odo{margin-top:4px;font-family:var(--head);font-weight:500;color:var(--muted-2)}
.mnt-note{margin-top:12px}
/* benchmark vs mercado */
.bmlist{margin-top:8px}
.bm{padding:20px 0}
.bm-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bm-name{font-family:var(--head);font-weight:600;font-size:16px;color:var(--ink)}
.bm-row{display:grid;grid-template-columns:132px 1fr 72px;gap:12px;align-items:center;margin-top:8px}
.bm-l{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.bbar{height:10px;background:var(--hair);border-radius:6px;overflow:hidden}
.bbar>i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.bbar>i.avg{background:linear-gradient(90deg,#7a7280,#9b9096)}
.bbar>i.you.ok{background:linear-gradient(90deg,#2FB574,#37D18A)}
.bbar>i.you.bad{background:linear-gradient(90deg,var(--crimson-2),var(--crimson))}
.bm-v{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink);text-align:right}
.bm-read{font-family:var(--head);font-weight:500;font-size:14px;line-height:1.55;color:var(--muted);margin:12px 0 0}
.bm-read a{color:var(--crimson);text-decoration:none;border-bottom:1px solid rgba(255,45,75,.35)}
.bm-read a:hover{border-bottom-color:var(--crimson)}
/* mapa de calor de alertas · 7 dias × 4 períodos, número dentro da célula */
.hm-wrap{margin-top:8px}
.hmgrid{display:grid;grid-template-columns:58px repeat(4,1fr);gap:6px;align-items:stretch}
.hm-corner{}
.hm-ph{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted-2);text-align:center;line-height:1.25;align-self:end;padding-bottom:2px}
.hm-ph small{display:block;font-size:9px;letter-spacing:0;text-transform:none;color:var(--muted-2);margin-top:2px;opacity:.85}
.hm-day{font-family:var(--head);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted);display:flex;align-items:center}
.hm-cell{min-height:40px;border-radius:7px;background:var(--hair);display:flex;align-items:center;justify-content:center;
  font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink)}
.hm-cell.z{color:var(--muted-2);font-weight:400}
.hm-leg{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.hm-ramp{flex:0 0 120px;height:9px;border-radius:5px;background:linear-gradient(90deg,rgba(255,45,75,.14),var(--crimson))}
/* trilhos claros no modo claro (o crimson/verde dos preenchimentos é acento e não muda) */
body.light .bbar{background:#E8E8E6}
body.light .kmbase{stroke:rgba(0,0,0,.14)}

/* ---------- Mobile ---------- */
@media (max-width:640px){
  body{font-size:17px}
  section.block{padding:44px 0 6px}
  .substats{grid-template-columns:1fr 1fr}
  .substats .s:last-child:nth-child(odd){grid-column:1 / -1}
  .rrow{grid-template-columns:76px 1fr auto;gap:11px;padding:12px 8px}
  .vig-top{grid-template-columns:1fr;gap:24px;justify-items:center;text-align:center}
  .indics{align-items:flex-start;text-align:left;width:100%}
  .alerts{grid-template-columns:1fr}
  .comp-grid{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .bm-row{grid-template-columns:96px 1fr 56px;gap:9px}
  .bm-l{font-size:10px}
  .kmchart svg{height:96px}
  .hmgrid{grid-template-columns:44px repeat(4,1fr);gap:4px}
  .hm-ph{font-size:9px}
  .hm-ph small{display:none}
  .hm-cell{min-height:36px;font-size:14px}
  .udias b{font-size:20px}
  .sheet{width:100%;top:auto;bottom:0;height:auto;max-height:86vh;border-left:0;border-top:1px solid rgba(255,45,75,.28);
    transform:translateY(100%);border-radius:18px 18px 0 0}
  .sheet.open{transform:none}
  .pdfbtn{right:12px;bottom:12px}
  .tag{font-size:9px;letter-spacing:.1em;padding:4px 7px 3px}
  .rrow .model{gap:6px}
}

/* ---------- Impressão / PDF · fundo CLARO + acentos CRIMSON/MAGENTA da web (web intocada) ---------- */
/* ---------- MODO CLARO (toggle na tela; mesma regra do print: superfície clara,
   corpo escuro, ACENTOS crimson/magenta intactos) ---------- */
body.light{--bg:#FAFAF8;--ink:#16161A;--muted:#63636A;--muted-2:#6E6E76;--hair:rgba(0,0,0,.10);--glow:none;background:var(--bg)}
body.light .veil{background:
  radial-gradient(120% 80% at 50% -10%, rgba(224,30,55,.05), transparent 55%),
  linear-gradient(180deg, rgba(250,250,248,.25), rgba(250,250,248,.68))}
body.light .wm-screen{display:none}
body.light .seal img.wm-print{display:block}
body.light nav.seg{background:rgba(250,250,248,.86);border-top-color:rgba(0,0,0,.07);border-bottom-color:rgba(0,0,0,.07)}
body.light nav.seg a.active{color:#C81430;border-color:rgba(200,20,48,.35);background:rgba(224,30,55,.08)}
body.light .segset{background:#fff;border-color:rgba(0,0,0,.14)}
body.light .bar{background:#E8E8E6}
body.light .ring .trk{stroke:#E8E8E6}
body.light .client{color:#0A0A0A}
body.light .seal-dados{box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.85), 0 6px 16px rgba(20,10,14,.20)}
body.light .acard .aq{color:#16161A}
body.light .indic .it b{color:#0A0A0A}
body.light .gauge .gbar{background:#E8E8E6}
body.light .cs.good{color:#1C7A45;background:#E8F5EE}
body.light .cs.mid{color:#16161A;background:#F1F1F1}
body.light .cs.warn{color:#B5541C;background:#FBEEE6}
body.light .anchor{color:#C81430}
body.light .tag.good{color:#1C7A45;background:#E8F5EE;border-color:rgba(28,122,69,.35)}
body.light .tag.warn{color:#B5541C;background:#FBEEE6;border-color:rgba(181,84,28,.35)}
body.light .tag.ghost{color:#63636A;background:#F1F1F1;border-color:rgba(0,0,0,.12)}
body.light .more:hover{background:rgba(224,30,55,.07);color:#C81430}
body.light .sheet{background:#fff;border-left-color:rgba(224,30,55,.30);border-top-color:rgba(224,30,55,.30);box-shadow:-30px 0 60px rgba(0,0,0,.14)}
body.light .sheet .sp{color:#0A0A0A}
body.light .sheet .x:hover{color:#C81430;border-color:rgba(200,20,48,.5)}

  color:#16161A;transform:translateY(-1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 14px 28px -12px rgba(24,20,32,.34);
}
body.light .themebtn:active{transform:translateY(0) scale(.988);transition-duration:.09s}

/* ---------------------------------------------------------------
   7 · ETIQUETAS  ·  cor viva como SUPERFICIE, texto claro por cima
   --------------------------------------------------------------- */
body.light .tag{
  background:linear-gradient(180deg,#F2144F,#E70055);color:#fff;border:0;
  box-shadow:0 6px 16px -8px rgba(231,0,85,.55);
}
body.light .tag.ghost{
  background:linear-gradient(168deg, rgba(255,255,255,.72), rgba(255,255,255,.52));
  color:#56565E;border:1px solid rgba(255,255,255,.80);box-shadow:none;
}

/* ---------------------------------------------------------------
   8 · GOTA D'AGUA  ·  onda que nasce onde o dedo toca
   Tres cristas estreitas, nao um degrade largo. No CLARO quem desenha
   a agua e a SOMBRA DO VALE (branco sobre branco some); no ESCURO e o
   contrario: a crista e LUZ. O fio crimson da o desenho nos dois.
   --------------------------------------------------------------- */
.rc-gota{
  position:absolute;border-radius:50%;pointer-events:none;z-index:5;
  transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle closest-side,
    rgba(255,255,255,0)    0%,
    rgba(255,255,255,.045) 26%,
    rgba(255,255,255,.10)  31%,
    rgba(255,255,255,0)    36%,
    rgba(255,255,255,.075) 43%,
    rgba(255,255,255,.17)  48%,
    rgba(255,255,255,0)    54%,
    rgba(255,255,255,.10)  59%,
    rgba(255,45,75,.30)    63%,
    rgba(255,255,255,.26)  66%,
    rgba(255,255,255,0)    74%);
  animation:rcGota .82s var(--ease) forwards;
}
body.light .rc-gota{
  background:radial-gradient(circle closest-side,
    rgba(26,22,34,0)     0%,
    rgba(26,22,34,.035) 26%,   /* crista 3 · a mais fraca, ja morrendo   */
    rgba(255,255,255,.30) 31%,
    rgba(26,22,34,0)    36%,
    rgba(26,22,34,.085) 43%,   /* crista 2 · meia forca                  */
    rgba(255,255,255,.42) 48%,
    rgba(26,22,34,0)    54%,
    rgba(26,22,34,.14)  59%,   /* crista 1 · a da frente, o vale escuro  */
    rgba(231,0,85,.20)  63%,   /* fio crimson na crista · da o desenho   */
    rgba(255,255,255,.55) 66%,
    rgba(255,255,255,0) 74%,
    rgba(26,22,34,0)   100%);
}
@keyframes rcGota{
  from{transform:translate(-50%,-50%) scale(0);opacity:.9}
  to  {transform:translate(-50%,-50%) scale(1);opacity:0}
}
@media (prefers-reduced-motion:reduce){.rc-gota{display:none}}
.dgrid > .dline, .urow, .acard, .rrow, .crow{position:relative;overflow:hidden}

/* ---------------------------------------------------------------
   9 · CABECALHO  ·  a navegacao vira uma lamina flutuante (no claro)
   --------------------------------------------------------------- */
/* O fundo e o blur moram num pseudo-elemento MASCARADO. Se ficassem na
   propria nav, o blur terminaria numa aresta reta de ponta a ponta — que
   e exatamente o fio divisorio que esta camada existe pra nao ter. */
body.light nav.seg{background:transparent;box-shadow:none;isolation:isolate}
body.light nav.seg::before{
  content:"";position:absolute;inset:0 0 -22px 0;z-index:-1;pointer-events:none;
  /* A lamina e OPACA na altura dos rotulos e so desvanece num rabo de
     22px ABAIXO da barra. Desvanecer dentro dela deixava o grafico rolar
     por baixo do texto; e cortar reto devolveria o fio divisorio. */
  background:linear-gradient(180deg, rgba(250,250,248,.94) 0%, rgba(250,250,248,.94) 72%, rgba(250,250,248,0) 100%);
  -webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  -webkit-mask-image:linear-gradient(180deg,#000 72%, transparent 100%);
          mask-image:linear-gradient(180deg,#000 72%, transparent 100%);
}

/* ---------------------------------------------------------------
   11 · LEGIBILIDADE NO CLARO
   O claro deixou de ser opcao e virou o padrao, entao o que passava
   por ser tema secundario agora precisa cumprir WCAG. O crimson de
   TELA (#FF2D4B) da ~3,4:1 sobre o papel branco; a peca ja tinha o
   tom certo pra texto no claro (#C81430, usado em `.anchor`).
   --------------------------------------------------------------- */
body.light .eyebrow,
body.light .callout .ck,
body.light .dgt,
body.light .scr{color:#C81430}
body.light .segset button[aria-pressed="true"]{background:linear-gradient(96deg,#A80D26,#C81430)}
body.light .tag.warn,
body.light .cs.warn{color:#8A3E10}
/* o "·" do mapa de calor sobre a celula mais clara dava 3,5:1 */
body.light .hm-cell.z{color:#4F4F57}
/* o "Baixar PDF" no escuro dava 4,44:1 · o crimson de tela e claro demais
   pra carregar texto branco em corpo pequeno */
body:not(.light) .pdfbtn{background:linear-gradient(96deg,#C81430,#DD1B34)}

/* ---------------------------------------------------------------
   9b · CARREGANDO / ERRO  ·  a tela de servico segue o tema
   O caminho de erro nao passa pela troca de tema: ele abria PRETO numa
   peca que hoje e clara. Quem chega nele e o cliente com assinatura
   vencida ou com o link torto — e a pior hora pra peca parecer outra.
   --------------------------------------------------------------- */
.rc-ovl{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;
  background:#0A0A0A;color:#fff;
  font-family:var(--head),system-ui,sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;
}
body.light .rc-ovl{background:var(--bg);color:var(--ink)}
.rc-ovl .k{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--crimson);margin-bottom:12px}
body.light .rc-ovl .k{color:#C81430}
.rc-ovl .t{font-family:var(--title);font-size:19px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.rc-ovl .s{font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;line-height:1.5}

/* ---------------------------------------------------------------
   10 · OS CONTROLES SAEM DA FRENTE DA LEITURA
   Isto e uma peca de LER. Dois botoes fixos permanentes cobriam texto
   no celular e, na abertura, o "Baixar PDF" caia por cima da ultima
   linha do resumo. Entao: eles nascem escondidos (a capa e a primeira
   impressao, e tambem a foto do produto na landing), somem enquanto a
   pessoa desce e voltam quando ela para ou sobe. Alem disso o rodape
   reserva a altura deles, pra ultima linha nunca ficar por baixo.
   --------------------------------------------------------------- */
.pdfbtn,.themebtn{transition:opacity .28s var(--ease), transform .28s var(--ease)}
body.fabs-off .pdfbtn,
body.fabs-off .themebtn{opacity:0;transform:translateY(14px);pointer-events:none}
/* quem chega de teclado tem que conseguir alcancar */
body.fabs-off .pdfbtn:focus-visible,
body.fabs-off .themebtn:focus-visible{opacity:1;transform:none;pointer-events:auto}
footer.bot{padding-bottom:104px}
@media (prefers-reduced-motion:reduce){
  .pdfbtn,.themebtn{transition:none}
  body.fabs-off .pdfbtn,body.fabs-off .themebtn{transform:none}
}

/* ---------------------------------------------------------------
   11 · PAPEL  ·  nada desta camada atravessa a impressao
   O tema de impressao ja reescreve as superficies com !important; o que
   ele nao previa e vidro (blur) e luz de fundo. Zeramos aqui.
   --------------------------------------------------------------- */
@media print{
  #rcOrbes,.rc-gota{display:none !important}
  .dgrid > .dline,.substats > *,.acard,.gauge,.traj,.vig-top,.rrow,.crow,.km-tip,.bm-read,
  .urow,.bm,#rzMap,.segset,.mchips button,.heat-cities .hc,.map-tools button,.themebtn,
  nav.seg::before{
    -webkit-backdrop-filter:none !important;backdrop-filter:none !important;
  }
  .dgrid > .dline,.urow,.bm,.rrow,.crow{transform:none !important}
  /* o respiro de 8px e de tela · no papel ele empurrava 2 veiculos do
     ranking pra pagina seguinte sem ninguem ter escolhido isso */
  .rrow,.crow{margin-bottom:0 !important}
  /* a reserva pros botoes flutuantes tambem e de tela · no papel viraria
     uma pagina extra em branco */
  footer.bot{padding-bottom:30px !important}
}

<script>
function __boot(){
  var D = window.RC_DADOS || {};
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- helpers ----------
  function nf(n){ return Number(n).toLocaleString('pt-BR'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(id){ return document.getElementById(id); }
  // callout de insight · "o que isso diz" (régua bordô à esquerda, discreto)
  function insightHtml(texto){
    /* payload do Builder pode trazer " · " como separador de frase, aqui vira virgula */
    return '<div class="callout insight reveal"><span class="bolt"></span><div>'+
           '<span class="ck">O que isso diz</span><span class="ct">'+esc(String(texto||'').replace(/ · /g,', '))+'</span></div></div>';
  }
  // junta placas em linguagem natural: "A", "A e B", "A, B e C"
  function joinNat(arr){
    if(arr.length<=1) return arr.join('');
    if(arr.length===2) return arr[0]+' e '+arr[1];
    return arr.slice(0,-1).join(', ')+' e '+arr[arr.length-1];
  }
  // v3.5 · tipos de veiculo (maquina se olha por horimetro, o resto por odometro)
  var TIPO_LABEL={caminhao:['caminhão','caminhões'],carro:['carro','carros'],picape:['picape','picapes'],
    van:['van','vans'],onibus:['ônibus','ônibus'],moto:['moto','motos'],maquina:['máquina','máquinas'],outro:['outro','outros']};
  var TIPO_ORDEM=['caminhao','maquina','picape','carro','onibus','van','moto','outro'];
  function tipoNome(t,n){ var l=TIPO_LABEL[t]||TIPO_LABEL.outro; return n===1?l[0]:l[1]; }
  var temMaquinas=(D.veiculos||[]).some(function(v){ return v.tipo==='maquina'; });
  // km pode ser null (maquina e veiculo sem odometro ligado, medidos por horimetro)
  function nfDash(v,suf){ return v==null ? '—' : (nf(v)+(suf||'')); }

  // setas de evolucao vs mes anterior (so com D.anterior)
  var ANT = D.anterior || null; // mes anterior (setas de evolucao)
  function deltaChip(atual, ant, modo){
    if(!ANT || ant==null || !isFinite(ant) || ant===0) return '';
    var p = Math.round((atual/ant - 1) * 100);
    var rot = ANT.periodo ? ' vs ' + ANT.periodo.toLowerCase().replace('·','de') : ' vs mês anterior';
    if(p===0) return '<span class="dlt neu">= '+rot.trim()+'</span>';
    var sobe = p>0;
    var cls = modo==='neutro' ? 'neu' : ((modo==='sobe-bom')===sobe ? 'good' : 'bad');
    return '<span class="dlt '+cls+'">'+(sobe?'\u2191':'\u2193')+' '+Math.abs(p)+'%'+rot+'</span>';
  }

  // ---------- Trajet\u00f3ria da frota (D.historico, um ponto gravado por m\u00eas pelo Builder) ----------
  var MES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var MES_NOME=['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  function mesAbr(ym){ var m=parseInt(String(ym).slice(5,7),10); return MES_ABR[m-1]||''; }
  function mesNome(ym){ var m=parseInt(String(ym).slice(5,7),10); return MES_NOME[m-1]||''; }
  var TJ=null; // estado do painel (preenchido por trajHtml, usado no hookup)
  function trajHtml(){
    var ht=(D.historico||[]).slice().sort(function(a,b){ return String(a.mes).localeCompare(String(b.mes)); });
    if(ht.length<2) return '';
    // metrica: score quando 2+ meses o tem; senao km (cliente sem bloco de conduta ainda tem curva)
    var comScore=ht.filter(function(h){ return h.score!=null; });
    var usaScore=comScore.length>=2;
    var pts=usaScore?comScore:ht.filter(function(h){ return h.km_mes!=null; });
    if(pts.length<2) return '';
    function val(h){ return usaScore?h.score:h.km_mes; }
    var n=pts.length, vmin=Infinity, vmax=-Infinity;
    pts.forEach(function(h){ var v=val(h); if(v<vmin)vmin=v; if(v>vmax)vmax=v; });
    // folga vertical: a curva respira e nunca cola no teto nem na base do painel
    var pad=Math.max((vmax-vmin)*0.3, usaScore?4:Math.max(1,vmax*0.08));
    var lo=Math.max(0,vmin-pad), hi=usaScore?Math.min(104,vmax+pad):vmax+pad;
    if(hi<=lo) hi=lo+1;
    var W=100,H=42,TOPP=7,BASEP=H-4;
    function X(i){ return (i/(n-1))*W; }
    function Y(v){ return BASEP-((v-lo)/(hi-lo))*(BASEP-TOPP); }
    var P=pts.map(function(h,i){ return [X(i),Y(val(h))]; });
    // curva suave (Catmull-Rom convertida em Bezier)
    var dLine='M'+P[0][0].toFixed(2)+' '+P[0][1].toFixed(2);
    for(var i=0;i<n-1;i++){
      var p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n-1,i+2)];
      dLine+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(2)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(2)+
             ' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(2)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(2)+
             ' '+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
    }
    var dArea=dLine+' L'+W+' '+H+' L0 '+H+' Z';
    // pontos, rotulo do ultimo, eixo de meses (decimado pra nunca amontoar)
    var atual=pts[n-1], prev=pts[n-2];
    var dots='', axis='', step=Math.ceil(n/6);
    pts.forEach(function(h,i){
      var lx=X(i).toFixed(2), ly=((Y(val(h))/H)*100).toFixed(2);
      var tip='<b>'+(usaScore?'score '+val(h):nf(val(h))+' km')+'</b> '+mesNome(h.mes)+' de '+String(h.mes).slice(0,4)+
        (usaScore&&h.km_mes!=null?', '+nf(h.km_mes)+' km':'')+
        (h.horas_operacao!=null?', '+nf(h.horas_operacao)+' h':'');
      dots+='<span class="tj-dot'+(i===n-1?' last':'')+'" style="left:'+lx+'%;top:'+ly+'%" data-tip="'+esc(tip)+'" role="img" aria-label="'+esc(mesNome(h.mes)+': '+(usaScore?val(h):nf(val(h))+' km'))+'"></span>';
      if(i%step===0||i===n-1) axis+='<span style="left:'+Math.max(3,Math.min(97,X(i))).toFixed(2)+'%">'+mesAbr(h.mes)+'</span>';
    });
    var labLeft=Math.max(10,Math.min(90,X(n-1))).toFixed(2);
    var lab='<span class="tj-lab" style="left:'+labLeft+'%;top:'+((Y(val(atual))/H)*100).toFixed(2)+'%"><b>'+(usaScore?val(atual):nf(val(atual)))+'</b>'+mesAbr(atual.mes)+'</span>';
    // delta do mes atual vs o anterior da propria curva
    var chip='';
    if(val(prev)>0){
      var pc=Math.round((val(atual)/val(prev)-1)*100), rotc=' vs '+mesNome(prev.mes);
      chip = pc===0 ? '<span class="dlt neu">= '+rotc.trim()+'</span>'
        : '<span class="dlt '+(usaScore?(pc>0?'good':'bad'):'neu')+'">'+(pc>0?'\u2191':'\u2193')+' '+Math.abs(pc)+'%'+rotc+'</span>';
    }
    // conclusao factual, derivada da propria curva (nada fixo, nada inventado)
    var frase;
    if(val(pts[0])===val(atual)){
      frase=usaScore
        ? 'De '+mesNome(pts[0].mes)+' a '+mesNome(atual.mes)+', o score de condu\u00e7\u00e3o da frota se manteve em '+val(atual)+'.'
        : 'De '+mesNome(pts[0].mes)+' a '+mesNome(atual.mes)+', a frota manteve o ritmo de '+nf(val(atual))+' km no m\u00eas.';
    } else {
      frase=usaScore
        ? 'De '+mesNome(pts[0].mes)+' a '+mesNome(atual.mes)+', o score de condu\u00e7\u00e3o da frota foi de '+val(pts[0])+' a '+val(atual)+'.'
        : 'De '+mesNome(pts[0].mes)+' a '+mesNome(atual.mes)+', a frota foi de '+nf(val(pts[0]))+' a '+nf(val(atual))+' km no m\u00eas.';
    }
    if(n===2) frase+=' O hist\u00f3rico da sua frota come\u00e7ou a ser escrito, um ponto novo entra a cada relat\u00f3rio.';
    TJ={now:val(atual), dec:0};
    return '<div class="traj reveal">'+
      '<div class="traj-head"><div>'+
        '<div class="km-cap">Trajet\u00f3ria da frota</div>'+
        '<div class="traj-now"><span class="tn grad" id="tjNow">0</span>'+
          '<span class="tu">'+(usaScore?'score de condu\u00e7\u00e3o, 0 a 100':'km rodados no m\u00eas')+chip+'</span></div>'+
      '</div></div>'+
      '<div class="traj-plot">'+
        '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Evolu\u00e7\u00e3o mensal da frota">'+
          '<defs>'+
            '<linearGradient id="tjStroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5A72"/><stop offset=".55" stop-color="#FF2D4B"/><stop offset="1" stop-color="#FF4FA0"/></linearGradient>'+
            '<linearGradient id="tjFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF2D4B" stop-opacity=".16"/><stop offset="1" stop-color="#FF2D4B" stop-opacity="0"/></linearGradient>'+
          '</defs>'+
          '<path class="traj-area" d="'+dArea+'"></path>'+
          /* pathLength normaliza a regua do dash: com non-scaling-stroke o Chromium mede
             o dash em px de tela e a linha sairia falhada no path esticado */
          '<path class="traj-line" d="'+dLine+'" pathLength="100"></path>'+
        '</svg>'+
        dots+lab+
        '<span class="km-tip" id="tjTip"></span>'+
      '</div>'+
      '<div class="traj-axis">'+axis+'</div>'+
      '<span class="km-hint scr">passe o mouse ou toque num ponto para ver o m\u00eas</span>'+
      insightHtml(frase)+
    '</div>';
  }

  var instant = false;
  function countUp(node, alvo, opt){
    if(alvo==null || !isFinite(alvo)){ node.textContent='—'; return; } // sem dado ainda = travessão, nunca "null"
    opt = opt||{}; var dur=opt.dur||1100, dec=opt.dec||0, suf=opt.suf||'', pre=opt.pre||'';
    function render(v){ node.textContent = pre + v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + suf; }
    if(reduce || instant){ render(alvo); return; }
    var t0 = performance.now();
    (function tick(t){
      var p = Math.min(1,(t-t0)/dur), val = alvo*(1-Math.pow(1-p,3));
      render(dec ? Math.round(val*Math.pow(10,dec))/Math.pow(10,dec) : Math.round(val));
      if(p<1) requestAnimationFrame(tick); else render(alvo);
    })(performance.now());
  }

  var pending = [];
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(ents){
    ents.forEach(function(e){ if(!e.isIntersecting) return; e.target.classList.add('in'); if(e.target._ov) e.target._ov(); io.unobserve(e.target); });
  },{threshold:.16}) : null;
  function watch(node, onview){
    if(!node) return;
    if(io && !reduce){ var rec={node:node,onview:onview}; pending.push(rec);
      node._ov = function(){ pending = pending.filter(function(r){return r!==rec;}); if(onview) onview(); };
      io.observe(node);

  function kmChartHtml(){
    var arr=(D.km_diario||[]); if(!arr.length) return '';

    }).join('');
    // régua horizontal · passo "bonito" (múltiplo de 1/2/5 × 10^k) calculado do próprio dado
    var pow=Math.pow(10,Math.floor(Math.log10(max))), f=max/pow;
    var step=(f>=2.5?pow:(f>=1.2?pow/2:pow/5));
    var grid='', scale='';
    for(var g=step; g<max; g+=step){
      var yy=yOf(g).toFixed(2);

      scale+='<span class="km-scale" style="top:'+((yOf(g)/H)*100).toFixed(2)+'%">'+nf(g)+'</span>';
    }
    // eixo de dias visível · rótulos 1,5,10,15,20,25 e o último dia (mês curto mostra todos)
    var marcos={1:1,5:1,10:1,15:1,20:1,25:1};
    var axis=arr.map(function(x,i){
      var dn=parseInt((x.d||'').split('-')[2],10);
      if(n>10 && !(marcos[dn]||i===n-1)) return '';
      return '<span style="left:'+(((i+0.5)/n)*100).toFixed(2)+'%">'+dn+'</span>';
    }).join('');
    var p=(peak.d||'').split('-'); var pkTxt=(p[2]||'')+'/'+(p[1]||'');
    /* com poucas barras o pico cai perto da borda e o translateX(-50%) jogaria o rotulo pra fora */
    var peakLeft=Math.max(12, Math.min(88, ((peakIdx+0.5)/n)*100)).toFixed(2);
    // frase-conclusão derivada do próprio km_diario (nada fixo)
    var uteis=arr.filter(function(x){ return !isFimDeSemana(x.d); });
    var fds=arr.filter(function(x){ return isFimDeSemana(x.d); });

    function renderRank(){
      var arr=veiculos.slice();
      /* v3.5 · recorte por tipo antes de tudo; maquina (km null) nunca some, ela lidera em horas */
      if(mv.tipo==='maquinas') arr=arr.filter(function(v){return v.tipo==='maquina';});
      else if(mv.tipo==='veiculos') arr=arr.filter(function(v){return v.tipo!=='maquina';});
      if(mv.filter==='ociosos') arr=arr.filter(function(v){return v.ocioso;});
      arr.sort(function(a,b){ return (b[mv.metric]||0)-(a[mv.metric]||0); });
      var showAll = (mv.filter==='ociosos'||mv.expanded);
      var shown = showAll ? arr : arr.slice(0,5);
      var maxV = arr.length ? Math.max.apply(null, arr.map(function(v){return v[mv.metric]||0;})) : 1;

      rank.innerHTML = shown.map(function(v,i){
        var val=v[mv.metric];

                 '<span class="kv">'+nfDash(val,' '+unit)+'<small>'+altVal+'</small></span>'+

      }).join('');

    // ---------- Km por dia · tooltip por barra (hover no desktop + toque no mobile, sem sequestrar a rolagem) ----------
    (function(){
      var chart=sec.querySelector('.kmchart'); if(!chart) return;
      var svg=chart.querySelector('svg'), tip=el('kmTip'), arr=(D.km_diario||[]), n=arr.length;
      if(!svg||!tip||!n) return;
      var kmMax=arr.reduce(function(m,x){ return Math.max(m,x.km||0); },0)||1;
      function fmtD(d){ var pp=(d||'').split('-'); return (pp[2]||'')+'/'+(pp[1]||''); }
      function show(clientX){
        var r=svg.getBoundingClientRect(); if(!r.width) return;
        var idx=Math.floor(((clientX-r.left)/r.width)*n);
        if(idx<0) idx=0; if(idx>=n) idx=n-1;
        var x=arr[idx]; if(!x) return;
        tip.innerHTML='<b>'+fmtD(x.d)+'</b>, '+nf(x.km||0)+' km';
        tip.style.left=(((idx+0.5)/n)*100).toFixed(2)+'%';
        // aparece logo acima do TOPO da barra do dia (perto de onde o olho está), não num topo fixo
        var H=44, base=H-1, topPad=3, yTop=base-((x.km||0)/kmMax)*(base-topPad);
        tip.style.top=((yTop/H)*100).toFixed(2)+'%';
        tip.classList.add('on');
      }
      function hide(){ tip.classList.remove('on'); }
      svg.addEventListener('pointermove',function(e){ show(e.clientX); });
      svg.addEventListener('pointerover',function(e){ show(e.clientX); }); // entrar parado (ex.: rolagem de trackpad) também mostra
      svg.addEventListener('pointerleave',hide);
      svg.addEventListener('pointerdown',function(e){ show(e.clientX); }); // toque: não damos preventDefault, então a rolagem segue livre
      document.addEventListener('pointerdown',function(e){ if(!chart.contains(e.target)) hide(); });
    })();

      Array.prototype.forEach.call(el('mvFilter').children,function(c){ c.setAttribute('aria-pressed', c.getAttribute('data-f')===mv.filter?'true':'false'); });

      if(utilPrev!=null){ util.expanded=utilPrev; utilPrev=null; renderUtil(); } });

      '<div class="rank reveal">'+top.map(function(v,i){
        var w=Math.max(4,Math.round((v.horas||0)/maxH*100));
        var dias=diasMap[v.placa];
        var etq=(v.ocioso===true)?'<span class="tag ghost">Parada</span>':(i===0&&(v.horas||0)>0?'<span class="tag solid">Mais horas</span>':'');
        return '<div class="rrow" tabindex="0" role="button" data-placa="'+esc(v.placa)+'" aria-label="Ver ficha de '+esc(v.placa)+'">'+
          '<span class="plate">'+esc(v.placa)+'</span>'+
          '<div class="who"><div class="model"><span class="mname">'+esc(v.modelo)+'</span>'+etq+'</div>'+
            '<div class="bar"><i style="--w:'+w+'%"></i></div></div>'+
          '<span class="kv">'+nfDash(v.horas,' h')+(dias!=null&&nd?('<small>'+dias+' de '+nd+' dias</small>'):'')+'</span>'+
        '</div>';
      }).join('')+'</div>'+
      (rankM.length>5?'<p class="note reveal">Mostrando as 5 de maior atividade de '+nf(rankM.length)+' máquinas, todas estão no recorte Máquinas da frota em movimento.</p>':'')+
      (marcos.length?('<p class="alerts-cap reveal">Revisão pelo horímetro</p>'+
        '<div class="alerts reveal">'+marcos.map(function(x){
          return '<div class="acard"><div class="aq mono">'+esc(x.placa)+'</div>'+
            '<div class="at">passou das '+nf(x.marco_h)+' h de motor, programe a revisão</div>'+

    sec.innerHTML=h;

  // ---------- Bloco · Sua frota vs o mercado (benchmark anônimo por porte) ----------
  (function(){

  // ---------- Bloco 3 · Vigilância ativa ----------
  // mapa de calor de alertas · o robô manda a matriz 7×24 (linha 0 = segunda); o front agrega em 4 períodos
  function heatAlertasHtml(ha){
    var M=ha&&ha.matriz; if(!M||!M.length||!ha.total) return '';
    var dias=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    var diasFull=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
    var periodos=[['Madrugada','0h às 6h',0,6],['Manhã','6h às 12h',6,12],['Tarde','12h às 18h',12,18],['Noite','18h às 24h',18,24]];
    // agrega as 24 horas de cada dia nos 4 períodos
    var grid=M.map(function(lin){ lin=lin||[];
      return periodos.map(function(p){ var s=0; for(var h=p[2];h<p[3];h++){ s+=(lin[h]||0); } return s; });
    });
    var max=0, mi=0, mj=0;
    for(var i=0;i<grid.length;i++){ for(var j=0;j<grid[i].length;j++){ if(grid[i][j]>max){ max=grid[i][j]; mi=i; mj=j; } } }
    if(max<=0) return '';
    var head='<div class="hm-corner"></div>'+periodos.map(function(p){
      return '<div class="hm-ph">'+p[0]+'<small>'+p[1]+'</small></div>'; }).join('');
    var corpo='';
    for(var d=0;d<grid.length;d++){
      corpo+='<div class="hm-day">'+(dias[d]||('D'+d))+'</div>';
      for(var k=0;k<4;k++){
        var val=grid[d][k];
        if(val<=0){ corpo+='<div class="hm-cell z" title="'+(dias[d]||'')+', '+periodos[k][0]+', 0 alertas">·</div>'; }
        else { var op=(0.14+0.5*(val/max)).toFixed(2);
          corpo+='<div class="hm-cell" style="background:rgba(255,45,75,'+op+')" title="'+(dias[d]||'')+', '+periodos[k][0]+', '+val+' alertas">'+val+'</div>'; }
      }
    }
    var read='Seu risco se concentra na '+periodos[mj][0].toLowerCase()+' de '+diasFull[mi]+', é quando vale reforçar a atenção.';
    return '<p class="alerts-cap reveal">Quando os alertas acontecem, por período do dia</p>'+
      '<div class="hm-wrap reveal"><div class="hmgrid">'+head+corpo+'</div>'+
        '<div class="hm-leg"><span>menos</span><span class="hm-ramp"></span><span>mais</span></div></div>'+
      insightHtml(read);
  }

        /* TRAVA DE MARCA: o anel e os indicadores falam da ATIVIDADE DA FROTA, nunca de

        '<div class="ctr"><span class="p grad">'+pctTxt+'</span><span class="l">da frota em atividade, últimas 24h</span></div></div>'+
        '<div class="indics">'+
          '<div class="indic"><span class="dot"></span><span class="it"><b>'+v.rastreadores_online+'</b> veículos em atividade nas últimas 24 horas</span></div>'+
          (v.sinal_qualidade_pct!=null?('<div class="indic"><span class="dot"></span><span class="it">Qualidade de sinal <b>'+sinalTxt+'</b></span></div>'):'')+

  // ---------- Bloco · Motoristas (identificação por chave eletrônica; só com D.motoristas) ----------

  (function(){

      fadiga:['alerta de fadiga','alertas de fadiga'],distracao:['alerta de distração','alertas de distração']};
    function evTxt(ev){

        '<span class="lbl">medido pelo leitor do veículo, não por declaração</span></span></div>'+
      '<div class="substats reveal">'+
        '<div class="s"><div class="n mono" id="mtA">0</div><div class="l">Autenticações no leitor</div></div>'+
        (pctId!=null?('<div class="s"><div class="n mono" id="mtP">0</div><div class="l">Dos km com motorista identificado</div></div>'):'')+
        (semId&&semId.km!=null?('<div class="s"><div class="n mono" id="mtS">0</div><div class="l">Km sem identificação no mês</div></div>'):'')+
      '</div>'+

      '<div class="drvlist reveal">'+rows+'</div>'+
      (semId&&semId.km!=null?(
        '<p class="note reveal" style="margin-top:12px">'+nf(semId.km)+' km rodaram sem chave de identificação'+
        ((semId.veiculos&&semId.veiculos.length)?(', concentrados em '+semId.veiculos.slice(0,4).map(esc).join(', ')):'')+
        '. Cobrar o uso da chave nesses veículos fecha o mapa: cada km com dono.</p>'):'')+

      countUp(el('mtA'), M.autenticacoes);

  (function(){

    var reais=litros*ec.premissa_preco_litro;
    var reaisTxt='R$ '+reais.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
    var insEc='Cortar um terço desse desperdício devolve na ordem de R$ '+

    var h=''+

        '<p class="sub">O desperdício da operação, convertido em reais e pronto para cortar.</p></div>'+

        '<div class="s"><div class="n mono" id="ecV">0</div><div class="l">Eventos de velocidade, medido</div></div>'+
      '</div>'+
      (function(){
        if(!ec.por_veiculo||!ec.por_veiculo.length) return '';
        return '<p class="alerts-cap reveal">Onde o dinheiro está vazando, custo estimado no mês</p>'+
          '<div class="alerts reveal">'+ec.por_veiculo.map(function(x){
