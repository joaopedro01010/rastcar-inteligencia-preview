<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastcar Inteligência · Relatório da frota</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{
  --bg:#080608;
  --bg2:#0d0509;
  --panel:rgba(255,255,255,.028);
  --panel-b:rgba(255,255,255,.09);
  --bordo:#4A0010;
  --crimson:#FF2D4B;
  --crimson-2:#E01E37;
  --magenta:#FF4FA0;
  --ice:#5FE0FF;
  --offwhite:#F8F4EE;
  --ink:#F3ECE6;
  --muted:#9b9096;
  --muted-2:#6f666c;
  --hair:rgba(255,255,255,.08);
  --glow:0 0 30px rgba(255,45,75,.35);
  --head:'Archivo',system-ui,sans-serif;
  --title:'D-DIN','D-DIN Exp',system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --maxw:1080px;
  --pad:clamp(18px,4vw,44px);
  --nav-h:56px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--head);
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* fundo vivo (rotas GPS) + vinheta */
#bgv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,45,75,.06), transparent 55%),
    radial-gradient(100% 60% at 50% 120%, rgba(74,0,16,.35), transparent 60%),
    linear-gradient(180deg, rgba(8,6,8,.30), rgba(8,6,8,.62));
}
.stage{position:relative;z-index:2}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--crimson);font-weight:500;
  display:inline-flex;align-items:center;gap:11px;
}
/* risco antes do eyebrow · mesma assinatura estrutural do site */
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6;flex:0 0 auto}
.seal .eyebrow::before{display:none}
.grad{
  background:linear-gradient(96deg,#FF5A72 0%,var(--crimson) 42%,var(--magenta) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,45,75,.28));
}

/* ---------- Etiquetas · veredito curto, sempre ancorado num dado real ---------- */
.tag{
  display:inline-block;font-family:var(--head);font-weight:700;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;line-height:1;
  padding:5px 9px 4px;border-radius:3px;border:1px solid transparent;
  transform:skewX(-4deg);white-space:nowrap;vertical-align:middle;
}
.tag.solid{background:linear-gradient(96deg,var(--crimson-2),var(--crimson));color:#fff}
.tag.good{color:#37D18A;background:rgba(55,209,138,.12);border-color:rgba(55,209,138,.40)}
.tag.warn{color:#FF9E7A;background:rgba(255,122,77,.13);border-color:rgba(255,122,77,.40)}
.tag.ghost{color:var(--muted);background:rgba(255,255,255,.04);border-color:var(--hair)}
.tag + .tag{margin-left:6px}

/* ---------- Header (co-marca provedor + cliente) ---------- */
header.top{padding:34px 0 26px}
header.top .wrap{display:flex;flex-direction:column;gap:14px}
.seal{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.seal img.wm{width:clamp(158px,30vw,184px);height:auto;display:block}
.seal img.wm-print{display:none}
.seal .sx{color:var(--crimson);font-size:19px;line-height:1;opacity:.85}
.seal .eyebrow{font-size:11px}
.client{
  font-family:var(--title);font-weight:700;text-transform:uppercase;letter-spacing:-.012em;
  font-size:clamp(30px,7.4vw,72px);line-height:.99;margin:12px 0 6px;
  color:var(--offwhite);text-wrap:balance;
}
.hook{
  font-family:var(--head);font-weight:600;letter-spacing:-.01em;
  font-size:clamp(15px,2.4vw,20px);color:var(--ink);margin:0 0 8px;
}
.h-meta{
  font-family:var(--mono);font-size:11.5px;color:var(--muted-2);
  display:flex;flex-wrap:wrap;gap:5px 14px;letter-spacing:.02em;
}
.h-meta b{color:var(--ink);font-weight:500}

/* ---------- Nav de segmentos (controle) ---------- */
nav.seg{
  position:sticky;top:0;z-index:30;
  background:rgba(8,6,8,.72);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
nav.seg .wrap{display:flex;gap:6px;height:var(--nav-h);align-items:center;overflow-x:auto;scrollbar-width:none}
nav.seg .wrap::-webkit-scrollbar{display:none}
nav.seg a{
  flex:0 0 auto;font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s,background .2s;
}
nav.seg a:hover{color:var(--ink)}
nav.seg a.active{color:#fff;border-color:rgba(255,45,75,.55);background:rgba(255,45,75,.10)}
nav.seg a .n{font-family:var(--mono);font-weight:500;letter-spacing:.06em;color:var(--crimson);margin-right:7px}

/* ---------- Seções ---------- */
main{padding:8px 0 60px}
section.block{padding:56px 0 8px;scroll-margin-top:calc(var(--nav-h) + 12px)}
main section.block:empty{display:none}
main section.block + section.block{border-top:1px solid var(--hair)}
.block-head{margin-bottom:26px;max-width:64ch}
.block-head h2{
  font-family:var(--title);font-weight:700;text-transform:uppercase;
  font-size:clamp(25px,4.4vw,46px);letter-spacing:-.008em;
  margin:.28em 0 0;line-height:.99;text-wrap:balance;
}
.block-head .sub{color:var(--muted);font-size:15px;margin-top:8px}

/* dominante: número/insight-herói */
.hero-stat{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:6px 0 4px}
.hero-stat .big{
  font-family:var(--title);font-variant-numeric:tabular-nums;
  font-size:clamp(52px,13.6vw,116px);font-weight:700;line-height:.88;letter-spacing:-.022em;
}
.hero-stat .cap{padding-bottom:10px}
.hero-stat .cap .u{font-family:var(--mono);font-size:15px;color:var(--muted);display:block}
.hero-stat .cap .lbl{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);margin-top:4px;
}

/* stats secundários */
.substats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-top:22px}
.substats .s{background:rgba(10,7,10,.55);padding:16px 18px}
.substats .s .n{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:clamp(21px,3.4vw,30px);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.substats .s .l{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2);margin-top:6px}
.narrativa{font-size:clamp(17px,2.5vw,21px);line-height:1.5;color:var(--ink);max-width:60ch;text-wrap:balance;margin:26px 0 0;font-weight:500}
.narrativa b{color:#fff}

/* callout de insight */
.callout{
  margin-top:22px;display:flex;gap:14px;align-items:flex-start;
  background:linear-gradient(100deg, rgba(255,45,75,.10), rgba(255,45,75,.02));
  border:1px solid rgba(255,45,75,.28);border-radius:12px;padding:16px 20px;
}
.callout .bolt{width:8px;align-self:stretch;border-radius:6px;background:linear-gradient(var(--crimson),var(--magenta));box-shadow:var(--glow);flex:0 0 auto}
.callout .ck{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson);display:block;margin-bottom:5px}
.callout .ct{font-size:16px;font-weight:500;line-height:1.4;color:var(--ink)}
/* insight "o que isso diz" · discreto (bg mais suave que o callout base) */
.callout.insight{background:linear-gradient(100deg, rgba(255,45,75,.055), rgba(255,45,75,.012));border-color:rgba(255,45,75,.20);margin-top:24px}
.callout.insight .ct{font-size:15px}
.alerts-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin:0 0 12px}
.rank-hint{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted-2);align-self:center;margin-left:2px}

/* ---------- Controles (segmented + toggle) ---------- */
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0 20px}
.segset{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:999px;padding:3px}
.segset button{
  font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.18s;
}
.segset button:hover{color:var(--ink)}
.segset button[aria-pressed="true"]{color:#fff;background:linear-gradient(96deg,var(--crimson-2),var(--crimson));box-shadow:0 4px 16px rgba(255,45,75,.3)}
.ctl-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}

/* ---------- Ranking ---------- */
.rank{display:flex;flex-direction:column}
.rrow{
  display:grid;grid-template-columns:98px 1fr auto;align-items:center;gap:16px;
  padding:13px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer;
  transition:background .2s,border-color .2s,transform .15s;
}
.rrow:hover,.rrow:focus-visible{background:rgba(255,45,75,.06);border-color:rgba(255,45,75,.22);outline:none}
.rrow:hover .bar>i{filter:brightness(1.25)}
.rrow .plate{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.02em;color:var(--ink)}
.rrow .who{min-width:0}
.rrow .model{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:6px}
.rrow .mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .model .tag{flex:0 0 auto}
.bar{height:7px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--crimson-2),var(--crimson) 60%,var(--magenta));
  box-shadow:0 0 14px rgba(255,45,75,.4);transition:width .9s cubic-bezier(.22,1,.36,1),filter .2s}
.rrow .kv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;text-align:right;color:var(--ink);white-space:nowrap}
.rrow .kv small{display:block;font-size:10px;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-top:2px}
.more{
  margin-top:14px;font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--crimson);
  background:none;border:1px solid rgba(255,45,75,.3);border-radius:999px;padding:9px 18px;cursor:pointer;transition:.2s;
}
.more:hover{background:rgba(255,45,75,.08);color:#fff}

/* ---------- Heatmap ---------- */
.heat-wrap{margin-top:34px;position:relative}
.heat-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
#rzMap{height:440px;border-radius:14px;border:1px solid var(--hair);background:#0b0509;position:relative;z-index:2;overflow:hidden}
body:not(.light) #rzMap .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.82) saturate(.35)}
body.light #rzMap{background:#ECEBE8}
.heat-cities{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.heat-cities .hc{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);border:1px solid var(--hair);border-radius:999px;padding:6px 12px}
.heat-cities .hc b{color:var(--ink);font-weight:500}
@media (max-width:640px){#rzMap{height:320px}}
/* navegação rápida do mapa */
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);
  background:none;border:1px solid var(--hair);border-radius:999px;padding:6px 12px;cursor:pointer;
  transition:color .18s,border-color .18s,background .18s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.mchips button:hover{color:var(--ink);border-color:rgba(255,45,75,.4)}
.mchips button.on{color:#fff;border-color:rgba(255,45,75,.55);background:rgba(255,45,75,.12)}
body.light .mchips button.on{color:#C81430;background:rgba(224,30,55,.08);border-color:rgba(200,20,48,.4)}
.map-tools{position:absolute;top:10px;right:10px;z-index:930;display:flex;flex-direction:column;gap:6px}
.map-tools button{font-family:var(--head);font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:#F3ECE6;background:rgba(14,10,14,.82);border:1px solid rgba(255,255,255,.16);border-radius:8px;
  padding:7px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.map-tools button:hover{border-color:rgba(255,45,75,.5)}
body.light .map-tools button{background:rgba(255,255,255,.92);color:#16161A;border-color:rgba(0,0,0,.16)}
#rzMap.exp{height:min(78vh,720px)}
.hc.link{cursor:pointer;transition:border-color .18s,color .18s}
.hc.link:hover{border-color:rgba(255,45,75,.45);color:var(--ink)}
.map-lock{position:absolute;inset:0;z-index:920;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;cursor:pointer}
.map-lock span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:rgba(14,10,14,.85);border:1px solid rgba(255,45,75,.4);border-radius:999px;padding:8px 14px}
body.light .map-lock span{background:rgba(255,255,255,.95);color:#16161A;border-color:rgba(200,20,48,.35)}
.dlt{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle;border:1px solid;white-space:nowrap}
.dlt.good{color:#37D18A;border-color:rgba(55,209,138,.4)}
.dlt.bad{color:#FF5A78;border-color:rgba(255,45,75,.4)}
.dlt.neu{color:var(--muted);border-color:var(--hair)}
body.light .dlt.good{color:#1C7A45;border-color:rgba(28,122,69,.4)}
body.light .dlt.bad{color:#C81430;border-color:rgba(200,20,48,.35)}
#rzMap .leaflet-tooltip{font-family:var(--mono);font-size:11.5px;line-height:1.5;border-radius:8px;border:1px solid rgba(224,30,55,.45);background:rgba(255,255,255,.96);color:#16161A;box-shadow:0 6px 22px rgba(0,0,0,.25)}
#rzMap .leaflet-tooltip b{color:#C81430}
#rzMap .leaflet-interactive{cursor:pointer}

/* ---------- Vigilância ---------- */
.vig-top{display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:center;
  background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;padding:28px 30px}
.ring{position:relative;width:168px;height:168px;flex:0 0 auto}
.ring svg{width:168px;height:168px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:11}
.ring .arc{fill:none;stroke:url(#gArc);stroke-width:11;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,45,75,.55))}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr .p{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:38px;font-weight:700;letter-spacing:-.015em;line-height:1}
.ring .ctr .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:7px;max-width:100px;line-height:1.3}
.indics{display:flex;flex-direction:column;gap:15px}
.indic{display:flex;align-items:baseline;gap:12px}
.indic.p1{flex-wrap:wrap;row-gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:#37d18a;flex:0 0 auto;position:relative;top:1px;box-shadow:0 0 0 0 rgba(55,209,138,.5);animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,209,138,.45)}70%{box-shadow:0 0 0 7px rgba(55,209,138,0)}100%{box-shadow:0 0 0 0 rgba(55,209,138,0)}}
.indic .it{font-size:14.5px;color:var(--ink)}
.indic .it b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;color:#fff}
.anchor{margin:26px 0 6px;font-family:var(--title);font-size:clamp(19px,3vw,28px);font-weight:700;letter-spacing:-.005em;line-height:1.12;text-wrap:balance}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.acard{background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;padding:18px 20px}
.acard .aq{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;letter-spacing:-.015em;color:#fff;line-height:1}
.acard .at{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.35}

/* ---------- Comportamento ---------- */
.comp-grid{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
.gauge{background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;padding:26px 22px;text-align:center}
.gauge .gn{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:clamp(56px,9.4vw,78px);font-weight:700;letter-spacing:-.02em;line-height:1}
.gauge .gl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.gauge .gbar{height:6px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:18px;overflow:hidden}
.gauge .gbar>i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--crimson),var(--magenta));box-shadow:var(--glow);transition:width 1s cubic-bezier(.22,1,.36,1)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.col.attn h3{color:var(--crimson)}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.18s}
.crow:hover{background:rgba(255,45,75,.06);border-color:rgba(255,45,75,.2)}
.crow .cp{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--ink)}
.crow .cs{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;padding:2px 10px;border-radius:6px;min-width:44px;text-align:center}
.cs.good{color:#37d18a;background:rgba(55,209,138,.12)}
.cs.mid{color:var(--ink);background:rgba(255,255,255,.07)}
.cs.warn{color:#ff7a4d;background:rgba(255,122,77,.14)}
.crow .cx{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- Drill-down (ficha do veículo) ---------- */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(4,3,4,.66);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.ovl.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:61;top:0;right:0;height:100%;width:min(420px,92vw);
  background:linear-gradient(180deg,#120810,#0a060a);border-left:1px solid rgba(255,45,75,.28);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding:28px var(--pad);overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.5);
}
.sheet.open{transform:none}
.sheet .x{position:absolute;top:18px;right:18px;background:none;border:1px solid var(--hair);color:var(--muted);
  width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;transition:.2s}
.sheet .x:hover{color:#fff;border-color:rgba(255,45,75,.5)}
.sheet .sk{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson)}
.sheet .sp{font-family:var(--title);font-size:34px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px;color:#fff}
.sheet .sm{color:var(--muted);font-size:14px;margin-bottom:22px}
.sheet .drow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair)}
.sheet .drow .dl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.sheet .drow .dv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink);text-align:right}
.sheet .dv.crim{color:var(--crimson)}
.sheet .note{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-top:20px;line-height:1.6}

/* ---------- Footer ---------- */
footer.bot{border-top:1px solid var(--hair);padding:30px 0;margin-top:40px;position:relative}
footer.bot::before{content:"";position:absolute;top:-1px;left:0;width:120px;height:2px;background:linear-gradient(90deg,var(--crimson),transparent)}
footer.bot .wrap{display:flex;flex-direction:column;gap:10px}
footer.bot .slogan{font-size:15px;font-weight:600;letter-spacing:-.01em}
footer.bot .f-line{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
footer.bot b{color:var(--ink);font-weight:500}

/* ---------- Botão PDF ---------- */
.pdfbtn{position:fixed;right:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(96deg,var(--crimson-2),var(--crimson));color:#fff;border:0;border-radius:999px;
  padding:11px 18px;cursor:pointer;box-shadow:0 8px 26px rgba(255,45,75,.35);-webkit-tap-highlight-color:transparent}
.pdfbtn:hover{filter:brightness(1.08)}
.pdfbtn .pi{width:12px;height:13px;border:1.6px solid #fff;border-top:0;border-radius:0 0 2px 2px;position:relative}
.pdfbtn .pi::before{content:"";position:absolute;left:50%;top:-8px;width:1.6px;height:8px;background:#fff;transform:translateX(-50%)}
.pdfbtn .pi::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;border-right:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:translate(-50%,-50%) rotate(45deg)}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- O mês em 30 segundos (porta de entrada) ---------- */
section.dg{padding:34px 0 0;border-top:0 !important}
.dgt{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--crimson);margin:0 0 14px;
  display:flex;align-items:center;gap:11px}
.dgt::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6;flex:0 0 auto}
.dgrid{display:flex;flex-direction:column;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.dline{display:flex;align-items:baseline;gap:12px;padding:14px 18px;background:rgba(10,7,10,.55);text-decoration:none;transition:background .2s}
.dline:hover{background:rgba(255,45,75,.07)}
.dline .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);flex:1 1 auto;min-width:0}
.dline .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:500;color:var(--ink);white-space:nowrap}
.dline .go{font-family:var(--mono);color:var(--crimson);font-size:15px;flex:0 0 auto;align-self:center}
.dline.act{flex-wrap:wrap}
.dline.act .k{flex-basis:100%}
.dline.act .v{white-space:normal;font-family:var(--head);font-size:14.5px;font-weight:500;line-height:1.4;flex:1 1 0;min-width:0}
body.light .dgrid{background:rgba(0,0,0,.09);border-color:rgba(0,0,0,.10)}
body.light .dline{background:#fff}
body.light .dline:hover{background:rgba(224,30,55,.05)}

/* ---------- Gráficos desenhados à mão (km/dia, calendário, benchmark, mapa de calor) ---------- */
.km-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
.kmwrap,.utilwrap,.mnt-wrap{margin-top:34px}
/* km por dia · barras SVG */
.kmchart{position:relative;padding-top:26px}
.kmplot{position:relative}
.kmplot svg{display:block;width:100%;height:112px;touch-action:pan-y}
.kmbase{stroke:var(--hair);stroke-width:1}
.kmgrid{stroke:var(--hair);stroke-width:1;opacity:.6}
.kmbar{fill:var(--crimson);opacity:.82}
.kmbar.we{fill:var(--muted-2);opacity:.55}
.kmbar.pk{fill:var(--magenta);opacity:1}
/* rótulos de escala (régua horizontal), no canto esquerdo sobre as linhas */
.km-scale{position:absolute;left:0;transform:translateY(-50%);font-family:var(--mono);font-size:9px;line-height:1;color:var(--muted-2);background:var(--bg);padding:1px 4px 1px 0;pointer-events:none}
/* rótulo do dia de pico, ancorado sobre a barra mais alta */
.km-peak{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;line-height:1.15;color:var(--muted);white-space:nowrap;text-align:center;pointer-events:none;z-index:2}
.km-peak b{display:block;color:var(--magenta);font-weight:600;font-size:12px}
.km-peak::after{content:"";display:block;width:1px;height:8px;background:var(--magenta);margin:3px auto 0;opacity:.7}
/* tooltip por barra · hover no desktop, toque no mobile */
.km-tip{position:absolute;top:-2px;transform:translate(-50%,-100%);font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--ink);background:var(--bg2);border:1px solid var(--panel-b);border-radius:8px;padding:5px 9px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3}
.km-tip.on{opacity:1}
.km-tip b{color:var(--magenta);font-weight:600}
.km-hint{display:block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--muted-2)}
/* eixo de dias sob o gráfico */
.km-axis{position:relative;height:14px;margin-top:6px}
.km-axis span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted-2)}
.km-leg{margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.km-leg b{color:var(--ink);font-weight:500}
.km-leg .lg{display:inline-flex;align-items:center;gap:6px;margin-right:14px}
.km-sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
.km-sw.wk{background:var(--crimson);opacity:.82}
.km-sw.we{background:var(--muted-2);opacity:.55}
.km-sw.pk{background:var(--magenta)}
/* utilização · uma linha por veículo, número grande de dias + barrinha + quadradinhos */
.km-sub{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--muted);margin:-4px 0 16px}
.urow{padding:16px 0;border-bottom:1px solid var(--hair)}
.urow:last-child{border-bottom:0}
.uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.uplate{font-family:var(--mono);font-size:13px;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.udias{font-family:var(--mono);color:var(--muted);font-size:12.5px}
.udias b{font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;color:var(--ink);margin-right:2px}
.usub{margin-left:auto}
.ubar{height:8px;background:var(--hair);border-radius:5px;overflow:hidden;margin-bottom:11px;max-width:440px}
.ubar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--crimson-2),var(--crimson))}
.ubar>i.low{background:linear-gradient(90deg,#7a2a34,var(--crimson-2))}
.udots{display:flex;flex-wrap:wrap;gap:4px}
.ucell{width:13px;height:13px;border-radius:3px;background:var(--hair);flex:0 0 auto}
.ucell.on{background:var(--crimson);opacity:.9}
.ucell.ulg{margin:0 2px 0 6px;display:inline-block}
/* manutenção preventiva */
.mnt-odo{margin-top:4px;font-family:var(--mono);color:var(--muted-2)}
.mnt-note{margin-top:12px}
/* benchmark vs mercado */
.bmlist{margin-top:8px}
.bm{padding:20px 0;border-bottom:1px solid var(--hair)}
.bm:last-child{border-bottom:0}
.bm-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bm-name{font-family:var(--head);font-weight:600;font-size:16px;color:var(--ink)}
.bm-row{display:grid;grid-template-columns:132px 1fr 72px;gap:12px;align-items:center;margin-top:8px}
.bm-l{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.bbar{height:10px;background:var(--hair);border-radius:6px;overflow:hidden}
.bbar>i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.bbar>i.avg{background:linear-gradient(90deg,#7a7280,#9b9096)}
.bbar>i.you.ok{background:linear-gradient(90deg,#2FB574,#37D18A);box-shadow:0 0 12px rgba(55,209,138,.32)}
.bbar>i.you.bad{background:linear-gradient(90deg,var(--crimson-2),var(--crimson));box-shadow:0 0 12px rgba(255,45,75,.32)}
.bm-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;color:var(--ink);text-align:right}
.bm-read{font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--muted);margin:12px 0 0}
.bm-read a{color:var(--crimson);text-decoration:none;border-bottom:1px solid rgba(255,45,75,.35)}
.bm-read a:hover{border-bottom-color:var(--crimson)}
/* mapa de calor de alertas · 7 dias × 4 períodos, número dentro da célula */
.hm-wrap{margin-top:8px}
.hmgrid{display:grid;grid-template-columns:58px repeat(4,1fr);gap:6px;align-items:stretch}
.hm-corner{}
.hm-ph{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted-2);text-align:center;line-height:1.25;align-self:end;padding-bottom:2px}
.hm-ph small{display:block;font-size:9px;letter-spacing:0;text-transform:none;color:var(--muted-2);margin-top:2px;opacity:.85}
.hm-day{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center}
.hm-cell{min-height:40px;border-radius:7px;background:var(--hair);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--ink)}
.hm-cell.z{color:var(--muted-2);font-weight:400}
.hm-leg{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.hm-ramp{flex:0 0 120px;height:9px;border-radius:5px;background:linear-gradient(90deg,rgba(255,45,75,.14),var(--crimson))}
/* trilhos claros no modo claro (o crimson/verde dos preenchimentos é acento e não muda) */
body.light .bbar{background:#E8E8E6}
body.light .kmbase{stroke:rgba(0,0,0,.14)}
body.light .km-tip{background:#fff;border-color:rgba(0,0,0,.16)}

/* ---------- Mobile ---------- */
@media (max-width:640px){
  body{font-size:17px}
  section.block{padding:44px 0 6px}
  .substats{grid-template-columns:1fr 1fr}
  .substats .s:last-child:nth-child(odd){grid-column:1 / -1}
  .rrow{grid-template-columns:76px 1fr auto;gap:11px;padding:12px 8px}
  .vig-top{grid-template-columns:1fr;gap:24px;justify-items:center;text-align:center}
  .indics{align-items:flex-start;text-align:left;width:100%}
  .alerts{grid-template-columns:1fr}
  .comp-grid{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .bm-row{grid-template-columns:96px 1fr 56px;gap:9px}
  .bm-l{font-size:10px}
  .kmchart svg{height:96px}
  .hmgrid{grid-template-columns:44px repeat(4,1fr);gap:4px}
  .hm-ph{font-size:9px}
  .hm-ph small{display:none}
  .hm-cell{min-height:36px;font-size:14px}
  .udias b{font-size:20px}
  .sheet{width:100%;top:auto;bottom:0;height:auto;max-height:86vh;border-left:0;border-top:1px solid rgba(255,45,75,.28);
    transform:translateY(100%);border-radius:18px 18px 0 0}
  .sheet.open{transform:none}
  .pdfbtn{right:12px;bottom:12px}
  .tag{font-size:9px;letter-spacing:.1em;padding:4px 7px 3px}
  .rrow .model{gap:6px}
}

/* ---------- Impressão / PDF · fundo CLARO + acentos CRIMSON/MAGENTA da web (web intocada) ---------- */
/* ---------- MODO CLARO (toggle na tela; mesma regra do print: superfície clara,
   corpo escuro, ACENTOS crimson/magenta intactos) ---------- */
body.light{--bg:#FAFAF8;--ink:#16161A;--muted:#63636A;--muted-2:#8B8B92;--hair:rgba(0,0,0,.10);--glow:none;background:var(--bg)}
body.light .veil{background:
  radial-gradient(120% 80% at 50% -10%, rgba(224,30,55,.05), transparent 55%),
  linear-gradient(180deg, rgba(250,250,248,.25), rgba(250,250,248,.68))}
body.light .wm-screen{display:none}
body.light .seal img.wm-print{display:block}
body.light nav.seg{background:rgba(250,250,248,.86);border-top-color:rgba(0,0,0,.07);border-bottom-color:rgba(0,0,0,.07)}
body.light nav.seg a.active{color:#C81430;border-color:rgba(200,20,48,.35);background:rgba(224,30,55,.08)}
body.light .segset{background:#fff;border-color:rgba(0,0,0,.14)}
body.light .substats{background:rgba(0,0,0,.09);border-color:rgba(0,0,0,.10)}
body.light .substats .s{background:#fff}
body.light .rrow{background:#fff;border-color:rgba(0,0,0,.07)}
body.light .rrow:hover{border-color:rgba(224,30,55,.35)}
body.light .bar{background:#E8E8E6}
body.light .vig-top{background:#fff;border:1px solid #E8E8E6}
body.light .ring .trk{stroke:#E8E8E6}
body.light .client{color:#0A0A0A}
body.light .acard{background:#fff;border:1px solid #E8E8E6}
body.light .acard .aq{color:#16161A}
body.light .indic .it b{color:#0A0A0A}
body.light .gauge{background:#fff;border:1px solid #E8E8E6}
body.light .gauge .gbar{background:#E8E8E6}
body.light .crow{background:#fff;border-color:rgba(0,0,0,.06)}
body.light .cs.good{color:#1C7A45;background:#E8F5EE}
body.light .cs.mid{color:#16161A;background:#F1F1F1}
body.light .cs.warn{color:#B5541C;background:#FBEEE6}
body.light .anchor{color:#C81430}
body.light .tag.good{color:#1C7A45;background:#E8F5EE;border-color:rgba(28,122,69,.35)}
body.light .tag.warn{color:#B5541C;background:#FBEEE6;border-color:rgba(181,84,28,.35)}
body.light .tag.ghost{color:#63636A;background:#F1F1F1;border-color:rgba(0,0,0,.12)}
body.light .more:hover{background:rgba(224,30,55,.07);color:#C81430}
body.light .sheet{background:#fff;border-left-color:rgba(224,30,55,.30);border-top-color:rgba(224,30,55,.30);box-shadow:-30px 0 60px rgba(0,0,0,.14)}
body.light .sheet .sp{color:#0A0A0A}
body.light .sheet .x:hover{color:#C81430;border-color:rgba(200,20,48,.5)}
.themebtn{position:fixed;right:16px;bottom:66px;z-index:40;font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(20,16,20,.82);color:#F3ECE6;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.themebtn:hover{border-color:rgba(255,255,255,.4)}
body.light .themebtn{background:#fff;color:#16161A;border-color:rgba(0,0,0,.18)}
@media (max-width:640px){.themebtn{right:12px;bottom:62px}}
@media print{.themebtn{display:none !important}}

/* Regra: só clareamos SUPERFÍCIES e escurecemos TEXTO DE CORPO pra legibilidade no branco.
   Os ACENTOS (numeros-heroi .grad, barras, anel, eyebrows, ·, regua/rotulo dos insights,
   .grad de "frota"/"dados"/"Dados.") NAO sao sobrescritos: mantêm o crimson/magenta da tela. */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none !important;text-shadow:none !important}
  /* o halo do número-herói é luz de tela · no papel vira mancha */
  .grad{filter:none !important}
  /* instrução de toque não existe no papel */
  .scr,.dline .go{display:none !important}
  html,body{background:#fff !important;color:#111 !important}
  /* esconde tudo que é interativo/animado */
  #bgv,.veil,.pdfbtn,nav.seg,.controls,.more,.heat-wrap,.ovl,.sheet{display:none !important}
  .stage{position:static}
  /* wordmark VERMELHA no papel (combina com o crimson no fundo branco) */
  .wm-screen{display:none !important}
  .wm-print{display:block !important}
  /* header · texto de corpo escuro; eyebrow/·/badge seguem crimson (nao sobrescritos) */
  header.top{padding:0 0 14px;border-bottom:1px solid rgba(255,45,75,.35);margin-bottom:6px}
  .client{color:#0A0A0A !important}
  .hook{color:#333 !important}                 /* o span .grad "frota" continua crimson */
  .h-meta{color:#7a7a7a !important}
  .h-meta b{color:#0A0A0A !important}
  .alerts-cap{color:#8a8a8a !important}
  /* seções · títulos escuros; eyebrow + numeros-heroi seguem crimson */
  section.block{padding:18px 0 6px !important}
  .block-head h2{color:#0A0A0A !important}
  .block-head .sub{color:#5a5a5a !important}
  .hero-stat .cap .u{color:#5a5a5a !important}
  .hero-stat .cap .lbl{color:#8a8a8a !important}
  /* porta de entrada · mesmas regras dos cards */
  .dgrid{background:#fff !important;border:1px solid #e6e6e6 !important}
  .dline{background:#fafafa !important}
  .dline .k{color:#8a8a8a !important}
  .dline .v{color:#0A0A0A !important}
  .substats{background:#fff !important;border:1px solid #e6e6e6 !important}
  .substats .s{background:#fafafa !important}
  .substats .s .n{color:#0A0A0A !important}
  .substats .s .l{color:#8a8a8a !important}
  .narrativa{color:#111 !important}
  .narrativa b{color:#000 !important}
  /* insight · bg pinkish leve da web fica; só escurece o corpo (.ct); .ck e .bolt seguem crimson */
  .callout .ct{color:#111 !important}
  /* ranking · trilho claro, mas a barra (.bar>i) segue o gradiente crimson→magenta da web */
  .rrow{border:0 !important;border-bottom:1px solid #ededed !important;border-radius:0 !important;background:none !important}
  .rrow .plate{color:#0A0A0A !important}
  .rrow .model{color:#5a5a5a !important}
  .bar{background:#e6e6e6 !important}
  .rrow .kv{color:#0A0A0A !important}
  .rrow .kv small{color:#8a8a8a !important}
  /* vigilância · anel (.arc) segue o gradiente crimson→magenta; só o trilho fica claro */
  .vig-top{background:#fafafa !important;border:1px solid #e6e6e6 !important}
  .ring .trk{stroke:#e6e6e6 !important}
  .ring .ctr .l{color:#8a8a8a !important}
  .indic .it{color:#111 !important}
  .indic .it b{color:#0A0A0A !important}
  .anchor{color:#FF2D4B !important}            /* frase-âncora em crimson (é acento) */
  /* etiquetas · o skew e a cor sao a assinatura, sobrevivem ao papel */
  .tag.solid{background:#E01E37 !important;color:#fff !important;border-color:#E01E37 !important}
  .tag.good{color:#1c7a45 !important;background:#e8f5ee !important;border-color:#a9d6bd !important}
  .tag.warn{color:#b5541c !important;background:#fbeee6 !important;border-color:#e2c3ae !important}
  .tag.ghost{color:#5a5a5a !important;background:#f1f1f1 !important;border-color:#d8d8d8 !important}
  .acard{background:#fafafa !important;border:1px solid #e6e6e6 !important}
  .acard .aq{color:#0A0A0A !important}
  .acard .at{color:#5a5a5a !important}
  /* comportamento · barra do score (.gbar>i) e o numero (.gn .grad) seguem crimson */
  .gauge{background:#fafafa !important;border:1px solid #e6e6e6 !important}
  .gauge .gl{color:#8a8a8a !important}
  .gauge .gbar{background:#e6e6e6 !important}
  .col h3{color:#8a8a8a !important}             /* .col.attn h3 segue crimson (nao sobrescrito) */
  .crow{border:0 !important;border-bottom:1px solid #ededed !important;border-radius:0 !important;background:none !important}
  .crow .cp{color:#0A0A0A !important}
  .cs.good{color:#1c7a45 !important;background:#e8f5ee !important}
  .cs.mid{color:#0A0A0A !important;background:#f1f1f1 !important}
  .cs.warn{color:#b5541c !important;background:#fbeee6 !important}
  .crow .cx{color:#5a5a5a !important}
  /* rodapé · "Dados." (.grad) segue crimson; resto escuro */

<script src="dados-exemplo.js"></script>
<script>
function __boot(){
  var D = window.RC_DADOS || {};
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- helpers ----------
  function nf(n){ return Number(n).toLocaleString('pt-BR'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(id){ return document.getElementById(id); }
  // callout de insight · "o que isso diz" (régua bordô à esquerda, discreto)
  function insightHtml(texto){
    return '<div class="callout insight reveal"><span class="bolt"></span><div>'+
           '<span class="ck">O que isso diz</span><span class="ct">'+esc(texto)+'</span></div></div>';
  }
  // junta placas em linguagem natural: "A", "A e B", "A, B e C"
  function joinNat(arr){
    if(arr.length<=1) return arr.join('');
    if(arr.length===2) return arr[0]+' e '+arr[1];
    return arr.slice(0,-1).join(', ')+' e '+arr[arr.length-1];
  }

  // setas de evolucao vs mes anterior (so com D.anterior)
  var ANT = D.anterior || null; // mes anterior (setas de evolucao)
  function deltaChip(atual, ant, modo){
    if(!ANT || ant==null || !isFinite(ant) || ant===0) return '';
    var p = Math.round((atual/ant - 1) * 100);
    var rot = ANT.periodo ? ' vs ' + ANT.periodo.toLowerCase() : ' vs mês anterior';
    if(p===0) return '<span class="dlt neu">= '+rot.trim()+'</span>';
    var sobe = p>0;
    var cls = modo==='neutro' ? 'neu' : ((modo==='sobe-bom')===sobe ? 'good' : 'bad');
    return '<span class="dlt '+cls+'">'+(sobe?'\u2191':'\u2193')+' '+Math.abs(p)+'%'+rot+'</span>';
  }

  var instant = false;
  function countUp(node, alvo, opt){
    if(alvo==null || !isFinite(alvo)){ node.textContent='—'; return; } // sem dado ainda = travessão, nunca "null"
    opt = opt||{}; var dur=opt.dur||1100, dec=opt.dec||0, suf=opt.suf||'', pre=opt.pre||'';
    function render(v){ node.textContent = pre + v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + suf; }
    if(reduce || instant){ render(alvo); return; }
    var t0 = performance.now();
    (function tick(t){
      var p = Math.min(1,(t-t0)/dur), val = alvo*(1-Math.pow(1-p,3));
      render(dec ? Math.round(val*Math.pow(10,dec))/Math.pow(10,dec) : Math.round(val));
      if(p<1) requestAnimationFrame(tick); else render(alvo);
    })(performance.now());
  }

  var pending = [];
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(ents){
    ents.forEach(function(e){ if(!e.isIntersecting) return; e.target.classList.add('in'); if(e.target._ov) e.target._ov(); io.unobserve(e.target); });
  },{threshold:.16}) : null;
  function watch(node, onview){
    if(!node) return;
    if(io && !reduce){ var rec={node:node,onview:onview}; pending.push(rec);
      node._ov = function(){ pending = pending.filter(function(r){return r!==rec;}); if(onview) onview(); };
      io.observe(node);
    } else { node.classList.add('in'); if(onview) onview(); }
  }
  function finalizeAll(){ instant=true; pending.slice().forEach(function(r){ if(io) io.unobserve(r.node); r.node.classList.add('in'); if(r.onview) r.onview(); }); pending=[]; }
  window.addEventListener('beforeprint', finalizeAll);

  // índice de veículos + comportamento + média
  var veiculos = (D.veiculos||[]).slice();
  var mediaKm = veiculos.length ? veiculos.reduce(function(s,v){return s+v.km;},0)/veiculos.length : 0;
  function compFor(placa){
    var c=D.comportamento||{}; var all=(c.piores||[]).concat(c.melhores||[]);
    for(var i=0;i<all.length;i++){ if(all[i].placa===placa) return all[i]; } return null;
  }

  // seções realmente presentes → nav e numeração dos cabeçalhos saem da MESMA lista (nunca divergem)
  var _cmp=D.comportamento||{};
  var temComp = !!D.comportamento && (_cmp.score_frota!=null || (_cmp.piores||[]).length || (_cmp.melhores||[]).length);
  var temPlano = !!((_cmp.piores||[]).length || veiculos.some(function(v){return v.ocioso;}) ||
    ((D.vigilancia&&D.vigilancia.saude&&D.vigilancia.saude.bateria_fraca)||[]).length || D.economia ||
    (D.manutencao&&D.manutencao.length));
  var temBench = !!(D.benchmark && D.benchmark.metricas && D.benchmark.metricas.length);
  var SECS=[];
  if(D.resumo) SECS.push(['resumo','Resumo']);
  if(veiculos.length) SECS.push(['movimento','Movimento']);
  if(temBench) SECS.push(['benchmark','Mercado']);
  if(D.vigilancia) SECS.push(['vigilancia','Vigilância']);
  if(temComp) SECS.push(['comportamento','Comportamento']);
  if(D.economia) SECS.push(['economia','Economia']);
  if(temPlano) SECS.push(['plano','Plano']);
  var SECNUM={}; SECS.forEach(function(s,i){ SECNUM[s[0]]='0'+(i+1); });

  // ---------- Header ----------
  if(D.amostra){ var b=el('hdBadge'); if(b) b.hidden=false; }
  var cli = el('hdClient');
  if(cli){ cli.textContent = D.cliente || 'Sua frota'; }
  var meta = el('hdMeta');
  if(meta){ meta.innerHTML = '<span>Relatório executivo</span><span>'+(D.frota||0)+' veículos</span><span>'+esc(D.periodo)+'</span>'; }

  // ---------- Nav de segmentos + scrollspy ----------
  (function(){
    var items=SECS;
    var nav=el('segNav'); if(!nav || !items.length) return;
    nav.innerHTML = items.map(function(it,i){ return '<a href="#'+it[0]+'" data-t="'+it[0]+'"><span class="n">0'+(i+1)+'</span>'+it[1]+'</a>'; }).join('');
    var links={}; Array.prototype.forEach.call(nav.querySelectorAll('a'),function(a){ links[a.getAttribute('data-t')]=a; });
    function setActive(id){ items.forEach(function(it){ links[it[0]].classList.toggle('active', it[0]===id); }); }
    setActive(items[0][0]);
    if('IntersectionObserver' in window){
      var spy=new IntersectionObserver(function(ents){
        ents.forEach(function(e){ if(e.isIntersecting) setActive(e.target.id); });
      },{rootMargin:'-45% 0px -50% 0px',threshold:0});
      items.forEach(function(it){ var s=el(it[0]); if(s) spy.observe(s); });
    }
  })();

  // ---------- Bloco 1 · Resumo ----------
  (function(){
    var r=D.resumo; if(!r) return;
    var mes=(D.periodo||'').split('·')[0].trim();
    var h=''+
      '<div class="block-head reveal"><span class="eyebrow">'+SECNUM['resumo']+' · Resumo do mês</span>'+
        '<h2>O panorama de '+esc(mes)+'</h2>'+
        '<p class="sub">O essencial primeiro · o detalhe está nas seções a seguir.</p></div>'+
      '<div class="hero-stat reveal"><span class="big grad" id="hzKm">0</span>'+
        '<span class="cap"><span class="u">km rodados no mês '+deltaChip(r.km_mes, ANT&&ANT.km_mes, 'neutro')+'</span><span class="lbl">frota sob monitoramento contínuo</span></span></div>'+
      '<div class="substats reveal">'+
        '<div class="s"><div class="n mono" id="hzA">0</div><div class="l">Frota ativa</div></div>'+
        '<div class="s"><div class="n mono" id="hzH">0</div><div class="l">Horas em operação '+deltaChip(r.horas_operacao, ANT&&ANT.horas_operacao, 'neutro')+'</div></div>'+
        '<div class="s"><div class="n mono" id="hzD">0</div><div class="l">Disponibilidade</div></div>'+
      '</div>'+
      '<p class="narrativa reveal">'+esc(r.narrativa)+'</p>';
    if(r.destaque){ h+=insightHtml(r.destaque); }
    var sec=el('resumo'); sec.innerHTML=h;
    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });
    watch(sec.querySelector('.hero-stat'), function(){ countUp(el('hzKm'), r.km_mes, {dur:1300}); });
    watch(sec.querySelector('.substats'), function(){
      countUp(el('hzA'), r.frota_ativa); countUp(el('hzH'), r.horas_operacao);
      countUp(el('hzD'), r.disponibilidade_pct, {dec:1, suf:'%'});
    });
  })();

  // ---------- Bloco 2 · Frota em movimento ----------
  var mv = { metric:'km', filter:'todos', expanded:false };
  function isFimDeSemana(ds){ var d=new Date(ds).getUTCDay(); return d===0||d===6; }
  // gráfico de km por dia · SVG desenhado à mão (barras), respeita claro/escuro/print via CSS
  function kmChartHtml(){
    var arr=(D.km_diario||[]); if(!arr.length) return '';
    var max=arr.reduce(function(m,x){ return Math.max(m,x.km||0); },0); if(max<=0) return '';
    var peakIdx=0; arr.forEach(function(x,i){ if((x.km||0)>(arr[peakIdx].km||0)) peakIdx=i; });
    var peak=arr[peakIdx];
    var n=arr.length, H=44, base=H-1, topPad=3, bw=0.66;
    function yOf(v){ return base-((v||0)/max)*(base-topPad); }
    var bars=arr.map(function(x,i){
      var alt=Math.max(0.7,((x.km||0)/max)*(base-topPad));
      var cls='kmbar'+(isFimDeSemana(x.d)?' we':'')+(i===peakIdx?' pk':'');
      return '<rect class="'+cls+'" x="'+(i+(1-bw)/2).toFixed(3)+'" y="'+(base-alt).toFixed(2)+'" width="'+bw+'" height="'+alt.toFixed(2)+'"></rect>';
    }).join('');
    // régua horizontal · passo "bonito" (múltiplo de 1/2/5 × 10^k) calculado do próprio dado
    var pow=Math.pow(10,Math.floor(Math.log10(max))), f=max/pow;
    var step=(f>=2.5?pow:(f>=1.2?pow/2:pow/5));
    var grid='', scale='';
    for(var g=step; g<max; g+=step){
      var yy=yOf(g).toFixed(2);
      grid+='<line class="kmgrid" x1="0" y1="'+yy+'" x2="'+n+'" y2="'+yy+'" vector-effect="non-scaling-stroke"></line>';
      scale+='<span class="km-scale" style="top:'+((yOf(g)/H)*100).toFixed(2)+'%">'+nf(g)+'</span>';
    }
    // eixo de dias visível · rótulos 1,5,10,15,20,25 e o último dia
    var marcos={1:1,5:1,10:1,15:1,20:1,25:1};
    var axis=arr.map(function(x,i){
      var dn=parseInt((x.d||'').split('-')[2],10);
      if(!(marcos[dn]||i===n-1)) return '';
      return '<span style="left:'+(((i+0.5)/n)*100).toFixed(2)+'%">'+dn+'</span>';
    }).join('');
    var p=(peak.d||'').split('-'); var pkTxt=(p[2]||'')+'/'+(p[1]||'');
    var peakLeft=(((peakIdx+0.5)/n)*100).toFixed(2);
    // frase-conclusão derivada do próprio km_diario (nada fixo)
    var uteis=arr.filter(function(x){ return !isFimDeSemana(x.d); });
    var fds=arr.filter(function(x){ return isFimDeSemana(x.d); });
    var medUtil=uteis.length?Math.round(uteis.reduce(function(s,x){return s+(x.km||0);},0)/uteis.length):0;
    var medFds=fds.length?Math.round(fds.reduce(function(s,x){return s+(x.km||0);},0)/fds.length):0;
    var fdsFrase='';
    if(fds.length){ var rr=medUtil?medFds/medUtil:0;
      fdsFrase = rr<0.30 ? ' · fins de semana quase parados'
        : rr<0.70 ? ' · fins de semana em ritmo menor'
        : ' · fins de semana também rodando forte'; }
    var conc='Média de '+nf(medUtil)+' km por dia útil · pico de '+nf(peak.km)+' km em '+pkTxt+fdsFrase+'.';
    return '<div class="kmwrap reveal">'+
      '<div class="km-cap">Quanto sua frota rodou por dia</div>'+
      '<div class="kmchart">'+
        '<span class="km-peak" style="left:'+peakLeft+'%"><b>'+nf(peak.km)+' km</b>'+pkTxt+'</span>'+
        '<div class="kmplot">'+
          '<svg viewBox="0 0 '+n+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Quilômetros rodados pela frota em cada dia do mês">'+
            grid+
            '<line class="kmbase" x1="0" y1="'+base+'" x2="'+n+'" y2="'+base+'" vector-effect="non-scaling-stroke"></line>'+bars+'</svg>'+
          scale+
          '<span class="km-tip" id="kmTip"></span>'+
        '</div>'+
      '</div>'+
      '<div class="km-axis">'+axis+'</div>'+
      '<div class="km-leg"><span class="lg"><span class="km-sw wk"></span>dias úteis</span>'+
        '<span class="lg"><span class="km-sw we"></span>fins de semana</span>'+
        '<span class="lg"><span class="km-sw pk"></span>dia de pico</span></div>'+
      '<span class="km-hint scr">passe o mouse ou toque numa barra para ver o dia</span>'+
      insightHtml(conc)+
    '</div>';
  }
  // utilização por veículo · esqueleto; as linhas entram por renderUtil (colapsa em 5, expande como o ranking)
  var util = { expanded:false };
  function utilDias(u,pv){ return (pv.dias_rodados!=null)?pv.dias_rodados:(pv.mapa||[]).reduce(function(s,v){ return s+(v?1:0); },0); }
  function utilOrdenada(u){ return u.por_placa.slice().sort(function(a,b){ return utilDias(u,a)-utilDias(u,b); }); } // menos rodado primeiro
  function utilRowHtml(u,pv,nd){
    var dr=utilDias(u,pv), pct=Math.round(dr/nd*100), low=dr<nd*0.5;
    var cells=(pv.mapa||[]).map(function(v,i){
      return '<span class="ucell'+(v?' on':'')+'" title="'+esc(u.dias[i]||'')+(v?' · rodou':' · parado')+'"></span>';
    }).join('');
    return '<div class="urow">'+
      '<div class="uhead"><span class="uplate">'+esc(pv.placa)+'</span>'+
        '<span class="udias"><b>'+dr+'</b> de '+nd+' dias</span>'+
        (low?'<span class="tag warn usub">Subutilizado</span>':'')+'</div>'+
      '<div class="ubar"><i class="'+(low?'low':'')+'" style="width:'+Math.max(4,pct)+'%"></i></div>'+
      '<div class="udots">'+cells+'</div>'+
    '</div>';
  }
  function utilGridHtml(){
    var u=D.utilizacao; if(!u||!u.dias||!u.dias.length||!u.por_placa||!u.por_placa.length) return '';
    var nd=u.dias.length;
    // conclusão considera a frota INTEIRA, não só as 5 mostradas
    var sub=u.por_placa.filter(function(pv){ return utilDias(u,pv)<nd*0.5; }).length;
    var conc = sub===0
      ? 'Todos os veículos rodaram mais da metade dos dias · a frota está bem aproveitada.'
      : (sub+' '+(sub===1?'veículo rodou':'veículos rodaram')+' menos da metade dos dias · veículo parado é custo fixo sem retorno.');
    return '<div class="utilwrap reveal">'+
      '<div class="km-cap">Quantos dias cada veículo rodou</div>'+
      '<p class="km-sub">Do menos rodado ao mais rodado · os que menos giraram aparecem primeiro.</p>'+
      '<div id="utilRows"></div>'+
      '<div id="utilMoreWrap"></div>'+
      '<div class="km-leg"><span class="ucell on ulg"></span>quadrado aceso = rodou no dia<span class="ucell ulg"></span>vazio = parado</div>'+
      insightHtml(conc)+
    '</div>';
  }
  // manutenção preventiva por marco de odômetro · lembrete de agenda, nunca diagnóstico mecânico
  function mntHtml(){
    var m=(D.manutencao||[]); if(!m.length) return '';
    return '<div class="mnt-wrap reveal">'+
      '<p class="alerts-cap">Revisão preventiva · pela quilometragem</p>'+
      '<div class="alerts">'+m.map(function(x){
        return '<div class="acard"><div class="aq mono">'+esc(x.placa)+'</div>'+
          '<div class="at">passou dos '+nf(x.marco)+' km neste mês · programe a revisão</div>'+
          '<div class="at mnt-odo">Odômetro · '+nf(x.odometro)+' km</div></div>';
      }).join('')+'</div>'+
      '<p class="note reveal mnt-note">Premissa · marco de revisão a cada 10.000 km. É um lembrete de agenda, não um diagnóstico mecânico.</p>'+
    '</div>';
  }
  (function(){
    if(!veiculos.length) return;
    var top1 = veiculos.slice().sort(function(a,b){return b.km-a.km;})[0];
    var idle = veiculos.filter(function(v){return v.ocioso;});
    var idlePlacas = idle.map(function(v){return v.placa;});
    var insMov = idle.length
      ? (idle.length+' '+(idle.length===1?'veículo rodou':'veículos rodaram')+' bem abaixo da frota este mês ('+joinNat(idlePlacas)+') · reavaliar a escala pode liberar capacidade sem aumentar a frota.')
      : 'Toda a frota rodou dentro do esperado este mês · nenhum veículo ficou subutilizado.';
    var h=''+
      '<div class="block-head reveal"><span class="eyebrow">'+SECNUM['movimento']+' · Frota em movimento</span>'+
        '<h2>Quem mais trabalhou no mês</h2>'+
        '<p class="sub scr">Toque num veículo para ver a ficha completa.</p></div>'+
      '<div class="hero-stat reveal"><span class="big grad">'+esc(top1.placa)+'</span>'+
        '<span class="cap"><span class="u">'+esc(top1.modelo)+'</span><span class="lbl">o mais rodado · '+nf(top1.km)+' km</span></span></div>'+
      '<div class="controls reveal">'+
        '<div class="segset" id="mvMetric" role="group" aria-label="Métrica do ranking">'+
          '<button data-m="km" aria-pressed="true">Km</button><button data-m="horas" aria-pressed="false">Horas</button></div>'+
        '<div class="segset" id="mvFilter" role="group" aria-label="Filtro de veículos">'+
          '<button data-f="todos" aria-pressed="true">Todos</button><button data-f="ociosos" aria-pressed="false">Só ociosos</button></div>'+
        '<span class="rank-hint">toque numa linha para a ficha</span>'+
      '</div>'+

    function renderRank(){
      var arr=veiculos.slice();
      if(mv.filter==='ociosos') arr=arr.filter(function(v){return v.ocioso;});

      rank.innerHTML = shown.map(function(v,i){

        mw.innerHTML='<button class="more" id="mvMore">Ver todos os '+arr.length+' veículos · expandir</button>';
        el('mvMore').addEventListener('click',function(){ mv.expanded=true; renderRank(); });

    // ---------- Km por dia · tooltip por barra (hover no desktop + toque no mobile, sem sequestrar a rolagem) ----------
    (function(){
      var chart=sec.querySelector('.kmchart'); if(!chart) return;
      var svg=chart.querySelector('svg'), tip=el('kmTip'), arr=(D.km_diario||[]), n=arr.length;
      if(!svg||!tip||!n) return;
      var kmMax=arr.reduce(function(m,x){ return Math.max(m,x.km||0); },0)||1;
      function fmtD(d){ var pp=(d||'').split('-'); return (pp[2]||'')+'/'+(pp[1]||''); }
      function show(clientX){
        var r=svg.getBoundingClientRect(); if(!r.width) return;
        var idx=Math.floor(((clientX-r.left)/r.width)*n);
        if(idx<0) idx=0; if(idx>=n) idx=n-1;
        var x=arr[idx]; if(!x) return;
        tip.innerHTML='<b>'+fmtD(x.d)+'</b> · '+nf(x.km||0)+' km';
        tip.style.left=(((idx+0.5)/n)*100).toFixed(2)+'%';
        // aparece logo acima do TOPO da barra do dia (perto de onde o olho está), não num topo fixo
        var H=44, base=H-1, topPad=3, yTop=base-((x.km||0)/kmMax)*(base-topPad);
        tip.style.top=((yTop/H)*100).toFixed(2)+'%';
        tip.classList.add('on');
      }
      function hide(){ tip.classList.remove('on'); }
      svg.addEventListener('pointermove',function(e){ show(e.clientX); });
      svg.addEventListener('pointerover',function(e){ show(e.clientX); }); // entrar parado (ex.: rolagem de trackpad) também mostra
      svg.addEventListener('pointerleave',hide);
      svg.addEventListener('pointerdown',function(e){ show(e.clientX); }); // toque: não damos preventDefault, então a rolagem segue livre
      document.addEventListener('pointerdown',function(e){ if(!chart.contains(e.target)) hide(); });
    })();

    el('mvMetric').addEventListener('click',function(e){ var btn=e.target.closest('button'); if(!btn) return;

    el('mvFilter').addEventListener('click',function(e){ var btn=e.target.closest('button'); if(!btn) return;

    el('mvRank').addEventListener('click',function(e){ var row=e.target.closest('.rrow'); if(row) openDetail(row.getAttribute('data-placa')); });
    el('mvRank').addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ var row=e.target.closest('.rrow'); if(row){ e.preventDefault(); openDetail(row.getAttribute('data-placa')); } } });

    function applyMvBtns(){
      Array.prototype.forEach.call(el('mvMetric').children,function(c){ c.setAttribute('aria-pressed', c.getAttribute('data-m')===mv.metric?'true':'false'); });
      Array.prototype.forEach.call(el('mvFilter').children,function(c){ c.setAttribute('aria-pressed', c.getAttribute('data-f')===mv.filter?'true':'false'); });
    }
    // impressão: mostra os 14 (km, todos) e expande a utilização inteira; restaura o estado web depois
    var mvPrev=null, utilPrev=null;
    window.addEventListener('beforeprint',function(){ mvPrev={m:mv.metric,f:mv.filter,e:mv.expanded}; mv.metric='km'; mv.filter='todos'; mv.expanded=true; applyMvBtns(); renderRank();
      utilPrev=util.expanded; util.expanded=true; renderUtil(); });
    window.addEventListener('afterprint',function(){ if(mvPrev){ mv.metric=mvPrev.m; mv.filter=mvPrev.f; mv.expanded=mvPrev.e; mvPrev=null; applyMvBtns(); renderRank(); }
      if(utilPrev!=null){ util.expanded=utilPrev; utilPrev=null; renderUtil(); } });

  })();

    sec.innerHTML='<div class="block-head reveal"><span class="eyebrow">'+SECNUM['benchmark']+' · Sua frota vs o mercado</span>'+

  // ---------- Bloco 3 · Vigilância ativa ----------
  // mapa de calor de alertas · o robô manda a matriz 7×24 (linha 0 = segunda); o front agrega em 4 períodos
  function heatAlertasHtml(ha){
    var M=ha&&ha.matriz; if(!M||!M.length||!ha.total) return '';
    var dias=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    var diasFull=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
    var periodos=[['Madrugada','0h às 6h',0,6],['Manhã','6h às 12h',6,12],['Tarde','12h às 18h',12,18],['Noite','18h às 24h',18,24]];
    // agrega as 24 horas de cada dia nos 4 períodos
    var grid=M.map(function(lin){ lin=lin||[];
      return periodos.map(function(p){ var s=0; for(var h=p[2];h<p[3];h++){ s+=(lin[h]||0); } return s; });
    });
    var max=0, mi=0, mj=0;
    for(var i=0;i<grid.length;i++){ for(var j=0;j<grid[i].length;j++){ if(grid[i][j]>max){ max=grid[i][j]; mi=i; mj=j; } } }
    if(max<=0) return '';
    var head='<div class="hm-corner"></div>'+periodos.map(function(p){
      return '<div class="hm-ph">'+p[0]+'<small>'+p[1]+'</small></div>'; }).join('');
    var corpo='';
    for(var d=0;d<grid.length;d++){
      corpo+='<div class="hm-day">'+(dias[d]||('D'+d))+'</div>';
      for(var k=0;k<4;k++){
        var val=grid[d][k];
        if(val<=0){ corpo+='<div class="hm-cell z" title="'+(dias[d]||'')+' · '+periodos[k][0]+' · 0 alertas">·</div>'; }
        else { var op=(0.14+0.5*(val/max)).toFixed(2);
          corpo+='<div class="hm-cell" style="background:rgba(255,45,75,'+op+')" title="'+(dias[d]||'')+' · '+periodos[k][0]+' · '+val+' alertas">'+val+'</div>'; }
      }
    }
    var read='Seu risco se concentra na '+periodos[mj][0].toLowerCase()+' de '+diasFull[mi]+' · é quando vale reforçar a atenção.';
    return '<p class="alerts-cap reveal">Quando os alertas acontecem · por período do dia</p>'+
      '<div class="hm-wrap reveal"><div class="hmgrid">'+head+corpo+'</div>'+
        '<div class="hm-leg"><span>menos</span><span class="hm-ramp"></span><span>mais</span></div></div>'+
      insightHtml(read);
  }
  (function(){
    var v=D.vigilancia; if(!v) return;
    var R=68, C=2*Math.PI*R, pct=v.cobertura_pct||0;
    var pctTxt=v.cobertura_pct==null ? '—'
      : Number(pct).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';

        '<div class="indics">'+

        '<div class="alerts reveal">'+
          '<div class="acard"><div class="aq mono">'+sd2.comunicando+'/'+sd2.comunicando_total+'</div><div class="at">Rastreadores comunicando</div></div>'+
          '<div class="acard"><div class="aq mono">'+bf.length+'</div><div class="at">Bateria de veículo fraca</div>'+
            (bf.length?'<div class="at" style="margin-top:6px;font-family:var(--mono);color:var(--crimson)">'+
              bf.map(function(x){ return esc(x.placa)+' · '+String(x.volts).replace('.',',')+' V'; }).join(' · ')+'</div>':'')+'</div>'+
          '<div class="acard"><div class="aq mono">'+(sd2.violacoes||0)+'</div><div class="at">Violações de equipamento</div></div>'+
        '</div>'+
        '<p class="note reveal" style="margin-top:12px">A tensão é da bateria do próprio veículo, medida pelo rastreador · bateria caindo é aviso antes da pane, não depois.</p>';
    }
    h+=heatAlertasHtml(D.heat_alertas);
    var sec=el('vigilancia'); sec.innerHTML=h;
    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });
    var arc=el('rzArc'), top=sec.querySelector('.vig-top');
    watch(top,function(){ var off=C*(1-pct/100);
      if(reduce||instant){ arc.style.transition='none'; arc.style.strokeDashoffset=off; return; }
      arc.style.transition='stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)';
      requestAnimationFrame(function(){ arc.style.strokeDashoffset=off; });
    });
  })();

  // ---------- Bloco 5 · Economia operacional (estimativa com premissa) ----------
  // Regra de honestidade: horas ociosas e eventos sao MEDIDOS; o R$ e SEMPRE
  // estimativa com premissas explicitas. Nunca prometer medicao de combustivel.
  (function(){
    var ec=D.economia; if(!ec) return;
    var litros=Math.round(ec.horas_ociosas_mes*ec.premissa_litros_hora);
    var reais=litros*ec.premissa_preco_litro;
    var reaisTxt='R$ '+reais.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
    var insEc='Reduzir o motor parado em um terço devolve na ordem de R$ '+
      Math.round(reais/3).toLocaleString('pt-BR')+' por mês · a conversa certa com a equipe paga o monitoramento sozinha.';
    var h=''+
      '<div class="block-head reveal"><span class="eyebrow">'+SECNUM['economia']+' · Economia operacional</span>'+
        '<h2>Economia e gastos da operação</h2>'+
        '<p class="sub">Motor ligado sem rodar é o custo mais fácil de recuperar.</p></div>'+
      '<div class="hero-stat reveal"><span class="big grad" id="ecR">0</span>'+
        '<span class="cap"><span class="u">custo estimado do tempo ocioso no mês</span>'+
        '<span class="lbl">estimativa sobre horas medidas · premissas abaixo</span></span></div>'+
      '<div class="substats reveal">'+
        '<div class="s"><div class="n mono" id="ecH">0</div><div class="l">Horas de motor parado · medido '+deltaChip(ec.horas_ociosas_mes, ANT&&ANT.horas_ociosas_mes, 'desce-bom')+'</div></div>'+
        '<div class="s"><div class="n mono" id="ecL">0</div><div class="l">Litros estimados em marcha lenta</div></div>'+
        '<div class="s"><div class="n mono" id="ecV">0</div><div class="l">Eventos de velocidade · medido</div></div>'+
      '</div>'+
      (function(){
        if(!ec.por_veiculo||!ec.por_veiculo.length) return '';
        return '<p class="alerts-cap reveal">Quem mais queima parado · custo estimado no mês</p>'+
          '<div class="alerts reveal">'+ec.por_veiculo.map(function(x){
            var r=Math.round(x.horas*ec.premissa_litros_hora*ec.premissa_preco_litro);
            return '<div class="acard"><div class="aq mono">R$ '+r.toLocaleString('pt-BR')+'</div>'+
                   '<div class="at">'+esc(x.placa)+' · '+nf(x.horas)+' h de motor parado</div></div>';
          }).join('')+'</div>';
      })()+
      (function(){
        var sub=(D.veiculos||[]).filter(function(v){ return v.ocioso; });
        if(!sub.length) return '';
        return '<p class="note reveal" style="margin-top:14px">E os que quase não rodaram: '+
          joinNat(sub.map(function(v){ return esc(v.placa)+' ('+nf(v.km)+' km)'; }))+
          ' · ativo parado segue custando seguro, documento e depreciação.</p>';
      })()+
      '<p class="note reveal" style="margin-top:14px">Como calculamos: '+nf(ec.horas_ociosas_mes)+' h de motor ligado parado (medidas pelo rastreador) × '+
        String(ec.premissa_litros_hora).replace('.',',')+' L/h de marcha lenta × R$ '+
        ec.premissa_preco_litro.toLocaleString('pt-BR',{minimumFractionDigits:2})+' por litro. '+
        'O valor em reais é estimativa · a Rastcar não mede o tanque.</p>'+
      insightHtml(insEc);
    var sec=el('economia'); sec.innerHTML=h;
    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });
    watch(sec.querySelector('.hero-stat'),function(){
      countUp(el('ecR'), reais, {pre:'R$ '});
      countUp(el('ecH'), ec.horas_ociosas_mes);
      countUp(el('ecL'), litros);
      countUp(el('ecV'), ec.eventos_velocidade);
