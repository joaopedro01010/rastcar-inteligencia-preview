<style>
:root{
  /* ESCURO NO CINZA DO PHANTOM. Medi duas vezes e a primeira estava errada.
     Na primeira eu amostrei por FAIXA DE ALTURA e misturei o fundo escurecido
     que fica ATRAS da folha (#010101, so o overlay) com a folha da frente.
     Peguei #0F0F0F de fundo, que e a base da folha, e a pagina ficou escura
     demais. Medindo por SUPERFICIE, dentro da folha, em 4 telas:

         #0F0F0F  40,0% dos pixels   base da folha
         #1C1C1C  31,3%              O CARTAO, e o que o olho de fato ve
         #282828   0,4%              unica superficie acima dele

     O usuario do Phantom passa a vida olhando #1C1C1C, nao #0F0F0F. Entao o
     fundo da pagina e #1C1C1C e o cartao sobe pra #282828. Conferido: tinta
     14,57:1, verde 10,83:1, vermelho 4,08:1, tudo acima do piso.
     O que estava aqui antes de tudo era #080608, quase preto e ARROXEADO. */
  --bg:#1C1C1C;
  --bg2:#1F1F1F;
  --panel:#282828;
  --panel-b:rgba(255,255,255,.06);
  --bordo:#4A0010;
  --crimson:#EC1222;
  --crimson-2:#DC1021;
  --magenta:#D1B0D7;
  --ice:#5FE0FF;
  --offwhite:#F8F4EE;
  --ink:#F3ECE6;
  /* O vermelho da marca (#EC1222) e cor de PREENCHIMENTO. Como texto sobre o
     cinza do painel ele rende 3,79:1, contra 4,5 exigidos. O tema claro ja
     tinha esse par (#EC1222 pinta, #B80D1A escreve); o escuro nao tinha, e por
     isso eyebrow, numero da navegacao e "o que isso diz" reprovavam. */
  /* #FF4E58 rende 5,03:1 sobre o painel, mas cai a 3,69:1 quando o texto mora
     numa superficie mais clara que o painel, como o bloco de comparacao. No
     tema escuro clarear e seguro em toda parte, porque o fundo e sempre mais
     escuro que a letra: o pior caso manda, e ele pede este tom. */
  --crimson-txt:#FF7A82;
  --muted:#A79CA2;
  --muted-2:#9C939A;   /* subiu de #9b9096/#8D848B: no tamanho de rotulo eles
                          davam 3,7:1 sobre o cinza do painel, nao 4,5:1 */
  --hair:rgba(255,255,255,.08);
  --glow:none;
  /* INTER com eixo optico · a receita oficial da casa (09/08/2026), a mesma
     dos criativos: `opsz` 32 + peso 900 + tracking -2,5% reproduz a Helvetica
     Now Display. Antes daqui passou D-DIN (engenharia), Archivo (grotesca
     neutra) e Figtree (meu palpite de "fonte do Instagram"), e a receita certa
     ja estava escrita no repo o tempo todo.
     Roboto Mono FICA nos rotulos tecnicos: la o mono e sinal de dado. */
  --head:'Inter',system-ui,sans-serif;
  --title:'Inter',system-ui,sans-serif;
  /* A MONO SAI DOS ROTULOS. Eu tinha defendido Roboto Mono em caixa alta a
     10,5px como "sinal de dado"; o Joao apontou e ele esta certo: mono em
     caixa alta com tracking largo, repetida em centenas de rotulos, e o visual
     que envelheceu mal. Quem faz produto de dado hoje (Stripe, Linear) usa a
     mesma grotesca do resto em peso medio e tamanho pequeno.
     `--mono` continua existindo para PLACA e numero de serie, onde largura
     fixa e funcional de verdade. */
  --mono:'Inter',system-ui,sans-serif;
  --placa:'Roboto Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --maxw:1080px;
  --pad:clamp(18px,4vw,44px);
  --nav-h:56px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--head);
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* fundo vivo (rotas GPS) + vinheta */
#bgv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    /* Os dois radiais pintavam vermelho no topo e BORDO no rodape, e o
       linear fechava com o quase-preto antigo. Era daqui que vinha a mancha
       avermelhada que sobrou depois de eu esconder os orbes. O Phantom nao
       tem cor nenhuma no fundo: e cinza neutro chapado, e e isso que faz a
       interface parecer calma. Fica so uma leve profundidade neutra. */
    linear-gradient(180deg, rgba(255,255,255,.014), transparent 40%),
    linear-gradient(180deg, transparent 70%, rgba(0,0,0,.16));
}
.stage{position:relative;z-index:2}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--crimson);font-weight:500;
  display:inline-flex;align-items:center;gap:11px;
}
/* risco antes do eyebrow · mesma assinatura estrutural do site */
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6;flex:0 0 auto}
.seal .eyebrow::before{display:none}
/* GRADIENTE DE TEXTO. O anterior ia de coral a vermelho a MAGENTA, e o mapa de
   cores trocou magenta por lilas #D1B0D7. Medido sobre o fundo claro:

       #FD6D5D coral    2,67:1   reprova
       #EC1222 vermelho 4,30:1   ok
       #D1B0D7 lilas    1,84:1   reprova

   Duas das tres paradas ilegiveis, e era isso que fazia o texto "sumir" nas
   pontas. Gradiente de LETRA exige que TODAS as paradas passem, nao so a do
   meio: a ponta fraca nao fica bonita, fica invisivel.
   O coral foi escurecido preservando o matiz ate cruzar 3,0:1, que e o piso de
   texto grande. Agora: 3,01 / 4,30 / 6,46. */
/* A RECEITA DE DISPLAY. `opsz` 32 fecha as letras e sobe o contraste; sem ele
   a Inter e so mais uma grotesca. Tracking -2,5% e o que a receita manda. */
h1,h2,.big,.dline .v,.hero-stat .big,.tag{
  font-variation-settings:'opsz' 32;letter-spacing:-.025em}
h1,.big,.hero-stat .big{font-weight:900}
h2{font-weight:800}
.dline .v{font-weight:800;letter-spacing:-.02em}
.tag{letter-spacing:.13em;font-variation-settings:'opsz' 14}


/* Todos os rotulos que eram mono passam a Inter 600 com tracking de 5,5%: em
   mono o tracking de 13% era necessario pra letra nao colar; em grotesca ele
   vira espacamento gratuito e o rotulo perde a forma de palavra. */
.dgt,.km-cap,.heat-cap,.alerts-cap,.ctl-label,.bm-l,.hm-leg,.hm-ph,.mono,
.dline .k,.eyebrow,.lbl,.u{
  font-weight:600;letter-spacing:.055em;font-variation-settings:'opsz' 14}
.dgt,.km-cap,.heat-cap,.alerts-cap{font-size:12px}
/* ENCOSTADOS. O detector achou 11 pares com menos de 4px de folga, um deles
   com folga ZERO (uma estatistica colada na legenda de alertas) e seis fichas
   de motorista com nome a 3px da descricao. Texto que encosta em texto le como
   erro de montagem, e o leitor tenta ligar as duas coisas. */
.cp{margin-bottom:7px}
/* O VERDE CLARO SO VALE NO ESCURO. #6BE863 e o verde do Phantom e la ele mede
   12,58:1 sobre preto; sobre o fundo claro desta pagina ele da 1,51:1 e
   desaparece. O `.dot` estava pintado com ele nos dois temas: no claro o ponto
   sumia. Par completo: claro usa #0AA800 (mesmo matiz, 4,71:1). */
body.light .dot,body.light .dot.good,body.light .cs.good,body.light .bbar>i.you.ok{
  color:#0AA800}
body.light .dot{background:#0AA800}
body.light .bbar>i.you.ok{background:linear-gradient(90deg,#0AA800,#4FC247)}

.grad{
  background:linear-gradient(96deg,#EE6657 0%,var(--crimson) 46%,#B80D1A 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
/* A FAIXA DA REFERENCIA, no lugar certo dela. Este e o gradiente do orcamento
   Leve Imersivo, vermelho a coral a azul. Ele reprova em texto (o azul da
   1,84:1) e e perfeito em BARRA, que e como o orcamento o usa: divisor
   colorido, nao letra. */
.faixa-leve{height:3px;border-radius:2px;border:0;margin:0;
  background:linear-gradient(90deg,var(--crimson) 0%,#FF795F 46%,#88BFFF 100%)}

/* ---------- Etiquetas · veredito curto, sempre ancorado num dado real ---------- */
.tag{
  display:inline-block;font-family:var(--head);font-weight:700;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;line-height:1;
  padding:5px 9px 4px;border-radius:3px;border:1px solid transparent;
  transform:skewX(-4deg);white-space:nowrap;vertical-align:middle;
}
.tag.solid{background:linear-gradient(96deg,var(--crimson-2),var(--crimson));color:#fff}
/* AMOSTRA nao e enfase de conteudo, e rotulo de ESTADO: diz que este documento
   e um exemplo. Em vermelho ele competia com a wordmark logo ao lado, e o
   vermelho aqui e a cor de acao. Vai a contorno grafite, formando par com o
   selo DADOS, que tambem e meta. `.tag.solid` continua vermelho porque marca
   conteudo de verdade: "Mais rodado", "Comecar por aqui". */
#hdBadge.tag.solid{background:none;color:var(--muted);border:1px solid currentColor;opacity:.85}
/* O SIMBOLO R ao lado da wordmark. E o R NOVO, `assets/logo-R-rastcar.png`, que
   e regra permanente desde 13/07/2026: o antigo esta aposentado. Vem com
   alt vazio e aria-hidden porque a wordmark ao lado ja diz "Rastcar", e um
   leitor de tela anunciando a marca duas vezes e ruido.
   A altura acompanha a da wordmark pela mesma variavel, entao os dois crescem
   juntos e nunca saem de escala um em relacao ao outro. */
/* PROPORCOES MEDIDAS NO LOCKUP OFICIAL (rastcar-oficial-preta.png, 4000x790,
   o mesmo que o orcamento Leve Imersivo usa):
       altura do R  = 2,189 x a altura da wordmark
       vao          = 0,440 x a altura da wordmark
       alinhamento  = centro vertical (213px acima, 214px abaixo: simetrico)
   Eu tinha composto no olho e saiu 1,57x com vao de 113%: R pequeno demais e
   longe demais. A marca ja tinha a resposta num arquivo. */
/* O `gap:0` que eu tinha posto aqui matou o respiro da LINHA INTEIRA: a
   wordmark encostava em "Inteligencia", que encostava em "Dados". Eu queria
   zerar so o vao entre o R e a wordmark, e o gap do flex vale entre TODOS os
   filhos. A solucao certa e o R sair do fluxo do gap com margem negativa
   igual a ele, ficando com a margem propria que segue a proporcao oficial. */
.seal{gap:15px}
.seal .logo-r{margin-right:calc(var(--wm-h) * 0.545 - 15px)}
/* 1,45 e vao de 0,545, que sao os numeros da LANDING · o Joao aprovou o
   lockup de la ("100% otimas proporcionalmente") e pediu o mesmo aqui.
   De onde saem: na landing uma variavel unica manda na largura da wordmark
   (`--wmw`), o emblema tem 0,201 dessa largura e a wordmark tem proporcao
   8,016 (1018 por 127 de tinta). Entao
       altura do R / altura da wordmark = (0,201 / 1,111) x 8,016 = 1,450
       vao         / altura da wordmark = 0,068 x 8,016            = 0,545
   Aqui a variavel e a ALTURA (`--wm-h`), entao os fatores entram direto.
   Antes eram 1,95 e 0,44, herdados do lockup impresso · na tela o R ficava
   grande demais e colado. */
.logo-r{height:calc(var(--wm-h) * 1.45);width:auto;display:block;
  align-self:center;flex:0 0 auto;margin-right:calc(var(--wm-h) * 0.545)}
@media print{ .logo-r{height:calc(23px * 1.45);margin-right:calc(23px * .545)} }
body.light #hdBadge.tag.solid{color:#5C5761;border-color:rgba(23,18,20,.28);background:rgba(23,18,20,.035)}
.tag.good{color:#6BE863;background:rgba(107,232,99,.12);border-color:rgba(107,232,99,.40)}
.tag.warn{color:#FF9E7A;background:rgba(255,122,77,.13);border-color:rgba(255,122,77,.40)}
.tag.ghost{color:var(--muted);background:rgba(255,255,255,.04);border-color:var(--hair)}
.tag + .tag{margin-left:6px}
.tag[hidden]{display:none}

/* ---------- Header (co-marca provedor + cliente) ---------- */
header.top{padding:34px 0 26px}
header.top .wrap{display:flex;flex-direction:column;gap:14px}
.seal{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
:root{--wm-h:23px}
@media (max-width:640px){ :root{--wm-h:20px} }
.seal img.wm{width:clamp(158px,30vw,184px);height:auto;display:block}
.seal img.wm-print{display:none}
.seal .eyebrow{font-size:11px}

/* ---------- Selo DADOS · a etiqueta da família, em metal (estático, sem ornamento) ---------- */
.seal-dados{
  position:relative;display:inline-flex;align-items:center;vertical-align:middle;line-height:1;
  padding:5px 10px 4px;border-radius:3px;border:1px solid transparent;
  transform:skewX(-4deg);
  background-image:
    linear-gradient(178deg,#33343a 0%,#17181c 44%,#0c0c0f 100%),
    linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.10) 38%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.30) 100%);
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
}
/* um único reflexo · é o que sobra do metal quando se tira o resto */
.seal-dados::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(104deg,transparent 34%,rgba(255,255,255,.13) 47%,transparent 58%);
}
.seal-dados>span{
  position:relative;
  font-family:var(--title);font-weight:700;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;line-height:1;display:block;
  background:linear-gradient(180deg,#ffffff 0%,#d3d7de 48%,#9ca1aa 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.client{
  font-family:var(--title);font-weight:700;text-transform:uppercase;letter-spacing:-.012em;
  font-size:clamp(30px,7.4vw,72px);line-height:.99;margin:12px 0 6px;
  color:var(--offwhite);text-wrap:balance;
}
.hook{
  font-family:var(--head);font-weight:600;letter-spacing:-.01em;
  font-size:clamp(15px,2.4vw,20px);color:var(--ink);margin:0 0 8px;
}
.h-meta{
  font-family:var(--head);font-size:12.5px;color:var(--muted-2);
  display:flex;flex-wrap:wrap;gap:5px 14px;letter-spacing:.02em;
}
.h-meta b{color:var(--ink);font-weight:500}

/* ---------- Nav de segmentos (controle) ---------- */
/* A nav tinha fundo rgba(8,6,8,.72), que era do tema quase-preto anterior:
   sobre o #1C1C1C novo ela virava uma FAIXA PRETA atravessando a pagina. No
   Phantom a barra de secao nao e um bloco de cor, e a mesma superficie com um
   fio de separacao. */
nav.seg{
  background:transparent;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
nav.seg .wrap{display:flex;gap:6px;height:var(--nav-h);align-items:center;overflow-x:auto;scrollbar-width:none}
nav.seg .wrap::-webkit-scrollbar{display:none}
/* A fileira de 9 secoes mede ~1190px e so cabe inteira acima de 1400px de
   janela: em notebook de 1280 o indice saia CORTADO no meio da palavra.
   No desktop ninguem rola barra de indice de lado, entao ela QUEBRA em duas
   linhas quando nao couber. O rolo horizontal continua no celular, onde o
   gesto e natural. Estrutural: vale pra qualquer largura e qualquer
   quantidade de secoes, nao so pras 9 de hoje. */
@media (min-width:820px){
  nav.seg .wrap{flex-wrap:wrap;height:auto;overflow:visible;row-gap:4px;padding-top:13px;padding-bottom:13px}
}
/* ORFAO. Quebrando por flex-wrap as 9 secoes caiam 7 + 2: as duas ultimas
   ficavam soltas numa segunda linha e desequilibravam o bloco. Grid com
   coluna de largura minima distribui as 9 em linhas cheias, e o numero de
   colunas se ajusta sozinho a qualquer largura e a qualquer quantidade de
   secoes. Abaixo de 820px continua o rolo horizontal, que no dedo e natural. */
/* A NAVEGACAO EM DUAS LINHAS CHEIAS.
   Tres tentativas ate acertar, e as duas primeiras ensinam o porque:
     flex-wrap                          caía 7 + 2, com dois orfaos soltos
     grid auto-fit com 1fr              equilibrou em 5 + 4 mas ESTICOU as
                                        colunas ate 1440px, e "05 VIGILANCIA"
                                        foi parar na borda, longe do conteudo
     grid auto-fill com max-content     compactou, mas caiu em 6 + 3
   Deixar o navegador contar dava sempre um numero que nao era o desejado,
   porque os itens tem larguras diferentes (MOVIMENTO contra COMPORTAMENTO).
   Entao a contagem e explicita: 5 colunas dao 5 + 4 e 3 dao 3 + 3 + 3, os
   dois unicos cortes equilibrados de 9. Se um dia o numero de secoes mudar,
   este e o lugar de revisar, e o comentario esta aqui pra isso. */
@media (min-width:820px){
  nav.seg .wrap{display:grid;grid-template-columns:repeat(3,max-content);
    justify-content:start;gap:8px 30px;align-items:stretch}
  nav.seg a{display:flex;align-items:center;justify-content:flex-start}
}
@media (min-width:1120px){
  nav.seg .wrap{grid-template-columns:repeat(5,max-content);gap:8px 26px}
}
/* A secao ativa era uma pilula: fundo vermelho fraco mais borda arredondada.
   Pilula e componente de filtro, nao de indice, e num fundo com gradiente ela
   vira um borrao. O ativo agora se anuncia por tres coisas somadas, nenhuma
   delas caixa: o texto sobe de apagado pra tinta cheia, o numero acende em
   vermelho e uma regua de 2px cresce por baixo.
   O peso da fonte NAO muda entre ativo e inativo de proposito: mudar peso
   muda a largura, e com 9 itens em grade o indice inteiro tremeria a cada
   secao que passa no scroll. */
nav.seg a{
  position:relative;flex:0 0 auto;font-family:var(--head);font-weight:600;font-size:11px;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;padding:7px 14px 9px;
  border:0;border-radius:0;background:none;white-space:nowrap;transition:color .22s ease;
}
nav.seg a::after{
  content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;
  background:var(--crimson);opacity:0;transform:scaleX(0);transform-origin:left center;
  transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .22s ease;
}
nav.seg a:hover{color:var(--ink)}
nav.seg a:hover::after{opacity:.34;transform:scaleX(1)}
nav.seg a.active{color:var(--ink)}
nav.seg a.active::after{opacity:1;transform:scaleX(1)}
nav.seg a:focus-visible{outline:2px solid var(--crimson);outline-offset:3px;border-radius:4px}
nav.seg a .n{font-family:var(--mono);font-weight:500;letter-spacing:.06em;
  color:var(--muted-2);margin-right:7px;transition:color .22s ease}
nav.seg a:hover .n,nav.seg a.active .n{color:var(--crimson)}
@media (prefers-reduced-motion:reduce){ nav.seg a::after{transition:opacity .22s ease} }

/* ---------- Seções ---------- */
main{padding:8px 0 60px}
section.block{padding:56px 0 8px;scroll-margin-top:12px}
/* PISO DE RESPIRO ENTRE BLOCOS IRMAOS.
   A secao e `display:block` sem gap: o espacamento vinha de margem posta peca a
   peca, e quem nascesse sem margem colava na anterior. Foi assim que os 3
   cartoes de resumo grudaram na lista de maquinas (vao medido: 0px) e a lista
   grudou no "ver todos" (0px).
   Vai dentro de `:where()` DE PROPOSITO: especificidade zero, entao qualquer
   regra que ja defina a propria margem continua vencendo. Isto e piso, nao
   decisao de layout, e serve pra peca nova nao nascer colada. */
:where(section.block > * + *){margin-top:20px}
main section.block:empty{display:none}
main section.block + section.block{border-top:1px solid var(--hair)}
.block-head{margin-bottom:26px;max-width:64ch}
.block-head h2{
  font-family:var(--title);font-weight:700;text-transform:uppercase;
  font-size:clamp(25px,4.4vw,46px);letter-spacing:-.008em;
  margin:.28em 0 0;line-height:.99;text-wrap:balance;
}
.block-head .sub{color:var(--muted);font-size:15px;margin-top:8px}

/* dominante: número/insight-herói */
.hero-stat{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  margin:10px 0 6px;padding:22px 24px 20px;border-radius:16px}
.hero-stat .big{
  font-family:var(--title);font-variant-numeric:tabular-nums;
  font-size:clamp(52px,13.6vw,116px);font-weight:700;line-height:.88;letter-spacing:-.022em;
}
.hero-stat .cap{padding-bottom:10px}
.hero-stat .cap .u{font-family:var(--head);font-weight:500;font-size:16px;color:var(--muted);display:block}
.hero-stat .cap .lbl{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);margin-top:4px;
}

/* stats secundários */
.substats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-top:22px}
.substats .s{padding:16px 18px}
.substats .s .n{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:clamp(21px,3.4vw,30px);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.substats .s .l{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2);margin-top:6px}
.narrativa{font-size:clamp(17px,2.5vw,21px);line-height:1.5;color:var(--ink);max-width:60ch;text-wrap:balance;margin:26px 0 0;font-weight:500}
.narrativa b{color:#fff}

/* callout de insight */
.callout{
  margin-top:22px;display:flex;gap:14px;align-items:flex-start;
  background:linear-gradient(100deg, rgba(236,18,34,.10), rgba(236,18,34,.02));
  border:1px solid rgba(236,18,34,.28);border-radius:12px;padding:16px 20px;
}
.callout .bolt{width:8px;align-self:stretch;border-radius:6px;background:linear-gradient(var(--crimson),var(--magenta));box-shadow:var(--glow);flex:0 0 auto}
.callout .ck{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson);display:block;margin-bottom:5px}
.callout .ct{font-size:16px;font-weight:500;line-height:1.4;color:var(--ink)}
/* insight "o que isso diz" · discreto (bg mais suave que o callout base) */
.callout.insight{background:linear-gradient(100deg, rgba(236,18,34,.055), rgba(236,18,34,.012));border-color:rgba(236,18,34,.20);margin-top:24px}
.callout.insight .ct{font-size:15px}
/* margin-top de 16px: esta legenda encostava com folga ZERO na estatistica
   logo acima. Texto colado em texto le como erro de montagem. */
.alerts-cap{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.055em;
  text-transform:uppercase;color:var(--muted-2);margin:16px 0 12px}
.rank-hint{font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted-2);align-self:center;margin-left:2px}

/* ---------- Controles (segmented + toggle) ---------- */
/* margem de cima era 6px e, com o topo agora em cartao, virou encostamento
   visivel entre o cartao e a fileira de filtros. */
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:20px 0 20px}
.segset{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:999px;padding:3px}
.segset button{
  font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.18s;
}
.segset button:hover{color:var(--ink)}
.segset button[aria-pressed="true"]{color:#fff;background:linear-gradient(96deg,var(--crimson-2),var(--crimson))}
.ctl-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}

/* ---------- Ranking ---------- */
.rank{display:flex;flex-direction:column;gap:10px}   /* as 3 maquinas colavam uma na outra */
.rrow{
  /* A COLUNA DO IDENTIFICADOR NAO PODE SER FIXA. Ela era `98px` chumbados, e
     `.plate` nao quebrava nem cortava: com placa de sete caracteres cabia, e
     com nome de maquina - "RE-02 - RETROESCAVADEIRA" pede 159px, "MN-02 -
     MOTONIVELADORA" pede 147 - o texto PINTAVA POR CIMA da barra e do nome
     ao lado. So apareceu na MSG, que e a primeira frota de maquinas com nome
     por extenso; em frota de placa nunca estourou. Medido em 14/09/2026.
     `minmax` deixa a coluna crescer ate um teto e o nome quebrar em duas
     linhas - ninguem perde informacao e nada monta em cima de nada. */
  display:grid;grid-template-columns:minmax(98px,152px) 1fr auto;align-items:center;gap:16px;
  padding:13px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer;
  transition:background .2s,border-color .2s,transform .15s;
}
.rrow:hover,.rrow:focus-visible{background:rgba(236,18,34,.06);border-color:rgba(236,18,34,.22);outline:none}
.rrow:hover .bar>i{filter:brightness(1.25)}
.rrow .plate{font-family:var(--title);font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--ink);
             /* `break-word` e nao `anywhere`: o `anywhere` encolhe a caixa ao
                minimo e parte a palavra mesmo quando ela caberia inteira -
                saiu "RETROESCAVADEIR / A". Com `break-word` a palavra so
                quebra se sozinha nao couber. */
             min-width:0;overflow-wrap:break-word;line-height:1.22}
.rrow .who{min-width:0}
.rrow .model{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:6px}
.rrow .mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .model .tag{flex:0 0 auto}
.bar{height:7px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--crimson-2),var(--crimson) 60%,var(--magenta));
  transition:width .9s cubic-bezier(.22,1,.36,1),filter .2s}
.rrow .kv{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;text-align:right;color:var(--ink);white-space:nowrap}
.rrow .kv small{display:block;font-size:10px;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-top:2px}
.more{
  margin-top:14px;font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--crimson);
  background:none;border:1px solid rgba(236,18,34,.3);border-radius:999px;padding:9px 18px;cursor:pointer;transition:.2s;
}
.more:hover{background:rgba(236,18,34,.08);color:#fff}

/* ---------- Heatmap ---------- */
.heat-wrap{margin-top:34px;position:relative}
.heat-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
#rzMap{height:440px;border-radius:14px;border:1px solid var(--hair);background:#0b0509;position:relative;z-index:2;overflow:hidden}
body:not(.light) #rzMap .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.82) saturate(.35)}
body.light #rzMap{background:#ECEBE8}
.heat-cities{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.heat-cities .hc{font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);border:1px solid var(--hair);border-radius:999px;padding:6px 12px}
.heat-cities .hc b{font-family:var(--title);font-weight:700;color:var(--ink)}
@media (max-width:640px){#rzMap{height:320px}}
/* navegação rápida do mapa */
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:0 0 auto;font-family:var(--title);font-weight:700;font-size:12.5px;letter-spacing:.01em;color:var(--muted);
  background:none;border:1px solid var(--hair);border-radius:999px;padding:6px 12px;cursor:pointer;
  transition:color .18s,border-color .18s,background .18s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.mchips button:hover{color:var(--ink);border-color:rgba(236,18,34,.4)}
.mchips button.on{color:#fff;border-color:rgba(236,18,34,.55);background:rgba(236,18,34,.12)}
body.light .mchips button.on{color:#B80D1A;background:rgba(220,16,33,.08);border-color:rgba(184,13,26,.4)}
.map-tools{position:absolute;top:10px;right:10px;z-index:930;display:flex;flex-direction:column;gap:6px}
.map-tools button{font-family:var(--head);font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:#F3ECE6;background:rgba(14,10,14,.82);border:1px solid rgba(255,255,255,.16);border-radius:8px;
  padding:7px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.map-tools button:hover{border-color:rgba(236,18,34,.5)}
body.light .map-tools button{background:rgba(255,255,255,.92);color:#16161A;border-color:rgba(0,0,0,.16)}
#rzMap.exp{height:min(78vh,720px)}
.hc.link{cursor:pointer;transition:border-color .18s,color .18s}
.hc.link:hover{border-color:rgba(236,18,34,.45);color:var(--ink)}
.map-lock{position:absolute;inset:0;z-index:920;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;cursor:pointer}
.map-lock span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:rgba(14,10,14,.85);border:1px solid rgba(236,18,34,.4);border-radius:999px;padding:8px 14px}
body.light .map-lock span{background:rgba(255,255,255,.95);color:#16161A;border-color:rgba(184,13,26,.35)}
/* Sem fundo, sem borda, sem raio: so texto colorido entre parenteses, como o
   Phantom faz. A pilula tinha peso de componente e roubava a leitura do numero
   que ela qualifica; o parentese e subordinado por natureza. */
/* 19px em peso 700 nao e capricho: a regra de contraste para TEXTO GRANDE
   (piso 3,0 em vez de 4,5) vale a partir de 18,66px em negrito. Com o selo
   pequeno, o verde nao podia passar de #088500, que le escuro. Crescendo o
   selo, ele se qualifica e o verde pode ir a #0AA800, bem mais vivo, sem
   virar ilegivel. O tamanho paga a cor. */
.dlt{display:inline;font-family:var(--head);font-weight:700;font-size:19px;
  letter-spacing:0;margin-left:9px;white-space:nowrap;
  font-variation-settings:'opsz' 14;background:none;border:0;padding:0;border-radius:0}
.dlt.good{color:#6BE863}
/* VERMELHO DE PERDA DO PHANTOM: #EA3336, medido em cinco telas do Joao,
   16.494 pixels, matiz 359. No escuro ele mede 4,59:1 e vai direto. No claro
   da 4,00:1, abaixo do piso de corpo, entao escurece pro mesmo matiz ate 4,67.
   Par completo com o verde: #6BE863 no escuro, #0AA800 no claro. */
.dlt.bad{color:#EA3336}
.dlt.neu{color:var(--muted)}
/* COR E ESTADO, NAO ENFEITE (pedido do Joao: "que de vontade dos dados ficarem
   verdes"). O selo era so contorno e o olho passava batido; agora tem fundo, e
   direcao se le antes do numero. Fica a trava: nada aqui pode ler como falha da
   Rastcar, entao `bad` e sobrio e nunca alarmante, e a copy que acompanha
   enquadra como oportunidade. */

/* VERDE DE GANHO, medido nas telas do Phantom do proprio Joao: #6BE863, matiz
   de 116 graus, verde-LIMAO. O verde que estava aqui era #0AA800, matiz 151,
   verde-azulado de bandeira: nao le como ganho, le como institucional.
   #6BE863 sobre fundo claro da 1,51:1, ilegivel. Escurecido preservando o
   matiz ate 4,71:1, que passa ate em corpo de texto. No tema ESCURO fica o
   #6BE863 original, que la mede 12,58:1. */
/* #0AA800 rendia 2,89 a 3,15:1 conforme o cartao pegasse mais ou menos cor do
   fundo, contra piso de 3,0 pra texto grande: passava raspando ou nao passava.
   Um degrau mais escuro mantem o verde da Phantom e sai do limite. */
body.light .dlt.good{color:#089100}
body.light .dlt.bad{color:#FF1216}
body.light .dlt.neu{color:#6E6E76}
.dlt.good{color:#6BE863}
/* VERMELHO DE PERDA DO PHANTOM: #EA3336, medido em cinco telas do Joao,
   16.494 pixels, matiz 359. No escuro ele mede 4,59:1 e vai direto. No claro
   da 4,00:1, abaixo do piso de corpo, entao escurece pro mesmo matiz ate 4,67.
   Par completo com o verde: #6BE863 no escuro, #0AA800 no claro. */
.dlt.bad{color:#EA3336}
#rzMap .leaflet-tooltip{font-family:var(--head);font-weight:500;font-size:12.5px;line-height:1.5;border-radius:8px;border:1px solid rgba(220,16,33,.45);background:rgba(255,255,255,.96);color:#16161A;box-shadow:0 6px 22px rgba(0,0,0,.25)}
#rzMap .leaflet-tooltip b{color:#B80D1A}
#rzMap .leaflet-interactive{cursor:pointer}
/* controles do Leaflet vem com fonte propria (Lucida Console / Helvetica) · trazidos pro sistema */
#rzMap .leaflet-control-zoom a{font-family:var(--title);font-weight:700;text-decoration:none}
#rzMap .leaflet-control-attribution,#rzMap .leaflet-control-attribution a,#rzMap .leaflet-popup-content{
  font-family:var(--head);font-weight:500;font-size:10.5px}

/* ---------- Vigilância ---------- */
.vig-top{display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:center;
  border-radius:16px;padding:28px 30px}
.ring{position:relative;width:168px;height:168px;flex:0 0 auto}
.ring svg{width:168px;height:168px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:11}
.ring .arc{fill:none;stroke:url(#gArc);stroke-width:11;stroke-linecap:round}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* O CONTEUDO CABE NO CIRCULO, e a conta e essa.
   Anel de 168px com traco de 11px deixa raio interno de 73px. O canto mais
   distante do texto estava a 71px do centro: 2px de folga, ou seja, encostando
   no aro dos dois lados e embaixo. O erro nao era o anel, era o conteudo:
   38px de numero mais um rotulo de 100px de largura estouram a corda de um
   circulo de 146px de diametro util.
   Numero e rotulo encolhem ate sobrar folga de verdade. Alvo: 10px em todos os
   cantos, aferido em 1440px e em 390px. */
.ring .ctr{padding:14px}
.ring .ctr .p{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:33px;font-weight:700;letter-spacing:-.015em;line-height:1}
.ring .ctr .l{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:6px;max-width:88px;line-height:1.28}
.indics{display:flex;flex-direction:column;gap:15px}
.indic{display:flex;align-items:baseline;gap:12px}
.indic.p1{flex-wrap:wrap;row-gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:#6BE863;flex:0 0 auto;position:relative;top:1px}
.indic .it{font-size:14.5px;color:var(--ink)}
.indic .it b{font-family:var(--title);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.08em;color:#fff}
.anchor{margin:26px 0 6px;font-family:var(--title);font-size:clamp(19px,3vw,28px);font-weight:700;letter-spacing:-.005em;line-height:1.12;text-wrap:balance}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.acard{border-radius:12px;padding:18px 20px}
.acard .aq{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;letter-spacing:-.015em;color:#fff;line-height:1}
.acard .at{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.35}

/* ---------- Comportamento ---------- */
.comp-grid{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
.gauge{border-radius:16px;padding:26px 22px;text-align:center}
.gauge .gn{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:clamp(56px,9.4vw,78px);font-weight:700;letter-spacing:-.02em;line-height:1}
.gauge .gl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.gauge .gbar{height:6px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:18px;overflow:hidden}
.gauge .gbar>i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--crimson),var(--magenta));box-shadow:var(--glow);transition:width 1s cubic-bezier(.22,1,.36,1)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
/* mesma regra de sempre: #EC1222 pinta, --crimson-txt escreve. Este titulo
   estava escondido atras do corte do relatorio e so apareceu quando os outros
   sairam da lista: rendia de 2,71 a 4,21:1 conforme a parte do fundo. */
.col.attn h3{color:var(--crimson-txt)}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.18s}
.crow:hover{background:rgba(236,18,34,.06);border-color:rgba(236,18,34,.2)}
.crow .cp{font-family:var(--title);font-weight:700;font-size:15px;color:var(--ink)}
.crow .cs{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;padding:2px 10px;border-radius:6px;min-width:44px;text-align:center}
.cs.good{color:#6BE863;background:rgba(107,232,99,.12)}
.cs.mid{color:var(--ink);background:rgba(255,255,255,.07)}
.cs.warn{color:#ff7a4d;background:rgba(255,122,77,.14)}
.crow .cx{font-family:var(--head);font-weight:500;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* ---------- Motoristas · fileiras no material do .crow, sem estado de clique ---------- */
.drvlist{display:flex;flex-direction:column;gap:8px}
.crow.drv{cursor:default}
.crow.drv:hover{background:var(--glass-bg);border-color:var(--glass-b)}
.crow.drv .cx{white-space:normal}
.crow.drv .kv{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;text-align:right;color:var(--ink);white-space:nowrap}
.crow.drv .kv small{display:block;font-size:10px;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-top:2px}
.dcode{font-size:11px;color:var(--muted-2);letter-spacing:.08em;margin-left:6px}

/* ---------- Drill-down (ficha do veículo) ---------- */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(4,3,4,.66);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.ovl.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:61;top:0;right:0;height:100%;width:min(420px,92vw);
  background:linear-gradient(180deg,#120810,#0a060a);border-left:1px solid rgba(236,18,34,.28);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding:28px var(--pad);overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.5);
}
.sheet.open{transform:none}
.sheet .x{position:absolute;top:18px;right:18px;background:none;border:1px solid var(--hair);color:var(--muted);
  width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;transition:.2s}
.sheet .x:hover{color:#fff;border-color:rgba(236,18,34,.5)}
.sheet .sk{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson)}
.sheet .sp{font-family:var(--title);font-size:34px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px;color:#fff}
.sheet .sm{color:var(--muted);font-size:14px;margin-bottom:22px}
.sheet .drow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair)}
.sheet .drow .dl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.sheet .drow .dv{font-family:var(--title);font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--ink);text-align:right}
.sheet .dv.crim{color:var(--crimson)}
.sheet .note{font-family:var(--head);font-weight:500;font-size:12.5px;color:var(--muted-2);margin-top:20px;line-height:1.6}

/* ---------- Footer ---------- */
footer.bot{border-top:1px solid var(--hair);padding:30px 0;margin-top:40px;position:relative}
footer.bot .wrap{display:flex;flex-direction:column;gap:10px}
footer.bot .slogan{font-size:15px;font-weight:600;letter-spacing:-.01em}
footer.bot .f-line{font-family:var(--head);font-weight:500;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
footer.bot b{color:var(--ink);font-weight:500}

/* ---------- Botão PDF ---------- */
.pdfbtn{position:fixed;right:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(96deg,var(--crimson-2),var(--crimson));color:#fff;border:0;border-radius:999px;
  padding:11px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);-webkit-tap-highlight-color:transparent}
.pdfbtn:hover{filter:brightness(1.08)}
.pdfbtn .pi{width:12px;height:13px;border:1.6px solid #fff;border-top:0;border-radius:0 0 2px 2px;position:relative}
.pdfbtn .pi::before{content:"";position:absolute;left:50%;top:-8px;width:1.6px;height:8px;background:#fff;transform:translateX(-50%)}
.pdfbtn .pi::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;border-right:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:translate(-50%,-50%) rotate(45deg)}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- O mês em 30 segundos (porta de entrada) ---------- */
section.dg{padding:34px 0 0;border-top:0 !important}
.dgt{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--crimson);margin:0 0 14px;
  display:flex;align-items:center;gap:11px}
.dgt::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6;flex:0 0 auto}
.dgrid{display:flex;flex-direction:column;border-radius:14px;gap:6px}
/* DISTRIBUICAO. O rotulo tinha flex:1 1 auto e ESTICAVA: ele empurrava o numero
   contra a borda e sobravam ~700px de nada no meio, entao o olho atravessava a
   tela pra ligar "KM RODADOS NO MES" a "48.230". Agora a coluna do rotulo tem
   teto em 34ch: os numeros de todas as linhas alinham na MESMA vertical, perto
   do rotulo, e a seta fica sozinha na borda. Uma coluna alinhada le-se de cima
   a baixo; um numero solto na borda, nao. */
.dline{display:grid;grid-template-columns:minmax(0,34ch) auto 1fr auto;
  align-items:baseline;gap:0 18px;padding:16px 18px;text-decoration:none}
.dline .k{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.055em;
  text-transform:uppercase;color:var(--muted);min-width:0;font-variation-settings:'opsz' 14}
/* O NUMERO E O HEROI. Ele e o produto deste relatorio e tinha 19px contra 10,5px
   do rotulo: salto pequeno demais pra hierarquia imediata. */
.dline .v{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;
  color:var(--ink);white-space:nowrap;line-height:1.05;letter-spacing:-.015em}
.dline .go{font-family:var(--head);color:var(--crimson);font-size:16px;align-self:center;
  grid-column:4;opacity:.5;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.dline:hover .go,.dline:focus-visible .go{opacity:1;transform:translateX(3px)}
/* O selo de variacao cai na coluna 1fr e ESTICAVA ate 505px, virando uma pilula
   vazia atravessando a linha. Ele tem largura propria e e assim que se le. */
.dline .dlt{justify-self:start;align-self:baseline;margin-left:0}
/* linha de acao: texto longo, entao o valor ocupa a largura e nao vira coluna */
.dline.act{grid-template-columns:1fr auto}
.dline.act .k{grid-column:1/-1;margin-bottom:9px}
.dline.act .v{white-space:normal;font-family:var(--head);font-size:15px;font-weight:500;line-height:1.45;grid-column:1;min-width:0}
.dline.act .go{grid-column:2}
@media (max-width:640px){
  /* no celular 34ch nao cabe: rotulo em cima, numero embaixo, sem vao nenhum */
  .dline{grid-template-columns:1fr auto;gap:0 14px;padding:14px 16px}
  .dline .k{grid-column:1/-1;margin-bottom:4px}
  .dline .v{grid-column:1;font-size:23px}
  .dline .go{grid-column:2;grid-row:1/3}
}

/* ---------- Gráficos desenhados à mão (km/dia, calendário, benchmark, mapa de calor) ---------- */
.km-cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
.kmwrap,.utilwrap,.mnt-wrap{margin-top:34px}
/* km por dia · barras SVG */
.kmchart{position:relative;padding-top:48px} /* o rotulo do pico tem ~42px (valor+data+risco), com 26px ele caia EM CIMA da barra mais alta no celular */
.kmplot{position:relative}
.kmplot svg{display:block;width:100%;height:112px;touch-action:pan-y}
.kmbase{stroke:var(--hair);stroke-width:1}
.kmgrid{stroke:var(--hair);stroke-width:1;opacity:.6}
.kmbar{fill:var(--crimson);opacity:.82}
.kmbar.we{fill:var(--muted-2);opacity:.55}
/* VELA. Corpo = abertura ate fechamento da semana; pavio = pior ao melhor dia.
   Mesmo par de verde e vermelho das barras, que sao os tons medidos da Phantom. */
.kmvela.up{fill:#6BE863}
.kmvela.dn{fill:#EA3336}
.kmpavio{stroke-width:1.3;opacity:.9}
.kmpavio.up{stroke:#6BE863}
.kmpavio.dn{stroke:#EA3336}
body.light .kmvela.up{fill:#0AA800}
body.light .kmvela.dn{fill:#FF1216}
body.light .kmpavio.up{stroke:#0AA800}
body.light .kmpavio.dn{stroke:#FF1216}
/* um modo por vez */
.g-velas{display:none}
.kmchart.velas .g-barras{display:none}
.kmchart.velas .g-velas{display:block}
/* o rotulo do pico aponta um DIA, entao nao faz sentido na leitura semanal */
.kmchart.velas ~ .km-peak,.kmwrap.velas .km-peak{display:none}
.km-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.km-top .km-cap{margin-bottom:0}
.km-modo{flex:0 0 auto}
.km-leg.leg-velas{display:none}
.kmwrap.velas .km-leg.leg-barras{display:none}
.kmwrap.velas .km-leg.leg-velas{display:flex}
.km-sw.pav{width:3px;height:14px;border-radius:2px;background:var(--muted-2)}
.km-tip i{display:block;font-style:normal;font-weight:500;font-size:11px;
  color:var(--muted-2);letter-spacing:0;margin-top:1px}
.kmbar.up{fill:#6BE863;opacity:.9}
.kmbar.dn{fill:#EA3336;opacity:.72}
body.light .kmbar.up{fill:#0AA800;opacity:.92}
/* O pico tem que vir DEPOIS de .kmbar.up nos dois temas. Enquanto nao vinha,
   `body.light .kmbar.up` (0,2,1) vencia `.kmbar.pk` (0,2,0) e a barra do dia
   de pico saia VERDE no tema claro, enquanto a legenda ao lado prometia
   vermelho: a legenda afirmava uma coisa que o grafico nao cumpria. */
.kmbar.pk,body.light .kmbar.pk{fill:var(--crimson);opacity:1}
body.light .kmbar.dn{fill:#FF1216;opacity:.78}
.kmbar.pk{fill:var(--crimson);opacity:1}   /* pico e ENFASE: na linguagem Leve
   Imersivo enfase e o vermelho. O mapa de cores trocou magenta por lilas e o
   pico virou desbotado, que e o oposto de destaque. */
/* A BARRA SOB O CURSOR. Sem isso o tooltip dizia "14/07" e o olho tinha que
   adivinhar QUAL barra era: o numero aparecia sem o objeto a que se refere. */
.kmbar{transition:opacity .12s linear}
.kmbar.hov{opacity:1}
.kmplot svg:hover .kmbar:not(.hov){opacity:.34}
.kmplot svg:focus-visible{outline:2px solid var(--crimson);outline-offset:3px;border-radius:4px}
/* O rotulo fixo do pico e o tooltip ocupam o MESMO lugar: com o cursor sobre a
   barra mais alta os dois se sobrepunham e nenhum dos dois se lia. Quem manda
   e o tooltip, porque responde ao gesto. */
.kmchart:has(.km-tip.on) .km-peak{opacity:0;transition:opacity .12s linear}
.km-peak{transition:opacity .18s linear}
/* rótulos de escala (régua horizontal), no canto esquerdo sobre as linhas */
/* Vela da trajetoria: corpo do mes anterior ao mes dela, SEM pavio. O nome
   "Velas" e escolha do Joao, feita depois de eu mostrar o custo: o historico
   guarda um numero por mes e pavio exige a variacao de dentro do mes, entao
   aqui a vela nao tem como ter pavio. A pagina diz isso ao lado do grafico,
   pra ninguem ler a ausencia do pavio como volatilidade zero. */
.tjvela.up{fill:#6BE863}
.tjvela.dn{fill:#EA3336}
body.light .tjvela.up{fill:#0AA800}
body.light .tjvela.dn{fill:#FF1216}
.g-velas-tj{display:none}
.traj.velas .g-velas-tj{display:block}
.traj.velas .traj-line,.traj.velas .traj-area,.traj.velas .tj-dot,.traj.velas .tj-lab{display:none}
.nota-velas{display:none}
.traj.velas .nota-velas{display:block;margin-top:10px}
.km-scale.sc-velas{display:none}
.kmchart.velas .km-scale:not(.sc-velas){display:none}
.kmchart.velas .km-scale.sc-velas{display:block}
.km-scale{position:absolute;left:0;transform:translateY(-50%);font-family:var(--title);font-weight:700;font-size:10px;line-height:1;color:var(--muted-2);background:var(--bg);padding:1px 4px 1px 0;pointer-events:none}
/* rótulo do dia de pico, ancorado sobre a barra mais alta */
.km-peak{position:absolute;top:0;transform:translateX(-50%);font-family:var(--head);font-weight:500;font-size:11px;line-height:1.15;color:var(--ink);opacity:.82;white-space:nowrap;text-align:center;pointer-events:none;z-index:2}
.km-peak b{display:block;font-weight:500;font-size:11px;color:inherit;letter-spacing:0}
.km-peak::after{content:"";display:block;width:1px;height:8px;background:var(--crimson);margin:3px auto 0;opacity:.7}
/* tooltip por barra · hover no desktop, toque no mobile */
.km-tip{position:absolute;top:-2px;transform:translate(-50%,-100%);font-family:var(--head);font-weight:500;font-size:12px;white-space:nowrap;color:var(--ink);border-radius:8px;padding:5px 9px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3}
.km-tip.on{opacity:1}
.km-tip b{font-family:var(--title);color:var(--magenta);font-weight:700;font-size:1.1em}

/* ---------- Trajetória da frota · a régua do tempo (Resumo) ----------
   Cada relatório vira um ponto e a curva engorda sozinha mês a mês. Linha em SVG
   esticado (preserveAspectRatio none), então os PONTOS são HTML posicionado em %,
   senão o círculo deformaria junto com a escala. */
.traj{border-radius:16px;padding:22px 22px 16px;margin-top:22px}
.traj-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
.traj-now{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.traj-now .tn{font-family:var(--title);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(34px,6vw,46px);line-height:1;letter-spacing:-.02em}
.traj-now .tu{font-family:var(--head);font-weight:500;font-size:12.5px;color:var(--muted)}
.traj-plot{position:relative;margin-top:18px}
.traj-plot svg{display:block;width:100%;height:120px;overflow:visible}
/* revelacao por WIPE de clip-path (varre linha e area juntas, esquerda a direita).
   NAO usar stroke-dash pra desenhar: com non-scaling-stroke em path esticado o
   Chromium mede o dash errado e a linha sai falhada (visto no QA de 06/08). */
.traj-plot svg{clip-path:inset(-14px 101% -14px -8px)}
.traj-plot.in svg{clip-path:inset(-14px -8px -14px -8px);transition:clip-path 1.25s cubic-bezier(.22,1,.36,1) .1s}
.traj-line{fill:none;stroke:url(#tjStroke);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.traj-area{fill:url(#tjFill)}
.tj-dot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:var(--crimson);box-shadow:0 0 0 3px rgba(236,18,34,.15);cursor:pointer;opacity:0;transition:opacity .5s ease .35s;z-index:2}
.tj-dot.last{width:11px;height:11px;background:var(--magenta);box-shadow:0 0 0 4px rgba(255,79,160,.16),0 0 18px rgba(255,79,160,.45)}
.traj-plot.in .tj-dot{opacity:1}
.tj-lab{position:absolute;transform:translate(-50%,-100%);margin-top:-9px;font-family:var(--head);font-weight:500;font-size:11px;line-height:1.15;color:var(--muted);text-align:center;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .5s ease .6s;z-index:2}
.tj-lab b{display:block;font-family:var(--title);color:var(--magenta);font-weight:700;font-size:15px}
/* O lilas --magenta rende 9,06:1 no tema escuro e 1,91:1 no claro, ou seja,
   sumia. O comentario do gradiente de texto la em cima ja tinha medido esse
   mesmo lilas em 1,84:1 e reprovado, mas o conserto nunca chegou neste rotulo,
   que e o unico numero da pagina que ainda usava a cor crua. */
body.light .tj-lab b{color:#B80D1A}
.traj-plot.in .tj-lab{opacity:1}
.traj-plot .km-tip{transform:translate(-50%,calc(-100% - 9px))}
.traj-axis{position:relative;height:16px;margin-top:8px}
.traj-axis span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted-2);text-transform:lowercase;white-space:nowrap}
.km-hint{display:block;margin-top:10px;font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted-2)}
/* eixo de dias sob o gráfico */
.km-axis{position:relative;height:14px;margin-top:11px}
.km-axis span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--title);font-weight:700;font-size:11px;color:var(--muted-2)}
.km-leg{margin-top:14px;font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.km-leg b{font-family:var(--title);color:var(--ink);font-weight:700}
.km-leg .lg{display:inline-flex;align-items:center;gap:6px;margin-right:14px}
.km-sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
.km-sw.wk{background:var(--crimson);opacity:.82}
.km-sw.at{background:none;border-top:1.6px solid var(--muted-2);height:0;align-self:center;opacity:.6;width:14px}
.km-sw.up{background:#6BE863}
.km-sw.dn{background:#EA3336}
body.light .km-sw.up{background:#0AA800}
body.light .km-sw.dn{background:#FF1216}
.km-sw.we{background:var(--muted-2);opacity:.55}
.km-sw.pk{background:var(--crimson)}
/* utilização · uma linha por veículo, número grande de dias + barrinha + quadradinhos */
.km-sub{font-family:var(--head);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);margin:-4px 0 16px}
.urow{padding:16px 0}
.uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.uplate{font-family:var(--title);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.udias{font-family:var(--head);font-weight:500;color:var(--muted);font-size:13px}
.udias b{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;color:var(--ink);margin-right:3px}
.usub{margin-left:auto}
.ubar{height:8px;background:var(--hair);border-radius:5px;overflow:hidden;margin-bottom:11px;max-width:440px}
.ubar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--crimson-2),var(--crimson))}
.ubar>i.low{background:linear-gradient(90deg,#7a2a34,var(--crimson-2))}
.udots{display:flex;flex-wrap:wrap;gap:4px}
.ucell{width:13px;height:13px;border-radius:3px;background:var(--hair);flex:0 0 auto}
.ucell.on{background:var(--crimson);opacity:.9}
.ucell.ulg{margin:0 2px 0 6px;display:inline-block}
/* manutenção preventiva */
.mnt-odo{margin-top:4px;font-family:var(--head);font-weight:500;color:var(--muted-2)}
.mnt-note{margin-top:12px}
/* benchmark vs mercado */
.bmlist{margin-top:8px}
.bm{padding:20px 0}
.bm-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bm-name{font-family:var(--head);font-weight:600;font-size:16px;color:var(--ink)}
.bm-row{display:grid;grid-template-columns:132px 1fr 72px;gap:12px;align-items:center;margin-top:8px}
.bm-l{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.bbar{height:10px;background:var(--hair);border-radius:6px;overflow:hidden}
.bbar>i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.bbar>i.avg{background:linear-gradient(90deg,#7a7280,#9b9096)}
.bbar>i.you.ok{background:linear-gradient(90deg,#4FC247,#6BE863)}
.bbar>i.you.bad{background:linear-gradient(90deg,var(--crimson-2),var(--crimson))}
.bm-v{font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink);text-align:right}
.bm-read{font-family:var(--head);font-weight:500;font-size:14px;line-height:1.55;color:var(--muted);margin:12px 0 0}
/* Um fio abaixo de --muted, SO NO CLARO: a frase tem 14px e ficava em 4,49:1
   contra piso de 4,5, reprovando por 0,2%.
   Escrever a cor crua aqui, sem separar por tema, foi erro meu de uma rodada
   atras: um cinza escuro serve aos dois seletores e no tema ESCURO a mesma
   frase caiu para 1,36:1. Cor fixa em folha de dois temas tem que vir com o
   tema junto. */
body.light .bm-read{color:#4A4A52}
body:not(.light) .bm-read{color:#B4AAB0}   /* o par do escuro, pelo mesmo motivo */
.bm-read a{color:var(--crimson);text-decoration:none;border-bottom:1px solid rgba(236,18,34,.35)}
.bm-read a:hover{border-bottom-color:var(--crimson)}
/* mapa de calor de alertas · 7 dias × 4 períodos, número dentro da célula */
.hm-wrap{margin-top:8px}
.hmgrid{display:grid;grid-template-columns:58px repeat(4,1fr);gap:6px;align-items:stretch}
.hm-corner{}
.hm-ph{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted-2);text-align:center;line-height:1.25;align-self:end;padding-bottom:2px}
.hm-ph small{display:block;font-size:9px;letter-spacing:0;text-transform:none;color:var(--muted-2);margin-top:2px;opacity:.85}
.hm-day{font-family:var(--head);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted);display:flex;align-items:center}
.hm-cell{min-height:40px;border-radius:7px;background:var(--hair);display:flex;align-items:center;justify-content:center;
  font-family:var(--title);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink)}
/* Com a escala cheia as celulas quentes ficam escuras e o numero sumia dentro
   do alerta que ele mede. Branco com sombra fina resolve nos dois extremos. */
/* A celula recebe do JS so o matiz (--hm) e a posicao na rampa (--f). Quanto
   do matiz entra e contra o que ele se dilui e decidido AQUI, por tema, e por
   isso trocar de tema repinta o mapa sozinho.
   Os pisos 62% e 80% nao sao gosto: sao o que faz o numero escuro passar 4,5:1
   nos dois temas. Diluir no cinza do painel escurece muito mais do que diluir
   no branco, entao o tema escuro precisa de um piso mais alto pra celula calma
   nao virar um verde onde nenhuma cor de texto funciona. */
.hm-cell{font-size:17px;min-height:46px;border-radius:8px;text-shadow:none;font-weight:700;
  background:color-mix(in oklab, var(--hm,#12B806) calc(80% + var(--f,0) * 20%), #24242A);
  color:#191310}
body.light .hm-cell{
  background:color-mix(in oklab, var(--hm,#12B806) calc(62% + var(--f,0) * 38%), #FFFFFF)}
/* So o topo da rampa, ja vermelho cheio, inverte pro branco. */
.hm-cell.quente,body.light .hm-cell.quente{color:#fff}
/* Reserva pra navegador sem color-mix: cai no matiz cheio, que e legivel. */
@supports not (background:color-mix(in oklab, red 50%, blue)){
  .hm-cell,body.light .hm-cell{background:var(--hm,#12B806)}
}
.hm-leg{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.hm-ramp{flex:0 0 132px;height:10px;border-radius:5px;
  /* Paradas com a MESMA gama 0,62 das celulas. A rampa reta de antes desenhava
     uma escala linear que a grade nao usa: a legenda dizia que o meio era
     amarelo quando na celula o meio ja era laranja. */
  background:linear-gradient(90deg,rgb(18,184,6) 0%,rgb(215,201,10) 25%,rgb(251,147,13) 50%,rgb(244,85,21) 75%,rgb(234,27,18) 100%)}
/* trilhos claros no modo claro (o crimson/verde dos preenchimentos é acento e não muda) */
body.light .bbar{background:#E8E8E6}
body.light .kmbase{stroke:rgba(0,0,0,.14)}

/* ---------- Mobile ---------- */
@media (max-width:640px){
  body{font-size:17px}

#rcOrbes i:nth-child(3){
  width:42%;height:52%;left:28%;bottom:-10%;
  background:radial-gradient(circle at 50% 50%, rgba(143,195,246,.26), rgba(143,195,246,0) 74%);
  animation:rcOrb3 44s ease-in-out infinite alternate;
}
/* CLARO · a composicao do orcamento Leve Imersivo, medida no fundo-leve-v2:
   perola ocupa a esquerda e o centro (repouso), o coral entra pela DIREITA e
   aprofunda descendo (volume), lilas e azul so aparecem no rodape como
   reflexo. A troca anterior manteve as posicoes antigas e o fundo virou
   quase branco: a cor certa no lugar errado nao reproduz a linguagem. */
body.light #rcOrbes i:nth-child(1){
  width:58%;height:64%;left:auto;right:-16%;top:-6%;
  background:radial-gradient(circle at 50% 50%, rgba(253,173,153,.55), rgba(253,173,153,0) 72%)}
body.light #rcOrbes i:nth-child(2){
  width:52%;height:58%;left:auto;right:-10%;top:38%;
  background:radial-gradient(circle at 50% 50%, rgba(252,107,93,.42), rgba(252,107,93,0) 74%)}
body.light #rcOrbes i:nth-child(3){
  width:64%;height:44%;left:26%;bottom:-14%;
  background:radial-gradient(circle at 50% 50%, rgba(209,176,215,.34), rgba(143,195,246,.20) 46%, rgba(143,195,246,0) 76%)}
@keyframes rcOrb1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(12vw,8vh,0) scale(1.16)}}
@keyframes rcOrb2{from{transform:translate3d(0,0,0) scale(1.08)}to{transform:translate3d(-10vw,-7vh,0) scale(.94)}}
@keyframes rcOrb3{from{transform:translate3d(0,0,0) scale(.96)}to{transform:translate3d(-8vw,-9vh,0) scale(1.18)}}
/* mesma especificidade das regras que declaram a animacao (`:nth-child`),
   senao o reduce perde a briga e a luz continua andando */
@media (prefers-reduced-motion:reduce){
  #rcOrbes i:nth-child(1),
  #rcOrbes i:nth-child(2),
  #rcOrbes i:nth-child(3){animation:none}
}

/* o conteudo sobe pra cima da luz */
header.hd, nav.seg, main, footer.bot, .fabs{position:relative;z-index:1}
body.light .veil{opacity:.35}
/* os "poros" do canvas saem dos DOIS temas · quem faz o fundo vivo agora
   sao os orbes, e o fundo do escuro tem que ser o MESMO do claro */
#bgv{display:none}

/* ---------------------------------------------------------------
   2 · ZERO FIO  ·  nenhuma linha divisoria, nos dois temas
   --------------------------------------------------------------- */
main section.block + section.block{border-top:0}
nav.seg{border-top:0;border-bottom:0}
footer.bot{border-top:0;margin-top:64px}
.sheet .drow{border-bottom:0}
.urow{border-bottom:0}
.bm{border-bottom:0}
.substats{background:transparent;border:0;gap:10px;overflow:visible}
.dgrid{background:transparent;border:0;gap:10px;overflow:visible}

/* ---------------------------------------------------------------
   3 · VIDRO  ·  todo painel ganha o material dos planos da landing
   --------------------------------------------------------------- */
/* A `.sheet` (gaveta do veiculo) e o `.callout` ficam de fora de proposito:
   a gaveta e modal colada nas bordas da tela (vidro nela deixa a pagina
   atravessar e arredonda canto que encosta na aresta) e o callout ja tem
   material proprio, com a barra rosa. */
.dgrid > .dline,
.substats > *,
.acard,
.gauge,
.traj,
.vig-top,
.rrow,
.crow,
.km-tip,
.hero-stat,
.bm-read{
  border:1px solid var(--glass-b);
  border-radius:16px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
  box-shadow:var(--glass-sh);
}
/* cada fileira e uma lamina, nao uma celula de tabela */
.dgrid > .dline,
.rrow,
.crow{
  border-radius:14px;
  transition:transform .28s var(--ease), box-shadow .28s var(--ease);
}
.rrow,.crow{margin-bottom:8px}
.dgrid > .dline:hover,
.rrow:hover,
.crow:hover{
  background:var(--glass-bg);
  transform:translateY(-2px);
  box-shadow:var(--glass-sh-alta);
}
/* Os hovers antigos pintavam um veu crimson POR CIMA do vidro. Pior: os
   da `.rrow` usam a shorthand `background`, que zera a imagem do vidro —
   entao a linha sob o foco do teclado ficava translucida e o orbe
   atravessava por baixo. Duas listas do mesmo material reagem igual. */
.crow:hover,
.rrow:hover,
.rrow:focus-visible{
  background:var(--glass-bg);
  border-color:var(--glass-b);
}
/* quem navega por teclado perdia o unico sinal de foco junto com o veu
   crimson (a regra antiga trazia `outline:none` embutido) */
.rrow:focus-visible,
.crow:focus-visible,
.dgrid > .dline:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
body.light .callout .bolt{background:linear-gradient(180deg,#EC1222,#C90E1C);box-shadow:none}
.urow,
.bm{
  border:1px solid var(--glass-b);border-radius:16px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
  box-shadow:var(--glass-sh);
  padding:16px 18px;margin-bottom:10px;
}
#rzMap{border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}

/* ---------------------------------------------------------------
   4 · NUMERO-HEROI, AGORA EM CARTAO  ·  01/09/2026
   Aqui morava a regra "numero-heroi SOLTO", que o Joao tinha pedido
   com o argumento de que moldura rouba forca do numero. Ele mesmo
   reverteu, e por um motivo medido: solto, o `.hero-stat` era o
   UNICO bloco de metrica da pagina flutuando direto sobre o fundo,
   e nas larguras de tablet o verde do delta caia sobre a faixa viva
   do gradiente e desabava para 1,64:1, contra piso de 3,0.
   Em cartao ele para de depender de onde o gradiente esta e fica
   igual as outras nove fileiras. Se um dia voltar a ficar solto,
   volta o problema junto: o fundo e um degrade, nao uma cor.
   --------------------------------------------------------------- */

/* ---------------------------------------------------------------
   5 · CONTROLES DE VIDRO  ·  chips, filtros e cidades (so no claro:
   no escuro os controles do relatorio ja tem o material certo)
   --------------------------------------------------------------- */
body.light .segset,
body.light .mchips button,
body.light .heat-cities .hc,
body.light .map-tools button{
  border:1px solid rgba(255,255,255,.80);
  background:linear-gradient(168deg, rgba(255,255,255,.72), rgba(255,255,255,.52));
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 6px 16px -8px rgba(24,20,32,.18);
}
/* estado ligado: a cor e SUPERFICIE com texto escuro em cima ·
   lime como cor de TEXTO no claro da 1,4:1, ilegivel · licao da landing */
body.light .mchips button.on{
  color:#16161A;border-color:rgba(24,20,32,.14);
  background:linear-gradient(180deg,#DAFF3A,#CBF70E);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 6px 16px -8px rgba(120,150,0,.42);
}

/* ---------------------------------------------------------------
   6 · BOTOES ESCULPIDOS  ·  o material do "Escolher este plano"
   So no claro: no escuro o "Baixar PDF" ja e crimson solido e grafite
   sobre preto sumiria. Sem reflexo varrendo (pedido do Joao).
   --------------------------------------------------------------- */
body.light .pdfbtn,
body.light .more{
  color:#fff;
  border:1px solid rgba(0,0,0,.92);border-radius:14px;
  background:linear-gradient(180deg,#32323A 0%,#1E1E24 46%,#121216 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.20),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 1px 2px rgba(18,14,24,.22),
    0 10px 22px -8px rgba(18,14,24,.34);
  transition:transform .22s var(--ease), box-shadow .22s var(--ease), filter .22s var(--ease);
}
body.light .pdfbtn:hover,
body.light .more:hover{
  transform:translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 2px 4px rgba(18,14,24,.24),
    0 18px 38px -12px rgba(18,14,24,.42);
}
body.light .pdfbtn:active,
body.light .more:active{transform:translateY(0) scale(.986);transition-duration:.09s;filter:brightness(.94)}
body.light .more{background-image:linear-gradient(180deg,#32323A 0%,#1E1E24 46%,#121216 100%)}

/* o trocador de tema e ajuste, nao acao: fica de vidro, um degrau abaixo
   do "Baixar PDF" · dois objetos com o mesmo acabamento competem */
body.light .themebtn{
  color:#3A3A42;
  /* aresta de tinta, nao de luz: flutuando sobre um cartao branco, borda
     branca some e o botao vira um borrao · isto e limite de objeto, nao fio */
  border:1px solid rgba(24,20,32,.10);border-radius:14px;
  /* quase opaco de proposito: ele flutua POR CIMA do corpo do texto, e
     vidro fino ali deixa a frase atravessar e parecer defeito de tela */
  background:linear-gradient(168deg, rgba(255,255,255,.97), rgba(255,255,255,.93));
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 8px 20px -10px rgba(24,20,32,.28);
  transition:transform .22s var(--ease), box-shadow .22s var(--ease), color .22s var(--ease);
}
body.light .themebtn:hover{
  color:#16161A;transform:translateY(-1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 14px 28px -12px rgba(24,20,32,.34);
}
body.light .themebtn:active{transform:translateY(0) scale(.988);transition-duration:.09s}

/* ---------------------------------------------------------------
   7 · ETIQUETAS  ·  cor viva como SUPERFICIE, texto claro por cima
   --------------------------------------------------------------- */
body.light .tag{
  background:linear-gradient(180deg,#EC1222,#C90E1C);color:#fff;border:0;
  box-shadow:0 6px 16px -8px rgba(231,0,85,.55);
}
body.light .tag.ghost{
  background:linear-gradient(168deg, rgba(255,255,255,.72), rgba(255,255,255,.52));
  color:#56565E;border:1px solid rgba(255,255,255,.80);box-shadow:none;
}

/* ---------------------------------------------------------------
   8 · GOTA D'AGUA  ·  onda que nasce onde o dedo toca
   Tres cristas estreitas, nao um degrade largo. No CLARO quem desenha
   a agua e a SOMBRA DO VALE (branco sobre branco some); no ESCURO e o
   contrario: a crista e LUZ. O fio crimson da o desenho nos dois.
   --------------------------------------------------------------- */
.rc-gota{
  position:absolute;border-radius:50%;pointer-events:none;z-index:5;
  transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle closest-side,
    rgba(255,255,255,0)    0%,
    rgba(255,255,255,.045) 26%,
    rgba(255,255,255,.10)  31%,
    rgba(255,255,255,0)    36%,
    rgba(255,255,255,.075) 43%,
    rgba(255,255,255,.17)  48%,
    rgba(255,255,255,0)    54%,
    rgba(255,255,255,.10)  59%,
    rgba(236,18,34,.30)    63%,
    rgba(255,255,255,.26)  66%,
    rgba(255,255,255,0)    74%);
  animation:rcGota .82s var(--ease) forwards;
}
body.light .rc-gota{
  background:radial-gradient(circle closest-side,
    rgba(26,22,34,0)     0%,
    rgba(26,22,34,.035) 26%,   /* crista 3 · a mais fraca, ja morrendo   */
    rgba(255,255,255,.30) 31%,
    rgba(26,22,34,0)    36%,
    rgba(26,22,34,.085) 43%,   /* crista 2 · meia forca                  */
    rgba(255,255,255,.42) 48%,
    rgba(26,22,34,0)    54%,
    rgba(26,22,34,.14)  59%,   /* crista 1 · a da frente, o vale escuro  */
    rgba(231,0,85,.20)  63%,   /* fio crimson na crista · da o desenho   */
    rgba(255,255,255,.55) 66%,
    rgba(255,255,255,0) 74%,
    rgba(26,22,34,0)   100%);
}
@keyframes rcGota{
  from{transform:translate(-50%,-50%) scale(0);opacity:.9}
  to  {transform:translate(-50%,-50%) scale(1);opacity:0}
}
@media (prefers-reduced-motion:reduce){.rc-gota{display:none}}
.dgrid > .dline, .urow, .acard, .rrow, .crow{position:relative;overflow:hidden}

/* ---------------------------------------------------------------
   9 · CABECALHO  ·  a navegacao vira uma lamina flutuante (no claro)
   --------------------------------------------------------------- */
/* O fundo e o blur moram num pseudo-elemento MASCARADO. Se ficassem na
   propria nav, o blur terminaria numa aresta reta de ponta a ponta — que
   e exatamente o fio divisorio que esta camada existe pra nao ter. */
body.light nav.seg{box-shadow:none;isolation:isolate}
body.light nav.seg::before{
  content:"";position:absolute;inset:0 0 -22px 0;z-index:-1;pointer-events:none;
  /* A lamina e OPACA na altura dos rotulos e so desvanece num rabo de
     22px ABAIXO da barra. Desvanecer dentro dela deixava o grafico rolar
     por baixo do texto; e cortar reto devolveria o fio divisorio. */
  background:linear-gradient(180deg, rgba(250,250,248,.94) 0%, rgba(250,250,248,.94) 72%, rgba(250,250,248,0) 100%);
  -webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  -webkit-mask-image:linear-gradient(180deg,#000 72%, transparent 100%);
          mask-image:linear-gradient(180deg,#000 72%, transparent 100%);
}

/* ---------------------------------------------------------------
   11 · LEGIBILIDADE NO CLARO
   O claro deixou de ser opcao e virou o padrao, entao o que passava
   por ser tema secundario agora precisa cumprir WCAG. O crimson de
   TELA (#EC1222) da ~3,4:1 sobre o papel branco; a peca ja tinha o
   tom certo pra texto no claro (#B80D1A, usado em `.anchor`).
   --------------------------------------------------------------- */
/* #B80D1A ainda ficava em 3,97:1 no `.ck` sobre a parte quente do fundo.
   Um degrau: e a mesma familia de vermelho, so que sobrevive ao gradiente. */
/* REGRA DE COR: #EC1222 PINTA, --crimson-txt ESCREVE.
   O vermelho da marca rende 3,4:1 como letra sobre papel branco e 2,65:1 sobre
   a parte quente do fundo. Toda vez que ele apareceu como texto nesta pagina
   reprovou: eyebrow, "o que isso diz", "ver todos", o link do plano e a lista
   de placas dos alertas. Cada tema tem o seu tom de letra, e e ele que se usa. */
body.light .eyebrow,
body.light .callout .ck,
body.light .dgt,
body.light .bm-read a,
body.light main a:not(.dline):not(.seg-link){color:var(--crimson-txt)}
/* o par equivalente no escuro */
body:not(.light) .eyebrow,
body:not(.light) .callout .ck,
body:not(.light) .dgt,
body:not(.light) nav.seg a:hover .n,
body:not(.light) nav.seg a.active .n,
body:not(.light) .bm-read a,
body:not(.light) main a:not(.dline):not(.seg-link),
body:not(.light) .more{color:var(--crimson-txt)}
/* .scr sao as duas dicas de uso do grafico. Estavam pintadas no vermelho da
   marca, o que fazia a instrucao gritar mais alto que o proprio dado e ler
   como mensagem de erro. Dica e texto de apoio: fica no tom apagado.
   REGRA PROPRIA de proposito: `.scr` era o ULTIMO seletor de um grupo separado
   por virgula, e trocar a cor ali levou junto o eyebrow, o `.ck` e o `.dgt`,
   que viraram cinza sem ninguem pedir. Grupo de virgula nao se edita pela
   ponta. */
body.light .scr{color:var(--muted-2)}
body.light .segset button[aria-pressed="true"]{background:linear-gradient(96deg,#A80D26,#B80D1A)}
body.light .tag.warn,
body.light .cs.warn{color:#8A3E10}
/* o "·" do mapa de calor sobre a celula mais clara dava 3,5:1 */
/* o "Baixar PDF" no escuro dava 4,44:1 · o crimson de tela e claro demais
   pra carregar texto branco em corpo pequeno */
body:not(.light) .pdfbtn{background:linear-gradient(96deg,#B80D1A,#DD1B34)}

/* ---------------------------------------------------------------
   9b · CARREGANDO / ERRO  ·  a tela de servico segue o tema
   O caminho de erro nao passa pela troca de tema: ele abria PRETO numa
   peca que hoje e clara. Quem chega nele e o cliente com assinatura
   vencida ou com o link torto — e a pior hora pra peca parecer outra.
   --------------------------------------------------------------- */
.rc-ovl{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;
  background:#0A0A0A;color:#fff;
  font-family:var(--head),system-ui,sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;
}
body.light .rc-ovl{background:var(--bg);color:var(--ink)}
.rc-ovl .k{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--crimson);margin-bottom:12px}
body.light .rc-ovl .k{color:#B80D1A}
.rc-ovl .t{font-family:var(--title);font-size:19px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.rc-ovl .s{font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;line-height:1.5}

/* ---------------------------------------------------------------
   10 · OS CONTROLES SAEM DA FRENTE DA LEITURA
   Isto e uma peca de LER. Dois botoes fixos permanentes cobriam texto
   no celular e, na abertura, o "Baixar PDF" caia por cima da ultima
   linha do resumo. Entao: eles nascem escondidos (a capa e a primeira
   impressao, e tambem a foto do produto na landing), somem enquanto a
   pessoa desce e voltam quando ela para ou sobe. Alem disso o rodape
   reserva a altura deles, pra ultima linha nunca ficar por baixo.
   --------------------------------------------------------------- */
.pdfbtn,.themebtn{transition:opacity .28s var(--ease), transform .28s var(--ease)}
body.fabs-off .pdfbtn,
body.fabs-off .themebtn{opacity:0;transform:translateY(14px);pointer-events:none}
/* quem chega de teclado tem que conseguir alcancar */
body.fabs-off .pdfbtn:focus-visible,
body.fabs-off .themebtn:focus-visible{opacity:1;transform:none;pointer-events:auto}
footer.bot{padding-bottom:104px}
@media (prefers-reduced-motion:reduce){
  .pdfbtn,.themebtn{transition:none}
  body.fabs-off .pdfbtn,body.fabs-off .themebtn{transform:none}
}

/* ---------------------------------------------------------------
   11 · PAPEL  ·  nada desta camada atravessa a impressao
   O tema de impressao ja reescreve as superficies com !important; o que
   ele nao previa e vidro (blur) e luz de fundo. Zeramos aqui.
   --------------------------------------------------------------- */
@media print{
  #rcOrbes,.rc-gota{display:none !important}
  .dgrid > .dline,.substats > *,.acard,.gauge,.traj,.vig-top,.rrow,.crow,.km-tip,.bm-read,
  .urow,.bm,#rzMap,.segset,.mchips button,.heat-cities .hc,.map-tools button,.themebtn,
  nav.seg::before{
    -webkit-backdrop-filter:none !important;backdrop-filter:none !important;
  }
  .dgrid > .dline,.urow,.bm,.rrow,.crow{transform:none !important}
  /* o respiro de 8px e de tela · no papel ele empurrava 2 veiculos do
     ranking pra pagina seguinte sem ninguem ter escolhido isso */
  .rrow,.crow{margin-bottom:0 !important}
  /* a reserva pros botoes flutuantes tambem e de tela · no papel viraria
     uma pagina extra em branco */
  footer.bot{padding-bottom:30px !important}
}
</style>
</head>

<script src="dados-exemplo.js"></script>
<script>
function __boot(){
  var D = window.RC_DADOS || {};
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- helpers ----------
  function nf(n){ return Number(n).toLocaleString('pt-BR'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(id){ return document.getElementById(id); }
  // callout de insight · "o que isso diz" (régua bordô à esquerda, discreto)
  function insightHtml(texto){
    /* payload do Builder pode trazer " · " como separador de frase, aqui vira virgula */

  var instant = false;

    if(reduce || instant){ render(alvo); return; }
    var t0 = performance.now();

      var p = Math.min(1,(t-t0)/dur), val = alvo*(1-Math.pow(1-p,3));
      render(dec ? Math.round(val*Math.pow(10,dec))/Math.pow(10,dec) : Math.round(val));

    var semanas=[], sem=null;

    var faixaV=(function(){

           + '" data-de="'+(d0[2]||'')+'/'+(d0[1]||'')+'" data-ate="'+(d1[2]||'')+'/'+(d1[1]||'')

    function renderRank(){
      var arr=veiculos.slice();
      /* v3.5 · recorte por tipo antes de tudo; maquina (km null) nunca some, ela lidera em horas */
      if(mv.tipo==='maquinas') arr=arr.filter(function(v){return v.tipo==='maquina';});
      else if(mv.tipo==='veiculos') arr=arr.filter(function(v){return v.tipo!=='maquina';});
      if(mv.filter==='ociosos') arr=arr.filter(function(v){return v.ocioso;});
      arr.sort(function(a,b){ return (b[mv.metric]||0)-(a[mv.metric]||0); });
      var showAll = (mv.filter==='ociosos'||mv.expanded);
      var shown = showAll ? arr : arr.slice(0,5);
      var maxV = arr.length ? Math.max.apply(null, arr.map(function(v){return v[mv.metric]||0;})) : 1;
      if(maxV<=0) maxV=1;
      var unit = mv.metric==='km' ? 'km' : 'h';
      var rank=el('mvRank');
      if(!shown.length){ rank.innerHTML='<p class="sub" style="padding:10px 12px">'+(mv.filter==='ociosos'?'Nenhum veículo ocioso neste recorte.':'Nenhum veículo neste recorte.')+'</p>'; el('mvMoreWrap').innerHTML=''; return; }
      rank.innerHTML = shown.map(function(v,i){
        var val=v[mv.metric];
        var w=Math.max(4, Math.round((val||0)/maxV*100));
        var altVal = mv.metric==='km' ? nfDash(v.horas,' h') : nfDash(v.km,' km');
        // uma etiqueta por linha · a exceção (ocioso) manda; senão o líder da ordenação
