  var ovl=el('ovl'), sheet=el('sheet'), lastFocus=null;
  function drow(l,v,crim){ return '<div class="drow"><span class="dl">'+l+'</span><span class="dv'+(crim?' crim':'')+'">'+v+'</span></div>'; }
  function openDetail(placa){
    var v=null; for(var i=0;i<veiculos.length;i++){ if(veiculos[i].placa===placa){ v=veiculos[i]; break; } }
    if(!v) return;
    var cmp=compFor(placa);
    var ehMaq = v.tipo==='maquina';
    var vsMedia = (mediaKm && v.km!=null) ? Math.round((v.km/mediaKm-1)*100) : null;
    var vsTxt = vsMedia==null ? null : (vsMedia===0 ? 'na média da frota' : (Math.abs(vsMedia)+'% '+(vsMedia>0?'acima':'abaixo')+' da média'));
    var h='<button class="x" id="shX" aria-label="Fechar">&times;</button>'+
      '<span class="sk">Ficha '+(ehMaq?'da máquina':'do veículo')+'</span>'+
      '<div class="sp">'+esc(v.placa)+'</div>'+
      '<div class="sm">'+esc(v.modelo)+'</div>'+
      /* maquina se le por horimetro: horas primeiro, km so quando existe */
      (ehMaq
        ? (drow('Horas de motor no mês', nfDash(v.horas,' h'), true)+
           (v.km!=null?drow('Km no mês', nf(v.km)+' km'):''))
        : (drow('Km no mês', nfDash(v.km,' km'), true)+
           drow('Horas em operação', nfDash(v.horas,' h'))))+
      (v.km==null && !ehMaq ? drow('Medição', 'pelo horímetro, horas de motor') : '')+
      (v.op ? drow('Perfil', 'trabalha parado com o motor ligado, horas são operação') : '')+
      (vsTxt!=null ? drow('vs média da frota', esc(vsTxt), vsMedia>0) : '')+
      drow('Status', v.ocioso?(ehMaq?'Parada no período':'Subutilizado'):(ehMaq?'Em operação':'Ativo'));
    if(v.zona) h+=drow('Onde ficou mais tempo', esc(v.zona), true);
    if(cmp){ h+=drow('Score de comportamento', String(cmp.score), true)+
      drow('Eventos de velocidade', nf(cmp.excessos)); }
    else { h+='<p class="note">Comportamento por veículo, detalhado na próxima leitura mensal.</p>'; }
    h+='<p class="note">Dados de telemetria e rastreamento sob monitoramento 24h.</p>';
    sheet.innerHTML=h; sheet.hidden=false;
    lastFocus=document.activeElement;
    requestAnimationFrame(function(){ ovl.classList.add('open'); sheet.classList.add('open'); });
    el('shX').addEventListener('click', closeDetail);
    document.body.style.overflow='hidden';
    el('shX').focus();
  }
  function closeDetail(){
    ovl.classList.remove('open'); sheet.classList.remove('open');
    document.body.style.overflow='';
    setTimeout(function(){ sheet.hidden=true; sheet.innerHTML=''; },300);
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  ovl.addEventListener('click', closeDetail);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && ovl.classList.contains('open')) closeDetail(); });

  // ---------- Bloco 6 · O plano do próximo mês (100% derivado dos dados já presentes) ----------
  (function(){
    var sec=el('plano'); if(!sec) return;
    var c=D.comportamento||{}; var ec=D.economia||null;
    var itens=[];
    /* PLANO, NAO DESPEJO. Numa frota de 212 veiculos, listar todos os que
       precisam de acao gerava uma frase de 870 caracteres (49 placas) na
       ultima secao do relatorio · o cliente le uma parede e nao age.
       Acima de 3, a acao passa a dizer o TAMANHO do problema e por onde
       comecar; a lista completa ja esta nas secoes acima. */
    /* o identificador fica como o cliente cadastrou · "2188" e o numero de
       frota, e e assim que ele chama o carro. Prefixar com "o veiculo"
       gerava "comece por o veiculo 2187". */
    function plano(arr){
      var a = arr.map(function(x){ return esc(x); });
      if(a.length <= 3) return {txt:joinNat(a), n:a.length};
      return {txt:nf(a.length)+' veículos, comece por '+joinNat(a.slice(0,3)), n:a.length};
    }
    var piores=(c.piores||[]).map(function(x){ return x.placa; });
    var ev=(c.piores||[]).reduce(function(acc,x){ return acc+(x.excessos||0); },0);
    /* sem excesso nenhum a frase virava "concentram 0 eventos de velocidade" */
    if(piores.length && ev>0){ var pl=plano(piores);
      itens.push('Conversar com '+pl.txt+', '+(pl.n===1?'concentra ':'concentram ')+nf(ev)+' eventos de velocidade.'); }
    var sub=(D.veiculos||[]).filter(function(v){ return v.ocioso; }).map(function(v){ return v.placa; });
    if(sub.length) itens.push('Reavaliar a escala de '+plano(sub).txt+', capacidade parada é frota que você já pagou.');
    var bf=(D.vigilancia&&D.vigilancia.saude&&D.vigilancia.saude.bateria_fraca)||[];
    if(bf.length){ var pb=plano(bf.map(function(x){ return x.placa; }));
      itens.push('Trocar a bateria '+(pb.n===1?'do ':'de ')+pb.txt+' antes que vire pane na estrada.'); }
    var mnt=(D.manutencao||[]);
    if(mnt.length) itens.push('Agendar a revisão de '+plano(mnt.map(function(x){ return x.placa; })).txt+', cruzou marco de revisão este mês.');
    if(ec) itens.push('Derrubar o custo do tempo ocioso em um terço, devolve na ordem de R$ '+
      Math.round(ec.horas_ociosas_mes*ec.premissa_litros_hora*ec.premissa_preco_litro/3).toLocaleString('pt-BR')+' por mês.');
    if(!itens.length){ sec.style.display='none'; return; }
    var sf=c.score_frota||0;
    var h='<div class="block-head reveal"><span class="eyebrow">'+SECNUM['plano']+' O plano</span>'+
      '<h2>O que fazer no próximo mês</h2>'+
      '<p class="sub">Cada ação com placa e prazo. O próximo relatório mostra o efeito.</p></div>'+
      '<div class="indics reveal" style="margin-top:6px">'+itens.map(function(t,i){
        return '<div class="indic'+(i===0?' p1':'')+'"><span class="dot"></span><span class="it">'+t+'</span>'+
               (i===0?'<span class="tag solid">Começar por aqui</span>':'')+'</div>'; }).join('')+'</div>'+
      /* frota ja no teto pedia "de 100 para 100" · quem chegou la nao tem
         para onde subir, tem o que sustentar */
      (sf ? '<p class="anchor reveal grad" style="margin-top:24px">' +
            (sf >= 98 ? 'Meta: manter o score da frota em ' + sf + '.'
                      : 'Meta: score da frota de ' + sf + ' para ' + Math.min(100, sf+3) + '.') +
            '</p>' : '');
    sec.innerHTML=h;
    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });
  })();

  // ---------- O mês em 30 segundos (porta de entrada · 100% derivado do que já está na página) ----------
  (function(){
    var mn=document.querySelector('main'); if(!mn) return;
    var rows=[];
    function row(href,label,valor,extra,wrap){
      rows.push('<a class="dline'+(wrap?' act':'')+'" href="'+href+'"><span class="k">'+label+'</span>'+
        '<span class="v">'+valor+'</span>'+(extra||'')+'<span class="go" aria-hidden="true">&rsaquo;</span></a>');
    }
    var r=D.resumo||{};
    if(r.km_mes!=null) row('#resumo','Km rodados no mês', nf(r.km_mes), deltaChip(r.km_mes, ANT&&ANT.km_mes, 'neutro'));
    if(r.disponibilidade_pct!=null) row('#resumo','Frota em atividade nas últimas 24h', String(r.disponibilidade_pct).replace('.',',')+'%');
    var vg=D.vigilancia;
    if(vg&&vg.alertas&&vg.alertas.length){ var tot=0; vg.alertas.forEach(function(a){ tot+=(a.qtd||0); }); row('#vigilancia','Alertas tratados pela central 24h', nf(tot)); }
    var ec=D.economia;
    if(ec) row('#economia','Custo estimado do motor parado', 'R$ '+nf(Math.round(ec.horas_ociosas_mes*ec.premissa_litros_hora*ec.premissa_preco_litro)));
    var sfv=D.comportamento ? D.comportamento.score_frota : null;
    if(sfv!=null) row('#comportamento','Score de direção da frota', String(sfv), deltaChip(sfv, ANT&&ANT.score_frota, 'sobe-bom'));
    /* O resumo e de UMA LINHA: com 212 veiculos, listar todas as revisoes
       gera uma string de dezenas de placas que atravessa a lamina inteira
       (na amostra so havia uma, entao nunca apareceu). Aqui vale a conta,
       nao a lista: a lista completa esta na secao de manutencao. */
    if(D.manutencao && D.manutencao.length){
      var mnt = D.manutencao.map(function(x){ return esc(x.placa); });
      row('#movimento','Revisão preventiva no radar',
          mnt.length <= 2 ? joinNat(mnt)
                          : mnt[0] + ' e mais ' + nf(mnt.length - 1) + ' veículos');
    }
    var acao=document.querySelector('#plano .indic .it');
    if(acao) row('#plano','Primeira ação do mês que vem', esc(acao.textContent), '', true);
    if(rows.length<3) return; // com pouco dado a porta de entrada não ajuda
    var sec=document.createElement('section'); sec.className='block dg'; sec.id='mes30';
    /* a frase inteira num SO item de flex: solta, o "<span class=scr>" virava
       item proprio e o gap de 11px do .dgt caia ANTES da virgula ("SEGUNDOS ,
       TOQUE"). O gap existe pro risco do ::before e nao pode sair. */
    sec.innerHTML='<p class="dgt reveal"><span>O mês em 30 segundos<span class="scr">, toque para ir à seção</span></span></p>'+
      '<div class="dgrid reveal">'+rows.join('')+'</div>';
    mn.insertBefore(sec, mn.firstElementChild);
    Array.prototype.forEach.call(sec.querySelectorAll('.reveal'),function(n){ watch(n); });
  })();

  // ---------- Mapa real de concentração (Leaflet + OpenStreetMap · só renderiza com dado) ----------
  function initMapa(){
    var alvo=el('rzMap'); if(!alvo) return;
    var rc=D.rotas_calor;
    function esconder(){ var w=document.querySelector('.heat-wrap'); if(w) w.style.display='none'; }
    if(!(rc&&rc.pontos&&rc.pontos.length)){ esconder(); return; }
    var css=document.createElement('link'); css.rel='stylesheet';
    css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    function carrega(src,ok,erro){ var sc=document.createElement('script'); sc.src=src; sc.onload=ok; sc.onerror=erro; document.head.appendChild(sc); }
    carrega('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',function(){
        try{
          var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
          var anim=!reduce;
          var m=L.map('rzMap',{scrollWheelZoom:false,zoomControl:true,preferCanvas:true});
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {maxZoom:17,detectRetina:true,attribution:'&copy; OpenStreetMap'}).addTo(m);
          // um ponto por VEICULO na zona dominante · hover = placa · clique = ficha
          // (decisão do dono 21/07: SEM camada de calor · só os veículos)
          var marcadores={};
          var comPos=(D.veiculos||[]).filter(function(v){ return v.pos; });
          comPos.forEach(function(v){
            marcadores[v.placa]=L.circleMarker([v.pos.lat,v.pos.lng],{radius:isTouch?8:6,color:'#FF2D4B',weight:2,
              fillColor:'#FF4FA0',fillOpacity:.9})
             .addTo(m)
             .bindTooltip('<b>'+esc(v.placa)+'</b>, '+esc(v.modelo)+'<br>'+nf(v.km)+' km, '+nf(v.horas)+' h, '+esc(v.zona||''),
               {direction:'top',offset:[0,-6],opacity:1})
             .on('click',function(){ openDetail(v.placa); });
          });
          var bounds=comPos.length ? comPos.map(function(v){ return [v.pos.lat,v.pos.lng]; })
                                   : rc.pontos.map(function(p){ return [p.lat,p.lng]; });
          m.fitBounds(bounds,{padding:[34,34]});

          // ---- navegação rápida ----
          var setChip=function(){};
          function frotaToda(){ m.flyToBounds(bounds,{padding:[34,34],duration:.7,animate:anim}); setChip(null); }

          // chips de placa: um toque voa até o veículo e abre a etiqueta
          if(comPos.length){
            var chips=document.createElement('div'); chips.className='mchips';
            chips.innerHTML='<button type="button" data-p="__all">Frota toda</button>'+comPos.map(function(v){
              return '<button type="button" data-p="'+esc(v.placa)+'">'+esc(v.placa)+'</button>'; }).join('');
            alvo.parentNode.insertBefore(chips, alvo);
            setChip=function(p){ Array.prototype.forEach.call(chips.children,function(c){ c.classList.toggle('on', c.getAttribute('data-p')===p); }); };
            chips.addEventListener('click',function(e){
              var btn=e.target.closest('button'); if(!btn) return;
              var pl=btn.getAttribute('data-p');
              if(pl==='__all'){ frotaToda(); return; }
              var mk=marcadores[pl]; if(!mk) return;
              setChip(pl);
              m.flyTo(mk.getLatLng(), Math.max(m.getZoom(),13), {duration:.7,animate:anim});
              m.once('moveend',function(){ mk.openTooltip(); });
            });
          }

          // ferramentas sobre o mapa: recentrar a frota + ampliar
          var tools=document.createElement('div'); tools.className='map-tools';
          tools.innerHTML='<button type="button" id="mtFrota" title="Ver a frota inteira">Frota</button>'+
                          '<button type="button" id="mtExp" title="Ampliar o mapa">Ampliar</button>';
          alvo.appendChild(tools);
          L.DomEvent.disableClickPropagation(tools); L.DomEvent.disableScrollPropagation(tools);
          tools.querySelector('#mtFrota').addEventListener('click',frotaToda);
          tools.querySelector('#mtExp').addEventListener('click',function(){
            var on=alvo.classList.toggle('exp'); this.textContent=on?'Reduzir':'Ampliar';
            var self=this;
            setTimeout(function(){ m.invalidateSize(); if(!on) m.fitBounds(bounds,{padding:[34,34]});
              if(on) alvo.scrollIntoView({block:'center'}); self.blur(); },60);
          });

          // chips de cidade viram atalho: voa até o centro dos veículos daquela zona
          var zonas={};
          comPos.forEach(function(v){ if(v.zona) (zonas[v.zona]=zonas[v.zona]||[]).push(v.pos); });
          Array.prototype.forEach.call(document.querySelectorAll('.heat-cities .hc'),function(hc){
            var nome=(hc.querySelector('b')||{}).textContent, ps=zonas[nome];
            if(!ps||!ps.length) return;
            var lat=ps.reduce(function(s,p){return s+p.lat;},0)/ps.length;
            var lng=ps.reduce(function(s,p){return s+p.lng;},0)/ps.length;
            hc.classList.add('link'); hc.setAttribute('role','button'); hc.tabIndex=0; hc.title='Ver '+nome+' no mapa';
            function go(){ setChip(null); m.flyTo([lat,lng],12,{duration:.7,animate:anim}); alvo.scrollIntoView({block:'center'}); }
            hc.addEventListener('click',go);
            hc.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
          });

          // toque: o mapa só captura o dedo depois de um toque (senão sequestra a rolagem da página)
          if(isTouch){
            m.dragging.disable(); m.touchZoom.disable(); m.doubleClickZoom.disable();
            var lock=document.createElement('div'); lock.className='map-lock';
            lock.innerHTML='<span>Toque para explorar o mapa</span>';
            alvo.appendChild(lock);
            lock.addEventListener('click',function(){
              m.dragging.enable(); m.touchZoom.enable(); m.doubleClickZoom.enable(); lock.remove();
            },{once:true});
          } else {
            // desktop: roda do mouse só depois de clicar no mapa (e solta ao sair)
            alvo.addEventListener('click',function(){ m.scrollWheelZoom.enable(); });
            alvo.addEventListener('mouseleave',function(){ m.scrollWheelZoom.disable(); });
          }
        }catch(e){ esconder(); }
    },esconder);
  }

  // ---------- Fundo vivo · rotas GPS (sutil) ----------
  (function(){
    var cv=el('bgv'); if(!cv) return;
    /* o fundo vivo passou a ser os orbes · sem esta saida o canvas seguiria
       pintando um quadro por vez atras de um `display:none` */
    return;
    var ctx=cv.getContext('2d'), W=0,H=0,DPR=1, raf=null;
    var routes=[
      {y:0.16,amp:0.05,ph:0.4,sp:0.045,off:0.10},
      {y:0.38,amp:0.075,ph:1.7,sp:0.032,off:0.55},
      {y:0.60,amp:0.055,ph:2.6,sp:0.052,off:0.30},
      {y:0.80,amp:0.085,ph:0.9,sp:0.040,off:0.80}
    ];
    routes.forEach(function(r){
      r.pts=[]; for(var i=0;i<=64;i++){ var t=i/64; r.pts.push([t, r.y+Math.sin(t*Math.PI*2*1.35+r.ph)*r.amp+Math.sin(t*7+r.ph)*0.010]); }
    });
    function size(){ DPR=Math.min(1.6, window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight;
      cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
    function comet(r,prog,claro){ var fi=prog*(r.pts.length-1), i0=Math.floor(fi), f=fi-i0;
      var a=r.pts[i0], bpt=r.pts[Math.min(i0+1,r.pts.length-1)];
      var cx=(a[0]+(bpt[0]-a[0])*f)*W, cy=(a[1]+(bpt[1]-a[1])*f)*H;
      var g=ctx.createRadialGradient(cx,cy,0,cx,cy,9);
      g.addColorStop(0, claro?'rgba(224,30,55,0.38)':'rgba(255,90,120,0.55)');
      g.addColorStop(1, claro?'rgba(224,30,55,0)':'rgba(255,45,75,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.fill(); }
    function paint(now){
      ctx.clearRect(0,0,W,H);
      // so os POROS (pontos de brilho animados) · sem linhas de rota, nos 2 temas
      var claro=document.body.classList.contains('light');
      var t=(now||0)/1000;
      routes.forEach(function(r){
        comet(r, ((t*r.sp)+r.off)%1, claro);
        comet(r, ((t*r.sp)+r.off+0.5)%1, claro);
      });
    }
    window.__bgRepaint=function(){ if(reduce) paint(6000); };
    function loop(now){ paint(now); raf=requestAnimationFrame(loop); }
    size();
    if(reduce){ paint(6000); }
    else {
      loop(0);
      document.addEventListener('visibilitychange',function(){ if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf=null; } else if(!raf){ loop(performance.now()); } });
    }
    var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ size(); if(reduce) paint(6000); },160); });
  })();
}

/* Resolução do dado: com ?c=TOKEN busca o dado do cliente no n8n; sem token = amostra (dados-exemplo.js). */
(function(){
  var c = new URLSearchParams(location.search).get('c');
  if(!c){ __boot(); return; }
  var API = 'https://rastcar.app.n8n.cloud/webhook/inteligencia-dados?c=' + encodeURIComponent(c);
  var ld = document.createElement('div');
  ld.className = 'rc-ovl';
  ld.textContent = 'Carregando seu relatório…';
  /* o tema so e aplicado no fim do script · aqui a tela de servico ja nasce
     no tema certo, senao ela pisca preta antes de clarear */
  try{ if(localStorage.getItem('rc_int_tema') !== 'escuro') document.body.classList.add('light'); }catch(e){ document.body.classList.add('light'); }
  document.body.appendChild(ld);
  fetch(API, { cache: 'no-store' })
    .then(function(r){ if(!r.ok){ var e = new Error('http ' + r.status); e.status = r.status; throw e; } return r.json(); })
    .then(function(d){
      window.RC_DADOS = d;
      ld.remove();
      __boot();
      if (d && d.amostra === false) {
        Array.prototype.forEach.call(document.querySelectorAll('*'), function(n){
          if (n.children.length === 0 && n.textContent.trim() === 'AMOSTRA') { n.style.display = 'none'; }
        });
      }
    })
    .catch(function(err){
      var pago = err && err.status === 402;
      var titulo = pago ? 'Relatório indisponível no momento' : 'Não foi possível carregar este relatório';
      var apoio  = pago ? 'Fale com a Rastcar para reativar o acesso, <span style="white-space:nowrap">(12) 3157-9090</span>' : 'Confira se o link está completo e correto.';
      ld.innerHTML = '<div style="max-width:440px"><div class="k">RASTCAR INTELIGÊNCIA</div>' +
                     '<div class="t">' + titulo + '</div><div class="s">' + apoio + '</div></div>';
    });
})();

// ---------- Modo claro / escuro (persistido; CLARO e o padrao) ----------
(function(){
  var btn = document.getElementById('themeBtn'); if(!btn) return;
  function aplicar(claro, grava){
    document.body.classList.toggle('light', claro);
    btn.textContent = claro ? 'Modo escuro' : 'Modo claro';
    if(grava){ try{ localStorage.setItem('rc_int_tema', claro ? 'claro' : 'escuro'); }catch(e){} }
    if(window.__bgRepaint) window.__bgRepaint();
  }
  var salvo = null;
  try{ salvo = localStorage.getItem('rc_int_tema'); }catch(e){}
  aplicar(salvo !== 'escuro', false);   // so a escolha DELE vai pro armazenamento
  btn.addEventListener('click', function(){ aplicar(!document.body.classList.contains('light'), true); });
})();
</script>
<script>
/* =====================================================================
   RELATORIO · CAMADA DE MATERIAL (par do CSS)
   1. MATERIA ATRAS · injeta os orbes; sem eles o vidro claro nao tem o
      que refratar e some
   2. GOTA D'AGUA   · onda de luz onde o dedo toca
   (O tema claro por padrao mora na propria IIFE de tema do relatorio.)
   ===================================================================== */
(function(){
  'use strict';

  if(!document.getElementById('rcOrbes')){
    var orbes = document.createElement('div');
    orbes.id = 'rcOrbes';
    orbes.setAttribute('aria-hidden','true');
    orbes.innerHTML = '<i></i><i></i><i></i>';
    document.body.insertBefore(orbes, document.body.firstChild);
  }

  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var ALVOS = '.dgrid > .dline, .urow, .acard, .rrow, .crow';
  document.addEventListener('pointerdown', function(ev){
    var alvo = ev.target && ev.target.closest ? ev.target.closest(ALVOS) : null;
    if(!alvo) return;

    var r = alvo.getBoundingClientRect();
    var x = ev.clientX - r.left, y = ev.clientY - r.top;
    /* Raio: o canto mais distante, MAS limitado pelo lado curto do elemento.
       Numa fileira de 1370x96 a regra do canto daria r=1000 e a onda viraria
       um lavado sobre a lamina inteira · limitada, ela le como gota mesmo. */
    var canto = Math.max(
      Math.hypot(x, y),            Math.hypot(r.width - x, y),
      Math.hypot(x, r.height - y), Math.hypot(r.width - x, r.height - y)
    );
    var raio = Math.max(88, Math.min(canto, 2.4 * Math.min(r.width, r.height)));

    var g = document.createElement('span');
    g.className = 'rc-gota';
    g.style.width = g.style.height = (raio * 2) + 'px';
    g.style.left = x + 'px';
    g.style.top  = y + 'px';
    alvo.appendChild(g);
    g.addEventListener('animationend', function(){ g.remove(); });
  }, {passive:true});
})();

/* ---------- Os controles saem da frente da leitura ----------
   Nascem escondidos (a capa e a primeira impressao), somem enquanto a
   pessoa desce e voltam quando ela para ou sobe. Ninguem baixa o PDF
   antes de olhar o relatorio, entao esconder no topo nao custa nada. */
(function(){
  var corpo = document.body, ultimo = window.scrollY || 0, parada = 0;
  function esconde(v){ corpo.classList.toggle('fabs-off', v); }
  esconde(true);
  window.addEventListener('scroll', function(){
    var y = window.scrollY;
    if(y < 40)               esconde(true);   /* de volta a capa */
    else if(y > ultimo + 4)  esconde(true);   /* descendo: sai da frente */
    else if(y < ultimo - 4)  esconde(false);  /* subindo: volta */
    ultimo = y;
    clearTimeout(parada);
    parada = setTimeout(function(){ if(window.scrollY >= 40) esconde(false); }, 420);
  }, {passive:true});
})();
</script>
